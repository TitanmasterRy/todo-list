<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Fishing</title>
<style>
  :root { --bg: #bfe6ff; --fg: #12324a; --accent: #2e7d32; --accent-2: #ffb300; --glow: color-mix(in srgb, var(--accent) 50%, transparent); --panel: rgba(255,255,255,.65); --line: rgba(18,50,74,.12); --shadow: rgba(18,50,74,.25); --btn-ink: #fff; }
  body.dark { --bg: #0f2438; --fg: #e6f4ff; --panel: rgba(255,255,255,.08); --line: rgba(255,255,255,.14); --shadow: rgba(0,0,0,.5); }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 500 15px/1.35 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; overflow: hidden; touch-action: none; user-select: none; }
  canvas { display: block; width: 100vw; height: 100vh; }
  .hud { position: fixed; top: 8px; left: 12px; display: flex; gap: 8px; flex-wrap: wrap; font-weight: 800; pointer-events: none; z-index: 2; }
  .hud > span { padding: 6px 14px; border-radius: 999px; background: linear-gradient(180deg, color-mix(in srgb, var(--panel) 100%, #fff 6%), var(--panel)); border: 1px solid var(--line); box-shadow: inset 0 1px 0 rgba(255,255,255,.2), 0 4px 14px var(--shadow); font-size: 13px; letter-spacing: .04em; text-transform: uppercase; backdrop-filter: blur(6px); }
  .hud b { display: inline-block; font-size: 16px; font-variant-numeric: tabular-nums; color: var(--accent); margin-left: 4px; text-shadow: 0 0 10px var(--glow); }
  .center { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; text-align: center; z-index: 3; }
  .center > div { padding: 18px 26px; border-radius: 22px; background: linear-gradient(180deg, color-mix(in srgb, var(--panel) 100%, #fff 8%), var(--panel)); border: 1px solid var(--line); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 35%, transparent), 0 0 34px var(--glow), 0 22px 50px var(--shadow); backdrop-filter: blur(10px); max-width: 86vw; box-sizing: border-box; }
  .center h2 { margin: 0 0 6px; font-size: clamp(24px, 6vw, 34px); font-weight: 900; letter-spacing: -0.02em; background: linear-gradient(90deg, var(--accent), var(--accent-2)); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 0 14px var(--glow)); }
  .center p { margin: 0 0 14px; font-weight: 600; opacity: .85; }
  .center button { pointer-events: auto; font: inherit; padding: 10px 22px; border: 0; border-radius: 999px; background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: var(--btn-ink); font-weight: 900; letter-spacing: .02em; cursor: pointer; box-shadow: 0 8px 22px var(--glow), inset 0 1px 0 rgba(255,255,255,.4); transition: filter .12s, box-shadow .12s, transform .12s; }
  .center button:hover { filter: brightness(1.08); box-shadow: 0 12px 28px var(--glow), inset 0 1px 0 rgba(255,255,255,.4); }
  .center button:active { transform: scale(.96); animation: none; }
  /* juice */
  .pop { animation: pop .38s cubic-bezier(.3,1.6,.5,1); }
  @keyframes pop { 35% { transform: scale(1.35); } }
  .nb { animation: nb 1.1s ease-in-out 3; }
  @keyframes nb { 50% { color: #ffd54a; text-shadow: 0 0 14px #ffc93a, 0 0 28px #ff9f1a; } }
  .fx { position: fixed; z-index: 9; pointer-events: none; font: 900 20px system-ui, sans-serif; color: var(--accent); text-shadow: 0 0 12px var(--glow), 0 2px 0 rgba(0,0,0,.3); transform: translate(-50%, -50%); animation: rise .8s ease-out forwards; white-space: nowrap; }
  @keyframes rise { to { transform: translate(-50%, -160%); opacity: 0; } }
  .spark { position: fixed; z-index: 9; pointer-events: none; width: 7px; height: 7px; border-radius: 50%; margin: -3px 0 0 -3px; box-shadow: 0 0 8px currentColor; animation: spark .6s ease-out forwards; }
  @keyframes spark { to { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; } }
  body.flash::after { content: ''; position: fixed; inset: 0; z-index: 8; pointer-events: none; background: var(--flash, rgba(255,70,90,.4)); animation: flash .45s ease-out forwards; }
  @keyframes flash { to { opacity: 0; } }
  body.shake canvas { animation: shake .4s; }
  @keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
  @media (prefers-reduced-motion: no-preference) { #go { animation: float 2.4s ease-in-out infinite; } }
  @keyframes float { 50% { transform: translateY(-4px); } }
  @media (prefers-reduced-motion: reduce) { .pop, .nb, .fx, .spark, body.flash::after, body.shake canvas { animation-duration: .01s; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud"><span>Score <b id="score">0</b></span><span>⏱ <b id="time">60</b>s</span><span id="last" hidden></span></div>
<div class="center" id="menu"><div><h2>🎣 Fishing</h2><p>Move the boat with the mouse, a finger or ← →. Click, tap or press Space to drop the line. Big fish swim deep and score more; leave the old boots alone. 60 seconds.</p><button id="go">Start</button></div></div>
<script>
  const q = new URLSearchParams(location.search);
  if (q.get('accent')) document.documentElement.style.setProperty('--accent', q.get('accent'));
  const dark = q.get('dark') === '1';
  if (dark) document.body.classList.add('dark');
  const report = (score) => parent.postMessage({ type: 'hwtodo:score', score }, '*');
  // --- visual juice (no game logic here) ---
  const FX = (() => {
    const calm = matchMedia('(prefers-reduced-motion: reduce)').matches; let live = 0;
    const re = (el, cls) => { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); };
    const at = (el) => { const r = el.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; };
    const text = (t, x, y, color) => { if (live > 40) return; live++; const d = document.createElement('div'); d.className = 'fx'; d.textContent = t; d.style.left = x + 'px'; d.style.top = y + 'px'; if (color) d.style.color = color; document.body.appendChild(d); setTimeout(() => { d.remove(); live--; }, 800); };
    const burst = (x, y, color, k = 8) => { if (calm) return; for (let i = 0; i < k && live < 40; i++) { live++; const d = document.createElement('i'); d.className = 'spark'; const a = Math.random() * 6.283, r = 26 + Math.random() * 44; d.style.cssText = `left:${x}px;top:${y}px;color:${color};background:${color};--dx:${Math.cos(a) * r}px;--dy:${Math.sin(a) * r}px`; document.body.appendChild(d); setTimeout(() => { d.remove(); live--; }, 600); } };
    const flash = (color) => { document.body.style.setProperty('--flash', color || ''); re(document.body, 'flash'); setTimeout(() => document.body.classList.remove('flash'), 500); };
    const shake = () => { if (calm) return; re(document.body, 'shake'); setTimeout(() => document.body.classList.remove('shake'), 450); };
    const watch = (id, opts = {}) => { const el = document.getElementById(id); if (!el) return; let prev = parseFloat(el.textContent) || 0; new MutationObserver(() => { const v = parseFloat(el.textContent); if (isNaN(v) || v === prev) return; const d = v - prev; prev = v; re(el, 'pop'); if (opts.best) { re(el, 'nb'); const [x, y] = at(el); text('New best!', x, y - 10, '#ffd54a'); } else if (opts.delta && d > 0) { const [x, y] = at(el); text('+' + Math.round(d), x, y - 8); } }).observe(el, { childList: true, characterData: true, subtree: true }); };
    const cpt = (cv, cx, cy, cw, ch) => { const r = cv.getBoundingClientRect(); return [r.left + (cx / cw) * r.width, r.top + (cy / ch) * r.height]; };
    return { calm, text, burst, flash, shake, watch, at, cpt, re };
  })();
  FX.watch('score'); FX.watch('last');
  const bubs = Array.from({ length: 18 }, () => ({ x: Math.random(), y: Math.random(), r: 1.5 + Math.random() * 3, s: 0.3 + Math.random() * 0.7 }));
  const c = document.getElementById('c'), x = c.getContext('2d'), $ = (id) => document.getElementById(id);
  // [emoji, points, depth band 0..1, speed]
  const KINDS = [['🐟', 10, 0.15, 1.6], ['🐠', 20, 0.35, 1.9], ['🐡', 30, 0.55, 1.2], ['🦑', 45, 0.7, 2.2], ['🐙', 60, 0.85, 1], ['🥾', -15, 0.5, 0.6]];
  let W, H, water, boat, fish, hook, score, left, running = false, t = 0, keys = {}, endAt = 0, last = '';
  function size() { W = c.width = innerWidth; H = c.height = innerHeight; water = Math.max(90, H * 0.22); }
  addEventListener('resize', size); size(); boat = W / 2;
  function start() { fish = []; score = 0; hook = null; running = true; t = 0; endAt = performance.now() + 60000; last = ''; $('menu').style.display = 'none'; for (let i = 0; i < 7; i++) spawn(true); hud(); }
  function hud() { $('score').textContent = score; $('time').textContent = Math.max(0, Math.ceil(left)); $('last').textContent = last; $('last').hidden = !last; }
  function spawn(anywhere) {
    const k = KINDS[Math.random() < 0.12 ? 5 : Math.floor(Math.random() * 5)];
    const dir = Math.random() < 0.5 ? 1 : -1;
    const depth = water + 30 + (k[2] + (Math.random() - 0.5) * 0.15) * (H - water - 70);
    fish.push({ e: k[0], pts: k[1], y: Math.min(H - 30, depth), x: anywhere ? Math.random() * W : dir > 0 ? -30 : W + 30, v: dir * k[3] * (0.7 + Math.random() * 0.6), wob: Math.random() * 6 });
  }
  function cast() {
    if (!running) return start();
    if (!hook) hook = { x: boat, y: water, dir: 1, caught: null };
  }
  function step(now) {
    x.clearRect(0, 0, W, H);
    // sky and water
    x.fillStyle = dark ? '#0f2438' : '#bfe6ff'; x.fillRect(0, 0, W, water);
    const g = x.createLinearGradient(0, water, 0, H); g.addColorStop(0, dark ? '#134a6b' : '#4fb3e8'); g.addColorStop(1, dark ? '#061a2a' : '#0b4f7c');
    x.fillStyle = g; x.fillRect(0, water, W, H - water);
    x.shadowColor = dark ? '#fff4c2' : '#ffd54a'; x.shadowBlur = 30; x.fillStyle = dark ? '#fff4c2' : '#ffd54a'; x.beginPath(); x.arc(W - 80, 60, 26, 0, Math.PI * 2); x.fill(); x.shadowBlur = 0;
    x.fillStyle = 'rgba(255,255,255,.25)'; for (const b of bubs) { b.y -= b.s * 0.0012; if (b.y < 0.02) { b.y = 1; b.x = Math.random(); } x.beginPath(); x.arc(b.x * W, water + b.y * (H - water), b.r, 0, Math.PI * 2); x.fill(); }
    x.fillStyle = '#3f8f3a'; for (let i = 0; i < W; i += 38) { x.beginPath(); x.ellipse(i + 10, H, 12, 40 + (i % 3) * 14, 0, 0, Math.PI * 2); x.fill(); }
    if (running) {
      t++;
      left = (endAt - now) / 1000;
      if (keys.left) boat -= 7; if (keys.right) boat += 7; boat = Math.max(30, Math.min(W - 30, boat));
      if (fish.length < 8 && t % 40 === 0) spawn(false);
      for (const f of fish) f.x += f.v;
      fish = fish.filter((f) => f.x > -60 && f.x < W + 60 || f.hooked);
      if (hook) {
        if (!hook.caught) {
          hook.y += 6 * hook.dir;
          if (hook.y > H - 20) hook.dir = -1;
          for (const f of fish) if (!f.hooked && Math.abs(f.x - hook.x) < 22 && Math.abs(f.y - hook.y) < 16) { f.hooked = true; hook.caught = f; hook.dir = -1; break; }
        } else hook.y -= 5;
        if (hook.caught) { hook.caught.x = hook.x; hook.caught.y = hook.y + 14; }
        if (hook.dir < 0 && hook.y <= water) {
          if (hook.caught) { score = Math.max(0, score + hook.caught.pts); last = `${hook.caught.e} ${hook.caught.pts > 0 ? '+' : ''}${hook.caught.pts}`; if (hook.caught.pts > 0) { FX.burst(hook.x, water, hook.caught.pts >= 45 ? '#ffd54a' : '#8fd3ff', hook.caught.pts >= 45 ? 12 : 7); FX.text('+' + hook.caught.pts, hook.x, water - 60, hook.caught.pts >= 45 ? '#ffd54a' : ''); } else { FX.flash('rgba(120,90,60,.3)'); FX.shake(); FX.text(String(hook.caught.pts), hook.x, water - 60, '#ff6b6b'); } fish = fish.filter((f) => f !== hook.caught); }
          hook = null;
        }
      }
      hud();
      if (left <= 0) { running = false; hook = null; report(score); $('menu').style.display = 'grid'; $('menu').querySelector('h2').textContent = `🎣 Score ${score}`; $('go').textContent = 'Again'; }
    }
    x.font = '30px system-ui'; x.textAlign = 'center'; x.textBaseline = 'middle';
    for (const f of fish || []) { x.save(); x.translate(f.x, f.y + Math.sin((t + f.wob * 20) / 20) * 3); if (f.v > 0 && !f.hooked) x.scale(-1, 1); x.fillText(f.e, 0, 0); x.restore(); }
    // boat and line
    x.font = '44px system-ui'; x.fillText('🛶', boat, water - 14);
    x.font = '26px system-ui'; x.fillText('🧑', boat - 6, water - 38);
    if (hook) { x.strokeStyle = dark ? '#e6f4ff' : '#12324a'; x.lineWidth = 1.5; x.beginPath(); x.moveTo(boat + 16, water - 46); x.lineTo(hook.x, hook.y); x.stroke(); x.shadowColor = '#ffd54a'; x.shadowBlur = hook.caught ? 16 : 0; x.font = '16px system-ui'; x.fillText('🪝', hook.x, hook.y); x.shadowBlur = 0; }
    requestAnimationFrame(step);
  }
  addEventListener('pointermove', (e) => { if (!hook) boat = e.clientX; });
  addEventListener('pointerdown', (e) => { if (e.target.id === 'go') return; if (running) { boat = hook ? boat : e.clientX; cast(); } });
  addEventListener('keydown', (e) => { if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true; if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true; if (e.key === ' ') { e.preventDefault(); cast(); } });
  addEventListener('keyup', (e) => { if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false; if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false; });
  $('go').onclick = start; requestAnimationFrame(step);
</script>
</body>
</html>
