<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bubble pop</title>
<style>
  :root { --bg: #ffe3f1; --bg-2: #e3f2ff; --fg: #5a3350; --accent: #ff6fae; --accent-2: #8fd3ff; --glow: color-mix(in srgb, var(--accent) 50%, transparent); --panel: rgba(255,255,255,.65); --line: rgba(90,51,80,.12); --shadow: rgba(90,51,80,.22); --btn-ink: #fff; }
  body.dark { --bg: #2a1a2e; --bg-2: #1a2233; --fg: #ffd6ec; --panel: rgba(255,255,255,.08); --line: rgba(255,255,255,.14); --shadow: rgba(0,0,0,.5); }
  html, body { margin: 0; height: 100%; color: var(--fg); font: 500 15px/1.35 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; overflow: hidden; touch-action: none; user-select: none; }
  body { background: radial-gradient(90% 60% at 20% 0%, color-mix(in srgb, var(--accent) 30%, transparent), transparent 60%), radial-gradient(90% 60% at 90% 100%, color-mix(in srgb, var(--accent-2) 35%, transparent), transparent 60%), linear-gradient(var(--bg), var(--bg-2)); }
  canvas { display: block; width: 100vw; height: 100vh; cursor: crosshair; }
  .hud { position: fixed; top: 8px; left: 12px; display: flex; gap: 8px; flex-wrap: wrap; font-weight: 800; pointer-events: none; z-index: 2; }
  .hud > span { padding: 6px 14px; border-radius: 999px; background: linear-gradient(180deg, color-mix(in srgb, var(--panel) 100%, #fff 6%), var(--panel)); border: 1px solid var(--line); box-shadow: inset 0 1px 0 rgba(255,255,255,.2), 0 4px 14px var(--shadow); font-size: 13px; letter-spacing: .04em; text-transform: uppercase; backdrop-filter: blur(6px); }
  .hud b { display: inline-block; font-size: 16px; font-variant-numeric: tabular-nums; color: var(--accent); margin-left: 4px; text-shadow: 0 0 10px var(--glow); }
  .center { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; text-align: center; z-index: 3; }
  .center > div { padding: 18px 26px; border-radius: 22px; background: linear-gradient(180deg, color-mix(in srgb, var(--panel) 100%, #fff 8%), var(--panel)); border: 1px solid var(--line); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 35%, transparent), 0 0 34px var(--glow), 0 22px 50px var(--shadow); backdrop-filter: blur(10px); max-width: 86vw; box-sizing: border-box; }
  .center h2 { margin: 0 0 6px; font-size: clamp(24px, 6vw, 34px); font-weight: 900; letter-spacing: -0.02em; background: linear-gradient(90deg, var(--accent), var(--accent-2)); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 0 14px var(--glow)); }
  .center p { margin: 0 0 14px; font-weight: 600; opacity: .85; }
  .center button { pointer-events: auto; font: inherit; padding: 10px 22px; border: 0; border-radius: 999px; background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: var(--btn-ink); font-weight: 900; letter-spacing: .02em; cursor: pointer; box-shadow: 0 8px 22px var(--glow), inset 0 1px 0 rgba(255,255,255,.4); transition: filter .12s, box-shadow .12s, transform .12s; }
  .center button:hover { filter: brightness(1.08); box-shadow: 0 12px 28px var(--glow), inset 0 1px 0 rgba(255,255,255,.4); }
  .center button:active { transform: scale(.96); animation: none; }
  /* juice */
  .pop { animation: pop .38s cubic-bezier(.3,1.6,.5,1); }
  @keyframes pop { 35% { transform: scale(1.35); } }
  .nb { animation: nb 1.1s ease-in-out 3; }
  @keyframes nb { 50% { color: #ffd54a; text-shadow: 0 0 14px #ffc93a, 0 0 28px #ff9f1a; } }
  .fx { position: fixed; z-index: 9; pointer-events: none; font: 900 20px system-ui, sans-serif; color: var(--accent); text-shadow: 0 0 12px var(--glow), 0 2px 0 rgba(0,0,0,.3); transform: translate(-50%, -50%); animation: rise .8s ease-out forwards; white-space: nowrap; }
  @keyframes rise { to { transform: translate(-50%, -160%); opacity: 0; } }
  .spark { position: fixed; z-index: 9; pointer-events: none; width: 7px; height: 7px; border-radius: 50%; margin: -3px 0 0 -3px; box-shadow: 0 0 8px currentColor; animation: spark .6s ease-out forwards; }
  @keyframes spark { to { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; } }
  body.flash::after { content: ''; position: fixed; inset: 0; z-index: 8; pointer-events: none; background: var(--flash, rgba(255,70,90,.4)); animation: flash .45s ease-out forwards; }
  @keyframes flash { to { opacity: 0; } }
  body.shake canvas { animation: shake .4s; }
  @keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
  @media (prefers-reduced-motion: no-preference) { #go { animation: float 2.4s ease-in-out infinite; } }
  @keyframes float { 50% { transform: translateY(-4px); } }
  @media (prefers-reduced-motion: reduce) { .pop, .nb, .fx, .spark, body.flash::after, body.shake canvas { animation-duration: .01s; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud"><span>Score <b id="score">0</b></span><span id="lives">🫧🫧🫧🫧🫧</span><span id="combo" hidden></span></div>
<div class="center" id="menu"><div><h2>🫧 Bubble pop</h2><p>Pop the bubbles before they float away.<br />Pop the same color in a row for a combo. Don't pop the spiky ones!<br />Click or tap, or move with the arrow keys and press Space.</p><button id="go">Start</button></div></div>
<script>
  const q = new URLSearchParams(location.search);
  if (q.get('accent')) document.documentElement.style.setProperty('--accent', q.get('accent'));
  if (q.get('dark') === '1') document.body.classList.add('dark');
  const report = (score) => parent.postMessage({ type: 'hwtodo:score', score }, '*');
  // --- visual juice (no game logic here) ---
  const FX = (() => {
    const calm = matchMedia('(prefers-reduced-motion: reduce)').matches; let live = 0;
    const re = (el, cls) => { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); };
    const at = (el) => { const r = el.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; };
    const text = (t, x, y, color) => { if (live > 40) return; live++; const d = document.createElement('div'); d.className = 'fx'; d.textContent = t; d.style.left = x + 'px'; d.style.top = y + 'px'; if (color) d.style.color = color; document.body.appendChild(d); setTimeout(() => { d.remove(); live--; }, 800); };
    const burst = (x, y, color, k = 8) => { if (calm) return; for (let i = 0; i < k && live < 40; i++) { live++; const d = document.createElement('i'); d.className = 'spark'; const a = Math.random() * 6.283, r = 26 + Math.random() * 44; d.style.cssText = `left:${x}px;top:${y}px;color:${color};background:${color};--dx:${Math.cos(a) * r}px;--dy:${Math.sin(a) * r}px`; document.body.appendChild(d); setTimeout(() => { d.remove(); live--; }, 600); } };
    const flash = (color) => { document.body.style.setProperty('--flash', color || ''); re(document.body, 'flash'); setTimeout(() => document.body.classList.remove('flash'), 500); };
    const shake = () => { if (calm) return; re(document.body, 'shake'); setTimeout(() => document.body.classList.remove('shake'), 450); };
    const watch = (id, opts = {}) => { const el = document.getElementById(id); if (!el) return; let prev = parseFloat(el.textContent) || 0; new MutationObserver(() => { const v = parseFloat(el.textContent); if (isNaN(v) || v === prev) return; const d = v - prev; prev = v; re(el, 'pop'); if (opts.best) { re(el, 'nb'); const [x, y] = at(el); text('New best!', x, y - 10, '#ffd54a'); } else if (opts.delta && d > 0) { const [x, y] = at(el); text('+' + Math.round(d), x, y - 8); } }).observe(el, { childList: true, characterData: true, subtree: true }); };
    const cpt = (cv, cx, cy, cw, ch) => { const r = cv.getBoundingClientRect(); return [r.left + (cx / cw) * r.width, r.top + (cy / ch) * r.height]; };
    return { calm, text, burst, flash, shake, watch, at, cpt, re };
  })();
  FX.watch('score'); FX.watch('lives'); FX.watch('combo');
  const c = document.getElementById('c'), x = c.getContext('2d'), $ = (id) => document.getElementById(id);
  const COLORS = [['#ff8fc4', '🐰'], ['#8fd3ff', '🐳'], ['#ffd97a', '🐥'], ['#a8e6a1', '🐸'], ['#c9a8ff', '🦄']];
  let W, H, bubbles, pops, score, lives, combo, lastColor, running = false, t = 0, cx, cy, keys = {};
  function size() { W = c.width = innerWidth; H = c.height = innerHeight; cx = W / 2; cy = H / 2; }
  addEventListener('resize', size); size();
  function start() { bubbles = []; pops = []; score = 0; lives = 5; combo = 0; lastColor = -1; t = 0; running = true; $('menu').style.display = 'none'; hud(); }
  function hud() { $('score').textContent = score; $('lives').textContent = '🫧'.repeat(Math.max(0, lives)) || '💔'; $('combo').textContent = combo > 1 ? `combo ×${combo}` : ''; $('combo').hidden = combo <= 1; }
  function spawn() {
    const spiky = Math.random() < 0.1 + Math.min(0.1, t / 30000);
    const k = Math.floor(Math.random() * COLORS.length);
    const r = 22 + Math.random() * 20;
    bubbles.push({ x: r + Math.random() * (W - 2 * r), y: H + r, r, v: 0.8 + Math.random() * 0.9 + t / 4000, k, spiky, wob: Math.random() * 6 });
  }
  function popAt(px, py) {
    if (!running) return;
    for (let i = bubbles.length - 1; i >= 0; i--) {
      const b = bubbles[i];
      if (Math.hypot(b.x - px, b.y - py) <= b.r + 6) {
        bubbles.splice(i, 1);
        pops.push({ x: b.x, y: b.y, r: b.r, life: 1, spiky: b.spiky });
        if (b.spiky) { lives--; combo = 0; lastColor = -1; FX.flash(); FX.shake(); FX.burst(b.x, b.y, '#7a6f80', 8); }
        else { combo = b.k === lastColor ? combo + 1 : 1; lastColor = b.k; const pts = 10 * combo + Math.round(40 - b.r); score += pts; FX.burst(b.x, b.y, COLORS[b.k][0], combo > 1 ? 10 : 6); FX.text('+' + pts + (combo > 1 ? ' ×' + combo : ''), b.x, b.y - b.r - 6, combo > 2 ? '#ffd54a' : COLORS[b.k][0]); }
        hud();
        if (lives <= 0) end();
        return;
      }
    }
  }
  function end() { running = false; report(score); $('menu').style.display = 'grid'; $('menu').querySelector('h2').textContent = `🫧 Score ${score}`; $('go').textContent = 'Again'; }
  function draw(b) {
    x.save(); x.translate(b.x, b.y);
    if (b.spiky) {
      x.fillStyle = '#7a6f80'; x.beginPath();
      for (let i = 0; i < 24; i++) { const a = (i / 24) * Math.PI * 2, rr = i % 2 ? b.r : b.r + 8; x.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); }
      x.closePath(); x.fill(); x.font = `${b.r}px system-ui`; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText('😠', 0, 2);
    } else {
      const g = x.createRadialGradient(-b.r / 3, -b.r / 3, b.r / 6, 0, 0, b.r);
      g.addColorStop(0, 'rgba(255,255,255,0.9)'); g.addColorStop(1, COLORS[b.k][0]);
      x.shadowColor = COLORS[b.k][0]; x.shadowBlur = 14;
      x.fillStyle = g; x.globalAlpha = 0.85; x.beginPath(); x.arc(0, 0, b.r, 0, Math.PI * 2); x.fill(); x.globalAlpha = 1; x.shadowBlur = 0;
      x.strokeStyle = 'rgba(255,255,255,0.8)'; x.lineWidth = 2; x.stroke();
      x.font = `${b.r * 0.9}px system-ui`; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(COLORS[b.k][1], 0, 2);
    }
    x.restore();
  }
  function step() {
    x.clearRect(0, 0, W, H);
    if (running) {
      t++;
      if (keys.left) cx -= 8; if (keys.right) cx += 8; if (keys.up) cy -= 8; if (keys.down) cy += 8;
      cx = Math.max(0, Math.min(W, cx)); cy = Math.max(0, Math.min(H, cy));
      if (t % Math.max(18, 55 - Math.floor(t / 250)) === 0) spawn();
      for (const b of bubbles) { b.y -= b.v; b.x += Math.sin((t + b.wob * 30) / 40) * 0.6; }
      for (let i = bubbles.length - 1; i >= 0; i--) {
        if (bubbles[i].y < -bubbles[i].r) { if (!bubbles[i].spiky) { lives--; combo = 0; lastColor = -1; hud(); FX.flash('rgba(255,70,90,.25)'); } bubbles.splice(i, 1); }
      }
      if (lives <= 0) end();
    }
    (bubbles || []).forEach(draw);
    pops = (pops || []).filter((p) => (p.life -= 0.05) > 0);
    for (const p of pops) { x.strokeStyle = p.spiky ? `rgba(120,100,130,${p.life})` : `rgba(255,255,255,${p.life})`; x.lineWidth = 3; x.beginPath(); x.arc(p.x, p.y, p.r * (2 - p.life), 0, Math.PI * 2); x.stroke(); }
    if (running) { x.strokeStyle = 'rgba(90,51,80,0.7)'; x.lineWidth = 2; x.beginPath(); x.arc(cx, cy, 12, 0, Math.PI * 2); x.moveTo(cx - 18, cy); x.lineTo(cx + 18, cy); x.moveTo(cx, cy - 18); x.lineTo(cx, cy + 18); x.stroke(); }
    requestAnimationFrame(step);
  }
  addEventListener('pointerdown', (e) => { cx = e.clientX; cy = e.clientY; popAt(e.clientX, e.clientY); });
  addEventListener('pointermove', (e) => { cx = e.clientX; cy = e.clientY; });
  const map = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down' };
  addEventListener('keydown', (e) => { if (map[e.key]) { keys[map[e.key]] = true; e.preventDefault(); } if (e.key === ' ') { e.preventDefault(); running ? popAt(cx, cy) : start(); } });
  addEventListener('keyup', (e) => { if (map[e.key]) keys[map[e.key]] = false; });
  $('go').onclick = (e) => { e.stopPropagation(); start(); }; step();
</script>
</body>
</html>
