<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sudoku</title>
<style>
  :root { --bg: #0f1115; --fg: #e8eaf0; --accent: #6c5ce7; --cell: #1f232c; --given: #e8eaf0; --mine: #9ab4ff; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--fg); font: 15px system-ui, sans-serif; display: grid; place-items: center; }
  .wrap { display: grid; gap: 10px; justify-items: center; padding: 10px; }
  .grid { display: grid; grid-template-columns: repeat(9, 1fr); width: min(430px, 94vw); aspect-ratio: 1; border: 3px solid var(--fg); }
  .c { border: 1px solid #3a4150; background: var(--cell); color: var(--mine); font-size: clamp(16px, 5vw, 24px); font-weight: 700; display: grid; place-items: center; cursor: pointer; user-select: none; }
  .c.g { color: var(--given); cursor: default; }
  .c.sel { background: color-mix(in srgb, var(--accent) 40%, var(--cell)); }
  .c.peer { background: color-mix(in srgb, var(--accent) 14%, var(--cell)); }
  .c.bad { color: #ff6b6b; }
  .c:nth-child(9n + 3), .c:nth-child(9n + 6) { border-right: 2px solid var(--fg); }
  .c:nth-child(n + 19):nth-child(-n + 27), .c:nth-child(n + 46):nth-child(-n + 54) { border-bottom: 2px solid var(--fg); }
  .pad { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; width: min(430px, 94vw); }
  button { font: inherit; padding: 8px 0; border: 0; border-radius: 6px; background: #2a2f3a; color: var(--fg); font-weight: 700; cursor: pointer; }
  .bar { display: flex; gap: 8px; align-items: center; }
  .bar button { padding: 6px 12px; background: var(--accent); color: #fff; }
  select { font: inherit; padding: 4px; border-radius: 6px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="bar"><select id="lvl"><option value="36">Easy</option><option value="46" selected>Medium</option><option value="54">Hard</option></select><button id="new">New puzzle</button><span id="t">0:00</span></div>
  <div class="grid" id="g"></div>
  <div class="pad" id="pad"></div>
  <div id="msg">Tap a square, then a number (or type 1–9).</div>
</div>
<script>
  const q = new URLSearchParams(location.search);
  if (q.get('accent')) document.documentElement.style.setProperty('--accent', q.get('accent'));
  if (q.get('dark') === '0') { const s = document.documentElement.style; s.setProperty('--bg', '#f6f7fb'); s.setProperty('--fg', '#171923'); s.setProperty('--cell', '#fff'); s.setProperty('--given', '#171923'); s.setProperty('--mine', '#3b5bdb'); }
  const report = (score) => parent.postMessage({ type: 'hwtodo:score', score }, '*');
  const $ = (id) => document.getElementById(id);
  let sol, board, given, sel = -1, t0, clock, done;
  const peers = (i) => { const r = (i / 9) | 0, c = i % 9, br = r - (r % 3), bc = c - (c % 3), out = new Set(); for (let k = 0; k < 9; k++) { out.add(r * 9 + k); out.add(k * 9 + c); out.add((br + ((k / 3) | 0)) * 9 + bc + (k % 3)); } out.delete(i); return out; };
  const PEERS = Array.from({ length: 81 }, (_, i) => [...peers(i)]);
  const ok = (b, i, v) => PEERS[i].every((p) => b[p] !== v);
  function fill(b) { const i = b.indexOf(0); if (i < 0) return true; for (const v of [1, 2, 3, 4, 5, 6, 7, 8, 9].sort(() => Math.random() - 0.5)) if (ok(b, i, v)) { b[i] = v; if (fill(b)) return true; b[i] = 0; } return false; }
  function count(b, limit = 2) { const i = b.indexOf(0); if (i < 0) return 1; let n = 0; for (let v = 1; v <= 9 && n < limit; v++) if (ok(b, i, v)) { b[i] = v; n += count(b, limit - n); b[i] = 0; } return n; }
  function make(holes) { sol = Array(81).fill(0); fill(sol); board = [...sol]; let removed = 0; for (const i of [...Array(81).keys()].sort(() => Math.random() - 0.5)) { if (removed >= holes) break; const v = board[i]; board[i] = 0; if (count([...board]) !== 1) board[i] = v; else removed++; } given = board.map((v) => v > 0); }
  function start() { make(+$('lvl').value); sel = -1; done = false; t0 = Date.now(); clearInterval(clock); clock = setInterval(tick, 500); $('msg').textContent = 'Tap a square, then a number (or type 1–9).'; render(); }
  function tick() { const s = Math.floor((Date.now() - t0) / 1000); $('t').textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; }
  function render() {
    const pe = sel >= 0 ? new Set(PEERS[sel]) : new Set();
    $('g').innerHTML = board.map((v, i) => `<div class="c ${given[i] ? 'g' : ''} ${i === sel ? 'sel' : ''} ${pe.has(i) ? 'peer' : ''} ${v && !given[i] && !ok(board, i, v) ? 'bad' : ''}" data-i="${i}">${v || ''}</div>`).join('');
  }
  function put(v) {
    if (sel < 0 || given[sel] || done) return; board[sel] = v; render();
    if (board.every((x, i) => x === sol[i])) { done = true; clearInterval(clock); const s = Math.floor((Date.now() - t0) / 1000); const score = Math.max(100, (+$('lvl').value) * 40 - s); $('msg').textContent = `Solved in ${$('t').textContent}! Score ${score}.`; report(score); }
  }
  $('g').addEventListener('click', (e) => { const el = e.target.closest('.c'); if (el) { sel = +el.dataset.i; render(); } });
  $('pad').innerHTML = [1, 2, 3, 4, 5, 6, 7, 8, 9].map((n) => `<button data-n="${n}">${n}</button>`).join('') + '<button data-n="0">⌫</button>';
  $('pad').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) put(+b.dataset.n); });
  addEventListener('keydown', (e) => { if (/^[1-9]$/.test(e.key)) put(+e.key); else if (e.key === 'Backspace' || e.key === '0') put(0); else if (sel >= 0 && e.key.startsWith('Arrow')) { const d = { ArrowUp: -9, ArrowDown: 9, ArrowLeft: -1, ArrowRight: 1 }[e.key]; sel = Math.max(0, Math.min(80, sel + d)); render(); e.preventDefault(); } });
  $('new').onclick = start; start();
</script>
</body>
</html>
