<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sudoku</title>
<style>
  :root { --bg: #0f1115; --fg: #e8eaf0; --accent: #6c5ce7; --accent-2: #00cec9; --cell: #1f232c; --given: #e8eaf0; --mine: #9ab4ff; --glow: color-mix(in srgb, var(--accent) 55%, transparent); --panel: rgba(255,255,255,.08); --line: rgba(255,255,255,.14); --shadow: rgba(0,0,0,.5); --grid-line: #3a4150; --btn-ink: #fff; }
  html.light { --panel: rgba(0,0,0,.06); --line: rgba(0,0,0,.1); --shadow: rgba(30,40,80,.22); --grid-line: #d5d9e6; }
  html, body { margin: 0; min-height: 100%; color: var(--fg); font: 500 15px/1.35 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; display: grid; place-items: center; }
  body { background: radial-gradient(120% 80% at 50% -10%, color-mix(in srgb, var(--accent) 26%, var(--bg)), var(--bg) 60%), var(--bg); }
  .wrap { display: grid; gap: 12px; justify-items: center; padding: 10px; }
  .title { margin: 0; font-size: clamp(24px, 6vw, 34px); font-weight: 900; letter-spacing: -0.02em; background: linear-gradient(90deg, var(--accent), var(--accent-2)); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 0 14px var(--glow)); }
  .grid { box-sizing: border-box; display: grid; grid-template-columns: repeat(9, 1fr); width: min(430px, 94vw); aspect-ratio: 1; border: 3px solid color-mix(in srgb, var(--accent) 70%, var(--fg)); border-radius: 10px; overflow: hidden; box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 45%, transparent), 0 0 34px var(--glow), 0 22px 50px var(--shadow); }
  .c { border: 1px solid var(--grid-line); background: var(--cell); background-image: linear-gradient(180deg, rgba(255,255,255,.04), rgba(0,0,0,.04)); color: var(--mine); font-size: clamp(16px, 5vw, 24px); font-weight: 800; font-variant-numeric: tabular-nums; display: grid; place-items: center; cursor: pointer; user-select: none; transition: background .12s, transform .1s; }
  .c:hover { transform: scale(1.06); z-index: 1; }
  .c.g { color: var(--given); cursor: default; }
  .c.sel { background: color-mix(in srgb, var(--accent) 45%, var(--cell)); box-shadow: inset 0 0 0 2px var(--accent), 0 0 12px var(--glow); z-index: 1; }
  .c.peer { background: color-mix(in srgb, var(--accent) 14%, var(--cell)); }
  .c.bad { color: #ff6b6b; text-shadow: 0 0 8px rgba(255,107,107,.6); }
  .c.in { animation: put .3s cubic-bezier(.3,1.6,.5,1); }
  @keyframes put { 40% { transform: scale(1.3); } }
  .c:nth-child(9n + 3), .c:nth-child(9n + 6) { border-right: 2px solid color-mix(in srgb, var(--accent) 70%, var(--fg)); }
  .c:nth-child(n + 19):nth-child(-n + 27), .c:nth-child(n + 46):nth-child(-n + 54) { border-bottom: 2px solid color-mix(in srgb, var(--accent) 70%, var(--fg)); }
  .pad { display: grid; grid-template-columns: repeat(10, 1fr); gap: 5px; width: min(430px, 94vw); }
  button { font: inherit; padding: 9px 0; border: 1px solid var(--line); border-radius: 9px; background: linear-gradient(180deg, color-mix(in srgb, var(--panel) 100%, #fff 8%), var(--panel)); color: var(--fg); font-weight: 900; font-variant-numeric: tabular-nums; cursor: pointer; box-shadow: inset 0 1px 0 rgba(255,255,255,.14), 0 4px 12px var(--shadow); transition: transform .1s, filter .1s, box-shadow .12s; }
  button:hover { transform: translateY(-2px); filter: brightness(1.15); box-shadow: inset 0 1px 0 rgba(255,255,255,.14), 0 8px 16px var(--shadow); }
  button:active { transform: scale(.94); animation: none; }
  .bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center; }
  .bar button { padding: 8px 18px; border: 0; border-radius: 999px; background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: var(--btn-ink); letter-spacing: .02em; box-shadow: 0 8px 22px var(--glow), inset 0 1px 0 rgba(255,255,255,.4); }
  .bar span { padding: 6px 14px; border-radius: 999px; background: linear-gradient(180deg, color-mix(in srgb, var(--panel) 100%, #fff 6%), var(--panel)); border: 1px solid var(--line); box-shadow: inset 0 1px 0 rgba(255,255,255,.14), 0 4px 14px var(--shadow); font-weight: 800; font-size: 15px; font-variant-numeric: tabular-nums; color: var(--accent); text-shadow: 0 0 10px var(--glow); }
  select { font: inherit; font-weight: 800; padding: 7px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); }
  select option { color: #111; }
  #msg { font-weight: 700; opacity: .85; text-align: center; }
  /* juice */
  .pop { animation: pop .38s cubic-bezier(.3,1.6,.5,1); }
  @keyframes pop { 35% { transform: scale(1.35); } }
  .fx { position: fixed; z-index: 9; pointer-events: none; font: 900 20px system-ui, sans-serif; color: var(--accent); text-shadow: 0 0 12px var(--glow), 0 2px 0 rgba(0,0,0,.3); transform: translate(-50%, -50%); animation: rise .8s ease-out forwards; white-space: nowrap; }
  @keyframes rise { to { transform: translate(-50%, -160%); opacity: 0; } }
  .spark { position: fixed; z-index: 9; pointer-events: none; width: 7px; height: 7px; border-radius: 50%; margin: -3px 0 0 -3px; box-shadow: 0 0 8px currentColor; animation: spark .6s ease-out forwards; }
  @keyframes spark { to { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; } }
  body.flash::after { content: ''; position: fixed; inset: 0; z-index: 8; pointer-events: none; background: var(--flash, rgba(255,70,90,.4)); animation: flash .45s ease-out forwards; }
  @keyframes flash { to { opacity: 0; } }
  @media (prefers-reduced-motion: no-preference) { #new { animation: float 2.4s ease-in-out infinite; } }
  @keyframes float { 50% { transform: translateY(-3px); } }
  @media (prefers-reduced-motion: reduce) { .pop, .fx, .spark, .c.in, body.flash::after { animation-duration: .01s; } }
</style>
</head>
<body>
<div class="wrap">
  <h1 class="title">🔢 Sudoku</h1>
  <div class="bar"><select id="lvl"><option value="36">Easy</option><option value="46" selected>Medium</option><option value="54">Hard</option></select><button id="new">New puzzle</button><span id="t">0:00</span></div>
  <div class="grid" id="g"></div>
  <div class="pad" id="pad"></div>
  <div id="msg">Tap a square, then a number (or type 1–9).</div>
</div>
<script>
  const q = new URLSearchParams(location.search);
  if (q.get('accent')) document.documentElement.style.setProperty('--accent', q.get('accent'));
  if (q.get('dark') === '0') { const s = document.documentElement.style; s.setProperty('--bg', '#f6f7fb'); s.setProperty('--fg', '#171923'); s.setProperty('--cell', '#fff'); s.setProperty('--given', '#171923'); s.setProperty('--mine', '#3b5bdb'); document.documentElement.classList.add('light'); }
  const report = (score) => parent.postMessage({ type: 'hwtodo:score', score }, '*');
  // --- visual juice (no game logic here) ---
  const FX = (() => {
    const calm = matchMedia('(prefers-reduced-motion: reduce)').matches; let live = 0;
    const re = (el, cls) => { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); };
    const at = (el) => { const r = el.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; };
    const text = (t, x, y, color) => { if (live > 40) return; live++; const d = document.createElement('div'); d.className = 'fx'; d.textContent = t; d.style.left = x + 'px'; d.style.top = y + 'px'; if (color) d.style.color = color; document.body.appendChild(d); setTimeout(() => { d.remove(); live--; }, 800); };
    const burst = (x, y, color, k = 8) => { if (calm) return; for (let i = 0; i < k && live < 40; i++) { live++; const d = document.createElement('i'); d.className = 'spark'; const a = Math.random() * 6.283, r = 26 + Math.random() * 44; d.style.cssText = `left:${x}px;top:${y}px;color:${color};background:${color};--dx:${Math.cos(a) * r}px;--dy:${Math.sin(a) * r}px`; document.body.appendChild(d); setTimeout(() => { d.remove(); live--; }, 600); } };
    const flash = (color) => { document.body.style.setProperty('--flash', color || ''); re(document.body, 'flash'); setTimeout(() => document.body.classList.remove('flash'), 500); };
    return { calm, text, burst, flash, at, re };
  })();
  const $ = (id) => document.getElementById(id);
  let sol, board, given, sel = -1, t0, clock, done;
  const peers = (i) => { const r = (i / 9) | 0, c = i % 9, br = r - (r % 3), bc = c - (c % 3), out = new Set(); for (let k = 0; k < 9; k++) { out.add(r * 9 + k); out.add(k * 9 + c); out.add((br + ((k / 3) | 0)) * 9 + bc + (k % 3)); } out.delete(i); return out; };
  const PEERS = Array.from({ length: 81 }, (_, i) => [...peers(i)]);
  const ok = (b, i, v) => PEERS[i].every((p) => b[p] !== v);
  function fill(b) { const i = b.indexOf(0); if (i < 0) return true; for (const v of [1, 2, 3, 4, 5, 6, 7, 8, 9].sort(() => Math.random() - 0.5)) if (ok(b, i, v)) { b[i] = v; if (fill(b)) return true; b[i] = 0; } return false; }
  function count(b, limit = 2) { const i = b.indexOf(0); if (i < 0) return 1; let n = 0; for (let v = 1; v <= 9 && n < limit; v++) if (ok(b, i, v)) { b[i] = v; n += count(b, limit - n); b[i] = 0; } return n; }
  function make(holes) { sol = Array(81).fill(0); fill(sol); board = [...sol]; let removed = 0; for (const i of [...Array(81).keys()].sort(() => Math.random() - 0.5)) { if (removed >= holes) break; const v = board[i]; board[i] = 0; if (count([...board]) !== 1) board[i] = v; else removed++; } given = board.map((v) => v > 0); }
  function start() { make(+$('lvl').value); sel = -1; done = false; t0 = Date.now(); clearInterval(clock); clock = setInterval(tick, 500); $('msg').textContent = 'Tap a square, then a number (or type 1–9).'; render(); }
  function tick() { const s = Math.floor((Date.now() - t0) / 1000); $('t').textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; }
  function render() {
    const pe = sel >= 0 ? new Set(PEERS[sel]) : new Set();
    $('g').innerHTML = board.map((v, i) => `<div class="c ${given[i] ? 'g' : ''} ${i === sel ? 'sel' : ''} ${pe.has(i) ? 'peer' : ''} ${v && !given[i] && !ok(board, i, v) ? 'bad' : ''}" data-i="${i}">${v || ''}</div>`).join('');
  }
  function put(v) {
    if (sel < 0 || given[sel] || done) return; board[sel] = v; render();
    const el = $('g').children[sel]; if (el && v) { FX.re(el, 'in'); if (el.classList.contains('bad')) FX.flash('rgba(255,107,107,.18)'); }
    if (board.every((x, i) => x === sol[i])) { done = true; clearInterval(clock); const s = Math.floor((Date.now() - t0) / 1000); const score = Math.max(100, (+$('lvl').value) * 40 - s); $('msg').textContent = `Solved in ${$('t').textContent}! Score ${score}.`; FX.flash('rgba(255,213,74,.35)'); FX.burst(...FX.at($('g')), '#ffd54a', 18); FX.text('Solved! ' + score, ...FX.at($('g')), '#ffd54a'); report(score); }
  }
  $('g').addEventListener('click', (e) => { const el = e.target.closest('.c'); if (el) { sel = +el.dataset.i; render(); } });
  $('pad').innerHTML = [1, 2, 3, 4, 5, 6, 7, 8, 9].map((n) => `<button data-n="${n}">${n}</button>`).join('') + '<button data-n="0">⌫</button>';
  $('pad').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) put(+b.dataset.n); });
  addEventListener('keydown', (e) => { if (/^[1-9]$/.test(e.key)) put(+e.key); else if (e.key === 'Backspace' || e.key === '0') put(0); else if (sel >= 0 && e.key.startsWith('Arrow')) { const d = { ArrowUp: -9, ArrowDown: 9, ArrowLeft: -1, ArrowRight: 1 }[e.key]; sel = Math.max(0, Math.min(80, sel + d)); render(); e.preventDefault(); } });
  $('new').onclick = start; start();
</script>
</body>
</html>
