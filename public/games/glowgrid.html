<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<title>Glow Grid</title>
<link rel="icon" href="../icons/favicon.svg" />
<style>
  :root { --accent: #8b5cf6; --fg: #f4ecff; --muted: #b9acd9; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #07061a; color: var(--fg); font: 15px/1.3 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #hud { position: fixed; left: 0; right: 0; top: 0; height: 64px; padding: 8px max(12px, env(safe-area-inset-right)) 0 max(12px, env(safe-area-inset-left)); display: flex; align-items: center; justify-content: space-between; pointer-events: none; z-index: 2; }
  #hud > * { pointer-events: auto; }
  .best { display: flex; align-items: center; gap: 6px; min-width: 76px; font-weight: 800; font-variant-numeric: tabular-nums; color: #ffe39a; text-shadow: 0 0 10px rgba(255, 196, 70, 0.55); }
  .best svg { width: 22px; height: 22px; filter: drop-shadow(0 0 6px rgba(255, 190, 60, 0.7)); }
  .score { position: absolute; left: 50%; top: 6px; transform: translateX(-50%); text-align: center; pointer-events: none; }
  .score small { display: block; font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
  #score { display: inline-block; font-size: 34px; font-weight: 900; line-height: 1.05; font-variant-numeric: tabular-nums; background: linear-gradient(180deg, #ffffff 10%, #ffd3f3 55%, #c3a2ff 100%); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 0 12px rgba(214, 120, 255, 0.6)); }
  #score.bump { animation: bump 0.36s cubic-bezier(0.3, 1.6, 0.5, 1); }
  @keyframes bump { 0% { transform: scale(1); } 35% { transform: scale(1.2); } 100% { transform: scale(1); } }
  .btns { display: flex; gap: 8px; min-width: 76px; justify-content: flex-end; }
  .icon { width: 38px; height: 38px; border-radius: 50%; border: 1px solid rgba(255, 255, 255, 0.16); background: linear-gradient(180deg, rgba(255, 255, 255, 0.14), rgba(255, 255, 255, 0.04)); color: var(--fg); display: grid; place-items: center; cursor: pointer; padding: 0; box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.18); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
  .icon:hover { background: linear-gradient(180deg, rgba(255, 255, 255, 0.22), rgba(255, 255, 255, 0.07)); }
  .icon:focus-visible, .play:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  .icon svg { width: 19px; height: 19px; }
  #tip { position: fixed; left: 0; right: 0; bottom: max(10px, env(safe-area-inset-bottom)); text-align: center; font-size: 12.5px; color: var(--muted); opacity: 0.85; transition: opacity 0.8s; pointer-events: none; padding: 0 12px; }
  #tip.gone { opacity: 0; }
  #over { position: fixed; inset: 0; z-index: 3; display: grid; place-items: center; padding: 16px; background: radial-gradient(circle at 50% 40%, rgba(40, 14, 80, 0.55), rgba(3, 2, 12, 0.82)); -webkit-backdrop-filter: blur(5px); backdrop-filter: blur(5px); opacity: 0; visibility: hidden; transition: opacity 0.45s, visibility 0s 0.45s; }
  #over.show { opacity: 1; visibility: visible; transition: opacity 0.45s; }
  .card { position: relative; width: min(340px, 100%); text-align: center; padding: 26px 22px 22px; border-radius: 24px; background: linear-gradient(160deg, rgba(62, 32, 120, 0.92), rgba(18, 12, 48, 0.95)); border: 1px solid rgba(255, 255, 255, 0.14); box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(190, 120, 255, 0.18), 0 0 60px rgba(160, 80, 255, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.2); transform: translateY(24px) scale(0.92); transition: transform 0.55s cubic-bezier(0.2, 1.5, 0.4, 1); }
  #over.show .card { transform: none; }
  .card h2 { margin: 0 0 4px; font-size: 26px; font-weight: 900; letter-spacing: 0.01em; background: linear-gradient(90deg, #ffb4e6, #ffe7a3, #a5f3ff); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .card .sub { color: var(--muted); font-size: 13px; margin-bottom: 10px; }
  #final { font-size: 58px; font-weight: 900; line-height: 1.05; font-variant-numeric: tabular-nums; color: #fff; text-shadow: 0 0 22px rgba(230, 150, 255, 0.85), 0 0 4px rgba(255, 255, 255, 0.7); }
  #newbest { display: inline-block; margin: 8px 0 2px; padding: 4px 12px; border-radius: 99px; font-weight: 900; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: #3b1d00; background: linear-gradient(90deg, #ffd35a, #fff1a8, #ffb13d); box-shadow: 0 0 18px rgba(255, 200, 70, 0.75); animation: glowpulse 1.4s ease-in-out infinite; }
  @keyframes glowpulse { 50% { box-shadow: 0 0 30px rgba(255, 210, 90, 1); transform: scale(1.06); } }
  .card .bestline { margin: 8px 0 18px; color: #ffe39a; font-weight: 700; }
  .play { position: relative; overflow: hidden; border: 0; border-radius: 99px; padding: 13px 34px; font: inherit; font-size: 17px; font-weight: 900; color: #fff; cursor: pointer; background: linear-gradient(135deg, #ff4fb4, #9b5cff 55%, #3fb9ff); box-shadow: 0 8px 26px rgba(160, 70, 255, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.35); }
  .play::after { content: ''; position: absolute; top: 0; bottom: 0; width: 40%; left: -60%; background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.55), transparent); transform: skewX(-20deg); animation: shine 2.4s ease-in-out infinite; }
  @keyframes shine { 0%, 45% { left: -60%; } 80%, 100% { left: 130%; } }
  #powers { position: fixed; left: 50%; bottom: max(8px, env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 2; display: none; align-items: center; gap: 6px; padding: 5px; border-radius: 99px; background: linear-gradient(180deg, rgba(60, 36, 120, 0.72), rgba(20, 12, 50, 0.78)); border: 1px solid rgba(255, 255, 255, 0.14); box-shadow: 0 8px 30px rgba(0, 0, 0, 0.45), 0 0 24px rgba(140, 80, 255, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.14); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); white-space: nowrap; max-width: calc(100vw - 12px); }
  #powers.on { display: flex; }
  .coins { display: flex; align-items: center; gap: 5px; padding: 0 10px 0 6px; height: 36px; font-weight: 900; font-variant-numeric: tabular-nums; color: #ffe39a; text-shadow: 0 0 10px rgba(255, 196, 70, 0.6); }
  .coin { width: 18px; height: 18px; flex: none; filter: drop-shadow(0 0 5px rgba(255, 190, 60, 0.7)); }
  .pw { position: relative; display: flex; align-items: center; gap: 6px; height: 36px; padding: 0 10px 0 9px; border-radius: 99px; border: 1px solid rgba(255, 255, 255, 0.16); font: inherit; font-size: 13.5px; font-weight: 800; color: #fff; cursor: pointer; background: linear-gradient(180deg, rgba(255, 255, 255, 0.16), rgba(255, 255, 255, 0.04)); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2); transition: transform 0.12s, background 0.2s, opacity 0.2s; }
  .pw svg.ic { width: 18px; height: 18px; flex: none; }
  .pw:hover:not(:disabled) { background: linear-gradient(180deg, rgba(255, 255, 255, 0.26), rgba(255, 255, 255, 0.08)); transform: translateY(-1px); }
  .pw:active:not(:disabled) { transform: scale(0.95); }
  .pw:disabled { opacity: 0.42; cursor: default; }
  .pw:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  .price { display: flex; align-items: center; gap: 2px; padding: 1px 6px 1px 3px; border-radius: 99px; background: rgba(0, 0, 0, 0.32); color: #ffe39a; font-size: 12px; font-variant-numeric: tabular-nums; }
  .price .coin { width: 13px; height: 13px; }
  #p-bomb { background: linear-gradient(180deg, rgba(255, 110, 60, 0.4), rgba(160, 20, 60, 0.3)); }
  .pw.pending { opacity: 1; animation: pend 0.9s ease-in-out infinite; }
  @keyframes pend { 50% { box-shadow: 0 0 0 3px rgba(255, 220, 120, 0.55), 0 0 22px rgba(255, 200, 80, 0.7); } }
  @media (max-width: 480px) { .pw .lbl { display: none; } .pw { padding: 0 9px; gap: 5px; } }
  #toast { position: fixed; left: 50%; bottom: 62px; transform: translate(-50%, 8px); z-index: 4; max-width: calc(100% - 24px); padding: 8px 14px; border-radius: 12px; font-weight: 700; font-size: 13.5px; background: rgba(20, 10, 45, 0.92); border: 1px solid rgba(255, 255, 255, 0.16); box-shadow: 0 8px 26px rgba(0, 0, 0, 0.5); opacity: 0; pointer-events: none; transition: opacity 0.25s, transform 0.25s; text-align: center; }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  .cont { display: flex; align-items: center; justify-content: center; gap: 8px; margin: -6px auto 14px; border: 0; border-radius: 99px; padding: 11px 22px; font: inherit; font-size: 15.5px; font-weight: 900; color: #3b1d00; cursor: pointer; background: linear-gradient(135deg, #ffe27a, #ffb13d 60%, #ff8a3d); box-shadow: 0 6px 22px rgba(255, 170, 60, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.6); }
  .cont:disabled { opacity: 0.45; cursor: default; }
  .cont.pending { animation: pend 0.9s ease-in-out infinite; }
  .cont .price { background: rgba(80, 30, 0, 0.18); color: #4a2400; }
  @media (prefers-reduced-motion: reduce) {
    .pw.pending, .cont.pending { animation: none; box-shadow: 0 0 0 3px rgba(255, 220, 120, 0.7); }
    #score.bump, #newbest, .play::after { animation: none; }
    .card { transition: none; }
  }
  @media (max-width: 360px) { #score { font-size: 28px; } .icon { width: 34px; height: 34px; } }
</style>
</head>
<body>
<canvas id="c" aria-label="Glow Grid board" role="img"></canvas>
<div id="hud">
  <div class="best" title="Best score this session">
    <svg viewBox="0 0 24 24" aria-hidden="true"><defs><linearGradient id="cg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff3b0" /><stop offset="1" stop-color="#ffb52e" /></linearGradient></defs><path fill="url(#cg)" d="M3 8l4.5 3.5L12 4l4.5 7.5L21 8l-2 11H5z" /></svg>
    <b id="best">0</b>
  </div>
  <div class="score"><small>Score</small><b id="score">0</b></div>
  <div class="btns">
    <button class="icon" id="sound" aria-label="Sound off" aria-pressed="false" title="Sound">
      <svg id="snd-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5L6 9H3v6h3l5 4z" fill="currentColor" /><path d="M22 9l-6 6M16 9l6 6" /></svg>
      <svg id="snd-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display: none"><path d="M11 5L6 9H3v6h3l5 4z" fill="currentColor" /><path d="M15.5 8.5a5 5 0 010 7M18.5 5.5a9 9 0 010 13" /></svg>
    </button>
    <button class="icon" id="new" aria-label="New game" title="New game">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 11-2.34-5.66" /><path d="M20 4v5h-5" /></svg>
    </button>
  </div>
</div>
<div id="tip">Drag a piece onto the grid. Fill a row or column to clear it.</div>
<div id="over" role="dialog" aria-modal="true" aria-labelledby="over-title">
  <div class="card">
    <h2 id="over-title">No room left!</h2>
    <div class="sub">None of your pieces fit.</div>
    <div id="final">0</div>
    <div id="newbest" hidden>New best!</div>
    <div class="bestline">Best <span id="best2">0</span></div>
    <button class="cont" id="p-continue" hidden>Continue <span class="price"><svg class="coin" viewBox="0 0 20 20" aria-hidden="true"><use href="#coin" /></svg>15</span></button>
    <button class="play" id="again">Play again</button>
  </div>
</div>
<div id="powers" aria-label="Power-ups">
  <span class="coins" title="Your coins"><svg class="coin" viewBox="0 0 20 20" aria-hidden="true"><defs><symbol id="coin" viewBox="0 0 20 20"><defs><linearGradient id="cgd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff4b8" /><stop offset="0.5" stop-color="#ffc93a" /><stop offset="1" stop-color="#c9780a" /></linearGradient></defs><circle cx="10" cy="10" r="9" fill="url(#cgd)" /><circle cx="10" cy="10" r="6.2" fill="none" stroke="#a85f00" stroke-opacity="0.55" stroke-width="1.4" /><path d="M7 7.5l2-1.5v8" stroke="#8a4a00" stroke-opacity="0.7" stroke-width="1.6" fill="none" stroke-linecap="round" /></symbol></defs><use href="#coin" /></svg><span id="coins">0</span></span>
  <button class="pw" id="p-reroll" title="Reroll the three pieces (5 coins)"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5" /></svg><span class="lbl">Reroll</span><span class="price"><svg class="coin" viewBox="0 0 20 20" aria-hidden="true"><use href="#coin" /></svg>5</span></button>
  <button class="pw" id="p-undo" title="Undo your last move (5 coins)"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14L4 9l5-5" /><path d="M4 9h10.5a5.5 5.5 0 010 11H11" /></svg><span class="lbl">Undo</span><span class="price"><svg class="coin" viewBox="0 0 20 20" aria-hidden="true"><use href="#coin" /></svg>5</span></button>
  <button class="pw" id="p-bomb" title="A bomb that clears a 3×3 area (10 coins)"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="14" r="6.5" fill="currentColor" /><path d="M15 9.5l2.5-2.5M19 3v2M21 5h-2M20.4 6.4l1.1 1.1" /></svg><span class="lbl">Bomb</span><span class="price"><svg class="coin" viewBox="0 0 20 20" aria-hidden="true"><use href="#coin" /></svg>10</span></button>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
/* logic:start — keep in step with src/lib/blockpuzzle.ts (blockpuzzle.test.ts checks both) */
const SIZE = 8;
const COLORS = 8;
const LINE_POINTS = 10;
const BOARD_CLEAR_POINTS = 300;
const DEAL_TRIES = 12;

function parseShape(id, weight, rows) {
  const cells = [];
  rows.forEach((line, r) => [...line].forEach((ch, c) => ch === '#' && cells.push([r, c])));
  return { id, cells, w: Math.max(...rows.map((l) => l.length)), h: rows.length, weight };
}
const DEFS = [
  ['dot', 2, ['#']], ['i2h', 3, ['##']], ['i2v', 3, ['#', '#']], ['i3h', 3, ['###']], ['i3v', 3, ['#', '#', '#']],
  ['i4h', 2, ['####']], ['i4v', 2, ['#', '#', '#', '#']], ['i5h', 1.5, ['#####']], ['i5v', 1.5, ['#', '#', '#', '#', '#']],
  ['o2', 3, ['##', '##']], ['o3', 1.2, ['###', '###', '###']], ['r23', 1.5, ['###', '###']], ['r32', 1.5, ['##', '##', '##']],
  ['v3a', 2, ['##', '#.']], ['v3b', 2, ['##', '.#']], ['v3c', 2, ['#.', '##']], ['v3d', 2, ['.#', '##']],
  ['t4u', 1.2, ['###', '.#.']], ['t4d', 1.2, ['.#.', '###']], ['t4l', 1.2, ['#.', '##', '#.']], ['t4r', 1.2, ['.#', '##', '.#']],
  ['l4a', 1, ['#.', '#.', '##']], ['l4b', 1, ['.#', '.#', '##']], ['l4c', 1, ['##', '#.', '#.']], ['l4d', 1, ['##', '.#', '.#']],
  ['l4e', 1, ['###', '#..']], ['l4f', 1, ['###', '..#']], ['l4g', 1, ['#..', '###']], ['l4h', 1, ['..#', '###']],
  ['s4h', 1, ['.##', '##.']], ['z4h', 1, ['##.', '.##']], ['s4v', 1, ['#.', '##', '.#']], ['z4v', 1, ['.#', '##', '#.']],
  ['l5a', 1, ['###', '#..', '#..']], ['l5b', 1, ['###', '..#', '..#']], ['l5c', 1, ['#..', '#..', '###']], ['l5d', 1, ['..#', '..#', '###']],
];
const SHAPES = DEFS.map(([id, weight, rows]) => parseShape(id, weight, rows));
const TOTAL_WEIGHT = SHAPES.reduce((a, s) => a + s.weight, 0);

const emptyBoard = () => new Array(SIZE * SIZE).fill(0);

function canPlace(board, shape, row, col) {
  if (row < 0 || col < 0 || row + shape.h > SIZE || col + shape.w > SIZE) return false;
  return shape.cells.every(([r, c]) => board[(row + r) * SIZE + col + c] === 0);
}
function fits(board, shape) {
  const out = [];
  for (let r = 0; r + shape.h <= SIZE; r++) for (let c = 0; c + shape.w <= SIZE; c++) if (canPlace(board, shape, r, c)) out.push([r, c]);
  return out;
}
function fitsAnywhere(board, shape) {
  for (let r = 0; r + shape.h <= SIZE; r++) for (let c = 0; c + shape.w <= SIZE; c++) if (canPlace(board, shape, r, c)) return true;
  return false;
}
function fullLines(board) {
  const rows = [], cols = [];
  for (let i = 0; i < SIZE; i++) {
    let row = true, col = true;
    for (let j = 0; j < SIZE; j++) {
      if (!board[i * SIZE + j]) row = false;
      if (!board[j * SIZE + i]) col = false;
    }
    if (row) rows.push(i);
    if (col) cols.push(i);
  }
  return { rows, cols };
}
function previewClears(board, shape, row, col) {
  if (!canPlace(board, shape, row, col)) return { rows: [], cols: [] };
  const b = board.slice();
  for (const [r, c] of shape.cells) b[(row + r) * SIZE + col + c] = 1;
  return fullLines(b);
}
function scoreFor(blocks, lines, combo, boardClear) {
  const lineScore = lines ? LINE_POINTS * lines * (lines + 1) * Math.max(1, combo) : 0;
  const clearScore = boardClear ? BOARD_CLEAR_POINTS : 0;
  return { blocks, lines: lineScore, boardClear: clearScore, total: blocks + lineScore + clearScore };
}
function place(board, piece, row, col, combo) {
  if (!canPlace(board, piece.shape, row, col)) throw new Error(`${piece.shape.id} does not fit at ${row},${col}`);
  const b = board.slice();
  for (const [r, c] of piece.shape.cells) b[(row + r) * SIZE + col + c] = piece.color;
  const { rows, cols } = fullLines(b);
  const set = new Set();
  for (const r of rows) for (let c = 0; c < SIZE; c++) set.add(r * SIZE + c);
  for (const c of cols) for (let r = 0; r < SIZE; r++) set.add(r * SIZE + c);
  const cleared = [...set].sort((x, y) => x - y);
  for (const i of cleared) b[i] = 0;
  const lines = rows.length + cols.length;
  const nextCombo = lines ? combo + 1 : 0;
  const boardClear = lines > 0 && b.every((v) => v === 0);
  const s = scoreFor(piece.shape.cells.length, lines, nextCombo, boardClear);
  return { board: b, rows, cols, cleared, lines, combo: nextCombo, boardClear, points: s.total, breakdown: { blocks: s.blocks, lines: s.lines, boardClear: s.boardClear } };
}
function isGameOver(board, hand) {
  return !hand.some((p) => p && fitsAnywhere(board, p.shape));
}
function mulberry32(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function randomShape(rng) {
  let x = rng() * TOTAL_WEIGHT;
  for (const s of SHAPES) if ((x -= s.weight) < 0) return s;
  return SHAPES[SHAPES.length - 1];
}
function deal(rng, board) {
  let hand = [];
  for (let t = 0; t < DEAL_TRIES; t++) {
    hand = [0, 1, 2].map(() => ({ shape: randomShape(rng), color: 1 + Math.floor(rng() * COLORS) }));
    if (!isGameOver(board, hand)) break;
  }
  return hand;
}

// power-ups (bought with the app's coins over postMessage)
const POWERUPS = {
  reroll: { cost: 5, label: 'Reroll pieces' },
  undo: { cost: 5, label: 'Undo last move' },
  bomb: { cost: 10, label: 'Bomb: clear a 3x3 area' },
  continue: { cost: 15, label: 'Continue: clear 3 rows' },
};
const BOMB_POINTS = 2;
function buyRequest(kind, n) {
  const { cost, label } = POWERUPS[kind];
  return { type: 'hwtodo:buy', id: `${kind}-${n}`.slice(0, 40), label: label.slice(0, 60), cost };
}
function bombArea(row, col) {
  const out = [];
  for (let r = row - 1; r <= row + 1; r++) for (let c = col - 1; c <= col + 1; c++) if (r >= 0 && c >= 0 && r < SIZE && c < SIZE) out.push(r * SIZE + c);
  return out;
}
function detonate(board, row, col) {
  if (row < 0 || col < 0 || row >= SIZE || col >= SIZE) throw new Error(`bomb off the board at ${row},${col}`);
  const b = board.slice();
  const cleared = bombArea(row, col).filter((i) => b[i]);
  for (const i of cleared) b[i] = 0;
  return { board: b, cleared, points: cleared.length * BOMB_POINTS };
}
function mostFilledRows(board, n = 3) {
  const count = (r) => board.slice(r * SIZE, r * SIZE + SIZE).filter(Boolean).length;
  return [...Array(SIZE).keys()].sort((a, b) => count(b) - count(a) || a - b).slice(0, n).sort((a, b) => a - b);
}
function continueClear(board) {
  const rows = mostFilledRows(board, 3);
  const b = board.slice();
  const cleared = [];
  for (const r of rows)
    for (let c = 0; c < SIZE; c++) {
      const i = r * SIZE + c;
      if (!b[i]) continue;
      cleared.push(i);
