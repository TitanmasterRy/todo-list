<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark light" />
<title>Crate Rush</title>
<link rel="icon" href="../icons/favicon.svg" />
<style>
  :root {
    --bg: #06060f; --fg: #eef0ff; --muted: #99a1c8; --line: rgba(255, 255, 255, 0.09); --accent: #8b5cf6;
    --panel: linear-gradient(180deg, rgba(34, 36, 78, 0.62), rgba(15, 16, 38, 0.74)); --glass: rgba(14, 15, 34, 0.78);
    --cash: #6dffb0; --gold: #ffd35a; --good: #34d399; --bad: #fb7185; --r: 16px; --navh: 64px;
  }
  body.light { --bg: #e9ecf8; --fg: #151833; --muted: #59618a; --line: rgba(21, 24, 51, 0.12); --panel: linear-gradient(180deg, rgba(255, 255, 255, 0.92), rgba(240, 242, 252, 0.9)); --glass: rgba(255, 255, 255, 0.85); --cash: #059669; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--fg); font: 14px/1.35 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; overflow: hidden; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  body::before { content: ''; position: fixed; inset: 0; pointer-events: none; background: radial-gradient(900px 620px at 8% -12%, rgba(139, 92, 246, 0.3), transparent 60%), radial-gradient(760px 560px at 108% 108%, rgba(34, 211, 238, 0.16), transparent 62%), radial-gradient(640px 420px at 62% 36%, rgba(236, 72, 153, 0.08), transparent 70%); }
  body::after { content: ''; position: fixed; inset: 0; pointer-events: none; background-image: linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px); background-size: 44px 44px; -webkit-mask-image: radial-gradient(ellipse at 50% 0%, #000 10%, transparent 70%); mask-image: radial-gradient(ellipse at 50% 0%, #000 10%, transparent 70%); }
  body.light::before { opacity: 0.5; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  #app { position: relative; z-index: 1; height: 100%; display: flex; flex-direction: column; }

  /* ---------- header ---------- */
  #top { position: relative; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; padding: 8px max(14px, env(safe-area-inset-right)) 8px max(14px, env(safe-area-inset-left)); border-bottom: 1px solid var(--line); background: linear-gradient(180deg, rgba(10, 10, 28, 0.85), rgba(10, 10, 28, 0.55)); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); z-index: 5; }
  body.light #top { background: rgba(255, 255, 255, 0.75); }
  .brand { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .brand svg { width: 34px; height: 34px; flex: none; filter: drop-shadow(0 0 10px rgba(255, 90, 200, 0.5)); }
  .brand b { font-weight: 900; font-style: italic; letter-spacing: 0.06em; font-size: 17px; line-height: 1; white-space: nowrap; }
  .brand b span { background: linear-gradient(90deg, #ffd35a, #ff6ad5 60%, #a78bfa); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .money { text-align: center; min-width: 0; }
  #cash { font-size: 27px; font-weight: 900; line-height: 1.05; font-variant-numeric: tabular-nums; color: var(--cash); text-shadow: 0 0 20px rgba(109, 255, 176, 0.45); white-space: nowrap; transition: transform 0.12s; }
  #cash.bump { transform: scale(1.06); }
  .money .sub { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .money .sub b { color: var(--fg); font-weight: 800; }
  .hud { display: flex; justify-content: flex-end; align-items: center; gap: 6px; flex-wrap: wrap; }
  .chip { display: inline-flex; align-items: center; gap: 4px; height: 26px; padding: 0 9px; border-radius: 99px; font-weight: 800; font-size: 12px; background: rgba(255, 255, 255, 0.08); border: 1px solid var(--line); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .chip svg { width: 14px; height: 14px; }
  .chip.star { color: #ffe08a; background: linear-gradient(135deg, rgba(255, 211, 90, 0.22), rgba(255, 120, 60, 0.12)); }
  .chip.boost { color: #fff; background: linear-gradient(135deg, #22c55e, #0ea5e9); border-color: transparent; animation: glowpulse 1.6s ease-in-out infinite; }
  .chip.luck { color: #2b1600; background: linear-gradient(135deg, #ffd35a, #ff9f1c); border-color: transparent; }
  .icon { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: rgba(255, 255, 255, 0.07); display: grid; place-items: center; cursor: pointer; padding: 0; }
  .icon svg { width: 18px; height: 18px; }

  /* ---------- layout ---------- */
  #main { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  #earn { flex: 1; }
  #earn, #view { overflow-y: auto; overflow-x: hidden; min-height: 0; padding: 16px max(16px, env(safe-area-inset-right)) calc(var(--navh) + 20px) max(16px, env(safe-area-inset-left)); scrollbar-width: thin; }
  #viewcol { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  #view { flex: 1; }
  #tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; display: flex; justify-content: space-around; height: calc(var(--navh) + env(safe-area-inset-bottom)); padding: 4px 4px env(safe-area-inset-bottom); background: rgba(10, 10, 26, 0.9); border-top: 1px solid var(--line); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }
  body.light #tabs { background: rgba(255, 255, 255, 0.92); }
  .tab { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; border: 0; background: none; cursor: pointer; color: var(--muted); font-size: 11px; font-weight: 800; border-radius: 12px; position: relative; }
  .tab svg { width: 22px; height: 22px; }
  .tab.on { color: var(--fg); }
  .tab.on::before { content: ''; position: absolute; top: 0; left: 22%; right: 22%; height: 3px; border-radius: 0 0 3px 3px; background: linear-gradient(90deg, #ff6ad5, #8b5cf6); box-shadow: 0 0 12px #c084fc; }
  .tab .dot { position: absolute; top: 6px; right: calc(50% - 18px); min-width: 16px; height: 16px; padding: 0 4px; border-radius: 99px; background: #ff3b6b; color: #fff; font-size: 10px; line-height: 16px; }
  body[data-tab='earn'] #viewcol { flex: 0 0 0; }
  body[data-tab='earn'] #view { display: none; }
  body:not([data-tab='earn']) #earn { display: none; }
  @media (min-width: 960px) {
    :root { --navh: 0px; }
    #main { display: grid; grid-template-columns: minmax(340px, 400px) 1fr; }
    body[data-tab] #view { display: block; }
    body[data-tab] #earn { display: block; border-right: 1px solid var(--line); background: rgba(0, 0, 0, 0.12); }
    body[data-tab] #viewcol { display: flex; flex: 1; }
    #tabs { position: static; height: auto; padding: 10px 16px 0; background: none; border: 0; justify-content: flex-start; gap: 6px; -webkit-backdrop-filter: none; backdrop-filter: none; }
    .tab { flex: none; flex-direction: row; gap: 7px; padding: 9px 14px; font-size: 13.5px; background: rgba(255, 255, 255, 0.04); border: 1px solid var(--line); }
    .tab svg { width: 18px; height: 18px; }
    .tab.on { background: linear-gradient(135deg, rgba(139, 92, 246, 0.35), rgba(236, 72, 153, 0.22)); border-color: rgba(192, 132, 252, 0.45); }
    .tab.on::before { display: none; }
    .tab .dot { position: static; }
    .tab-earn { display: none !important; }
  }
  @media (max-width: 520px) {
    .brand b { display: none; }
    #cash { font-size: 23px; }
    .hud .chip.hide-sm { display: none; }
  }

  /* ---------- common ---------- */
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.06); }
  h2.title { margin: 4px 0 12px; font-size: 22px; font-weight: 900; letter-spacing: 0.01em; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  h2.title small { font-size: 13px; color: var(--muted); font-weight: 700; }
  h3.sec { margin: 18px 2px 8px; font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); font-weight: 900; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .muted { color: var(--muted); }
  .btn { appearance: none; border: 1px solid rgba(255, 255, 255, 0.14); background: linear-gradient(180deg, rgba(255, 255, 255, 0.13), rgba(255, 255, 255, 0.04)); font-weight: 800; border-radius: 12px; padding: 9px 14px; cursor: pointer; transition: transform 0.1s, filter 0.2s, opacity 0.2s; box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.14), 0 4px 14px rgba(0, 0, 0, 0.22); white-space: nowrap; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
  body.light .btn { border-color: rgba(21, 24, 51, 0.14); background: linear-gradient(180deg, #fff, #eef0fa); }
  .btn:hover:not(:disabled) { filter: brightness(1.15); }
  .btn:active:not(:disabled) { transform: scale(0.96); }
  .btn:disabled { opacity: 0.42; cursor: default; }
  .btn.primary { color: #fff; background: linear-gradient(135deg, #8b5cf6, #ec4899); border-color: transparent; box-shadow: 0 6px 22px rgba(168, 85, 247, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.3); }
  .btn.gold { color: #2b1600; background: linear-gradient(135deg, #ffe07a, #ffb020); border-color: transparent; box-shadow: 0 6px 22px rgba(255, 176, 32, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.5); }
  .btn.green { color: #fff; background: linear-gradient(135deg, #34d399, #059669); border-color: transparent; box-shadow: 0 6px 20px rgba(16, 185, 129, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.3); }
  .btn.danger { color: #fff; background: linear-gradient(135deg, #fb7185, #be123c); border-color: transparent; }
  .btn svg { width: 16px; height: 16px; flex: none; }
  .btn.sm { padding: 6px 10px; font-size: 12.5px; border-radius: 10px; }
  .btn.big { padding: 13px 22px; font-size: 16px; border-radius: 14px; }
  .seg { display: inline-flex; padding: 3px; gap: 2px; border-radius: 11px; background: rgba(0, 0, 0, 0.3); border: 1px solid var(--line); }
  body.light .seg { background: rgba(21, 24, 51, 0.06); }
  .seg button { border: 0; background: none; padding: 5px 10px; border-radius: 8px; font-weight: 800; font-size: 12px; cursor: pointer; color: var(--muted); letter-spacing: 0; text-transform: none; }
  .seg button.on { background: linear-gradient(135deg, #8b5cf6, #ec4899); color: #fff; box-shadow: 0 2px 10px rgba(168, 85, 247, 0.4); }
  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .grow { flex: 1; }
  .pill { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 99px; font-size: 11.5px; font-weight: 900; letter-spacing: 0.06em; text-transform: uppercase; color: #fff; background: var(--rc, #555); box-shadow: 0 0 14px var(--rca, transparent); }
  .pill.exo { color: #2b1600; background: linear-gradient(90deg, #ffe07a, #ffb020, #fff1b3); }
  .empty { text-align: center; color: var(--muted); padding: 30px 12px; }
  .empty svg { width: 64px; height: 64px; opacity: 0.6; }

  /* ---------- earn ---------- */
  .stage { position: relative; display: grid; place-items: center; padding: 14px 0 4px; }
  .stage::before { content: ''; position: absolute; width: 300px; height: 300px; top: -20px; border-radius: 50%; background: radial-gradient(circle, rgba(168, 85, 247, 0.35), transparent 65%); pointer-events: none; }
  #clicker { position: relative; width: 212px; height: 212px; border-radius: 50%; border: 0; padding: 0; cursor: pointer; touch-action: manipulation; background: radial-gradient(circle at 50% 30%, #3b2f82, #150f36 68%, #0b0820); box-shadow: 0 0 0 8px rgba(255, 255, 255, 0.035), 0 0 70px rgba(139, 92, 246, 0.5), inset 0 -14px 34px rgba(0, 0, 0, 0.55), inset 0 8px 18px rgba(255, 255, 255, 0.14); transition: transform 0.07s; display: grid; place-items: center; }
  #clicker::before { content: ''; position: absolute; inset: -12px; border-radius: 50%; background: conic-gradient(from 0deg, #ff3cac, #ffd35a, #22d3ee, #8b5cf6, #ff3cac); -webkit-mask: radial-gradient(circle, transparent 63%, #000 64.5%, #000 68%, transparent 69.5%); mask: radial-gradient(circle, transparent 63%, #000 64.5%, #000 68%, transparent 69.5%); animation: spin 7s linear infinite; }
  #clicker::after { content: ''; position: absolute; inset: 10px; border-radius: 50%; background: radial-gradient(circle at 35% 25%, rgba(255, 255, 255, 0.22), transparent 40%); pointer-events: none; }
  #clicker.press { transform: scale(0.93); }
  #clicker .hero { width: 66%; height: 66%; filter: drop-shadow(0 10px 18px rgba(0, 0, 0, 0.55)); animation: bob 3.2s ease-in-out infinite; pointer-events: none; }
  #clicker .ring { position: absolute; inset: 0; border-radius: 50%; border: 3px solid rgba(255, 220, 120, 0.8); animation: ring 0.5s ease-out forwards; pointer-events: none; }
  .cpc-line { margin-top: 18px; font-size: 13px; color: var(--muted); font-weight: 700; }
  .cpc-line b { color: var(--cash); font-size: 16px; font-weight: 900; }
  .showcase { margin-top: 14px; padding: 10px 12px; display: flex; align-items: center; gap: 12px; position: relative; overflow: hidden; }
  .showcase::before { content: ''; position: absolute; inset: 0; background: radial-gradient(90% 120% at 0% 50%, var(--rca, transparent), transparent 60%); pointer-events: none; }
  .showcase .art { width: 96px; flex: none; aspect-ratio: 3 / 2; position: relative; }
  .showcase .art svg { width: 100%; height: 100%; filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.5)); }
  .showcase .txt { min-width: 0; position: relative; }
  .showcase .txt b { display: block; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .showcase .txt small { color: var(--muted); font-size: 12px; }
  .lcd { display: inline-block; margin-top: 4px; padding: 2px 7px; border-radius: 6px; background: #1a0d00; color: #ff9a2e; font: 800 12px/1.4 ui-monospace, 'Cascadia Mono', Menlo, monospace; letter-spacing: 0.08em; text-shadow: 0 0 6px rgba(255, 140, 30, 0.8); border: 1px solid rgba(255, 140, 30, 0.35); }
  .powers { margin-top: 12px; padding: 10px; }
  .powers .row { justify-content: space-between; }
  .pw { position: relative; flex: 1; min-width: 96px; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 6px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.14); cursor: pointer; background: linear-gradient(180deg, rgba(255, 211, 90, 0.16), rgba(255, 255, 255, 0.03)); font-size: 11.5px; font-weight: 800; text-align: center; }
  .pw svg.ic { width: 22px; height: 22px; }
  .pw:disabled { opacity: 0.45; cursor: default; }
  .pw.pending { animation: pend 0.9s ease-in-out infinite; }
  .price { display: inline-flex; align-items: center; gap: 3px; padding: 1px 7px 1px 3px; border-radius: 99px; background: rgba(0, 0, 0, 0.35); color: #ffe39a; font-size: 11.5px; font-weight: 900; font-variant-numeric: tabular-nums; }
  .coin { width: 14px; height: 14px; flex: none; }
  .coins { display: inline-flex; align-items: center; gap: 5px; font-weight: 900; color: #ffe39a; font-size: 13px; }
  .coins .coin { width: 17px; height: 17px; }
  .up { width: 100%; display: flex; align-items: center; gap: 12px; padding: 10px 12px; margin-bottom: 8px; text-align: left; border-radius: 14px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; box-shadow: 0 6px 18px rgba(0, 0, 0, 0.2); transition: transform 0.1s, border-color 0.2s, opacity 0.2s; }
  .up:hover:not(:disabled) { border-color: rgba(192, 132, 252, 0.55); }
  .up:active:not(:disabled) { transform: scale(0.985); }
  .up:disabled { cursor: default; }
  .up:disabled .cost { opacity: 0.5; }
  .up .gi { width: 42px; height: 42px; flex: none; border-radius: 12px; display: grid; place-items: center; background: linear-gradient(135deg, var(--g1, #8b5cf6), var(--g2, #3b82f6)); color: #fff; box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.35); }
  .up .gi svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
  .up .gt { flex: 1; min-width: 0; }
  .up .gt b { display: block; font-size: 14px; }
  .up .gt small { display: block; font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mbar { display: block; height: 4px; margin-top: 5px; border-radius: 3px; background: rgba(255, 255, 255, 0.08); overflow: hidden; }
  .mbar i { display: block; height: 100%; border-radius: 3px; background: linear-gradient(90deg, #22d3ee, #a78bfa); }
  .up .gc { text-align: right; flex: none; }
  .up .own { display: block; font-size: 22px; font-weight: 900; line-height: 1; font-variant-numeric: tabular-nums; opacity: 0.9; }
  .up .cost { display: inline-block; margin-top: 4px; font-weight: 900; font-size: 13px; color: var(--cash); font-variant-numeric: tabular-nums; }
  .up.locked { opacity: 0.5; filter: grayscale(0.7); }
  .drop { position: fixed; z-index: 20; width: 64px; height: 64px; border: 0; padding: 0; background: none; cursor: pointer; animation: drift 13s linear forwards; }
  .drop svg { width: 100%; height: 100%; filter: drop-shadow(0 0 14px #ffd35a) drop-shadow(0 0 30px rgba(255, 211, 90, 0.6)); animation: bob 1.4s ease-in-out infinite; }

  /* ---------- crates ---------- */
  .crates { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px; }
  .crate { position: relative; padding: 14px 14px 12px; display: flex; flex-direction: column; align-items: center; text-align: center; overflow: hidden; }
  .crate::before { content: ''; position: absolute; left: 50%; top: 18px; width: 180px; height: 180px; margin-left: -90px; border-radius: 50%; background: radial-gradient(circle, var(--cg), transparent 65%); opacity: 0.55; pointer-events: none; }
  .crate .cart { width: 132px; height: 128px; position: relative; cursor: pointer; transition: transform 0.25s; }
  .crate .cart:hover { transform: translateY(-5px) rotate(-2deg) scale(1.04); }
  .crate .cart svg { width: 100%; height: 100%; }
  .crate h4 { margin: 6px 0 0; font-size: 15px; font-weight: 900; position: relative; }
  .crate .cp { font-weight: 900; color: var(--cash); font-size: 15px; font-variant-numeric: tabular-nums; position: relative; }
  .crate .odds { display: flex; gap: 3px; margin: 8px 0 10px; position: relative; }
  .crate .odds i { width: 14px; height: 5px; border-radius: 3px; background: var(--rc); box-shadow: 0 0 6px var(--rc); }
  .crate .row { position: relative; justify-content: center; width: 100%; flex-wrap: nowrap; gap: 6px; }
  .crate .row .btn.sm { padding: 6px 8px; }
  .crate .btn.primary { flex: 1; min-width: 0; }
  @media (max-width: 640px) { .crates { grid-template-columns: repeat(2, 1fr); gap: 10px; } .crate { padding: 10px 8px; } .crate .cart { width: 104px; height: 100px; } .crate h4 { font-size: 13.5px; } .crate .btn.primary { padding: 8px 6px; font-size: 13px; } .crate .odds i { width: 10px; } }
  .luckbar { display: flex; align-items: center; gap: 8px; margin: 0 0 14px; padding: 10px 14px; border-radius: 14px; font-weight: 800; color: #2b1600; background: linear-gradient(90deg, #ffe07a, #ffb020); box-shadow: 0 6px 22px rgba(255, 176, 32, 0.3); }
  .luckbar svg { width: 20px; height: 20px; }
  .oddtab { width: 100%; border-collapse: collapse; margin: 6px 0 4px; font-size: 13px; }
  .oddtab td { padding: 5px 6px; border-bottom: 1px solid var(--line); }
  .oddtab td:last-child { text-align: right; font-variant-numeric: tabular-nums; font-weight: 800; }
  .dotc { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--rc); box-shadow: 0 0 8px var(--rc); margin-right: 6px; vertical-align: -1px; }

  /* ---------- item cards ---------- */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(138px, 1fr)); gap: 10px; }
  .icard { position: relative; border-radius: 14px; background: linear-gradient(180deg, #1b1e3e, #0e1026); border: 1px solid rgba(255, 255, 255, 0.08); padding: 8px 9px 11px; overflow: hidden; cursor: pointer; transition: transform 0.15s, box-shadow 0.2s; color: #eef0ff; text-align: left; width: 100%; display: block; }
  .icard::before { content: ''; position: absolute; inset: 0; background: radial-gradient(120% 75% at 50% 105%, var(--rca), transparent 62%); pointer-events: none; }
  .icard::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: var(--rc); box-shadow: 0 0 14px var(--rc); }
  .icard:hover { transform: translateY(-3px); box-shadow: 0 12px 26px rgba(0, 0, 0, 0.45), 0 0 0 1px var(--rc); }
  .icard.sel { box-shadow: 0 0 0 2px #fff, 0 0 22px var(--rc); }
  .icard.sel .check { display: grid; }
  .icard .check { display: none; position: absolute; top: 6px; right: 6px; width: 20px; height: 20px; border-radius: 50%; place-items: center; background: #22c55e; color: #fff; z-index: 2; }
  .icard .art { position: relative; aspect-ratio: 3 / 2; }
  .icard .art svg { width: 100%; height: 100%; filter: drop-shadow(0 6px 8px rgba(0, 0, 0, 0.55)); }
  .icard .nm { position: relative; font-size: 10.5px; color: #99a1c8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
  .icard .fn { position: relative; font-weight: 800; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .icard .meta { position: relative; display: flex; justify-content: space-between; align-items: baseline; gap: 4px; font-size: 11.5px; margin-top: 3px; color: #99a1c8; }
  .icard .meta .val { color: #6dffb0; font-weight: 900; font-variant-numeric: tabular-nums; }
  .icard.r6 { border-color: rgba(255, 211, 90, 0.5); }

  const box = $('slots');
  const br = box.getBoundingClientRect();
  for (const s of box.children) {
    const r = s.getBoundingClientRect();
    s.style.setProperty('--tx', `${br.left + br.width / 2 - (r.left + r.width / 2)}px`);
    s.style.setProperty('--ty', `${br.top + br.height / 2 - (r.top + r.height / 2)}px`);
  }
  sfx.open();
  box.classList.add('suck');
  setTimeout(() => {
    busy = false;
    flash(RARITIES[ITEMS[out.d].rarity].color);
    $('layer').hidden = false;
    $('layer').innerHTML = revealOne(out, 'Trade-up result', `<button class="btn green" data-a="rsell" data-v="${out.u}">Sell ${short(itemValue(out))}</button><button class="btn primary" data-a="close">Keep</button>`);
    celebrate(ITEMS[out.d].rarity);
    afterChange();
  }, reduced ? 50 : 750);
}

// ---------- book ----------
function viewBook() {
  const found = S.book.filter((n) => n > 0).length;
  let h = `<h2 class="title">Collection book <small>${found} / ${ITEMS.length} found · ${S.claimed.length} complete (+${Math.round(S.claimed.length * COLLECTION_BONUS * 100)}% income)</small></h2>`;
  CRATES.forEach((c, ci) => {
    const defs = ITEMS.filter((x) => x.crate === ci);
    const got = defs.filter((x) => S.book[x.i] > 0).length;
    const done = got === defs.length, claimed = S.claimed.includes(ci);
    h += `<div class="card coll"><div class="coll-h"><div class="mini">${crateArt(ci)}</div><div class="grow"><h3>${esc(c.name)} Collection</h3><div class="muted" style="font-size:12px">${got} / ${defs.length} · Reward: ${short(c.price * COLLECTION_REWARD)} + ${Math.round(COLLECTION_BONUS * 100)}% income</div><div class="prog"><i style="width:${(got / defs.length) * 100}%"></i></div></div>${claimed ? `<span class="pill" style="--rc:#10b981">${svgi(ICON.check)} Complete</span>` : `<button class="btn ${done ? 'gold' : ''}" data-a="claim" data-v="${ci}" ${done ? '' : 'disabled'}>Claim reward</button>`}</div><div class="grid">`;
    for (const def of [...defs].sort((a, b) => b.rarity - a.rarity)) {
      const n = S.book[def.i];
      h += n ? `<div class="icard r${def.rarity}" style="${rc(def.rarity)};cursor:default"><span class="cnt">×${count(n)}</span><div class="art">${itemArt(def.i, 500, 0.1, '')}</div><div class="nm">${esc(KINDS[def.kind])}</div><div class="fn">${esc(def.name)}</div><div class="meta"><span>${RARITIES[def.rarity].name}</span></div></div>` : `<div class="icard r${def.rarity} unk" style="${rc(def.rarity)}"><div class="art">${def.rarity === EXOTIC ? `<div style="display:grid;place-items:center;height:100%;opacity:.4">${starSvg('')}</div>` : itemArt(def.i, 500, 0, '')}</div><div class="nm">${def.rarity === EXOTIC ? 'Exotic' : esc(KINDS[def.kind])}</div><div class="fn">???</div><div class="meta"><span>${RARITIES[def.rarity].name}</span></div></div>`;
    }
    h += '</div></div>';
  });
  return h;
}

// ---------- trophies ----------
function viewTrophies() {
  const gain = starsFor(S.runEarned);
  const nextAt = Math.pow(gain + 1, 2) * REBIRTH_UNIT;
  const st = S.stats;
  const best = st.best;
  let h = `<h2 class="title">Trophies <small>${S.ach.length} / ${ACHIEVEMENTS.length} achievements (+${Math.round(S.ach.length * ACH_BONUS * 100)}% income)</small></h2>`;
  h += `<div class="card rebirth"><div class="row" style="position:relative"><div class="grow"><div class="muted" style="font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:900">Rebirth</div><div class="big">${svgi(ICON.star, '').replace('<svg', '<svg style="width:28px;height:28px;vertical-align:-3px"')} ${S.stars} star${S.stars === 1 ? '' : 's'} <small style="font-size:14px;color:var(--muted)">+${Math.round(S.stars * STAR_BONUS * 100)}% income</small></div><p class="muted" style="margin:6px 0 0">Start over with <b style="color:var(--fg)">+${gain}</b> star${gain === 1 ? '' : 's'} (each +${Math.round(STAR_BONUS * 100)}% income forever). Cash, upgrades and items reset; the book, trophies and power-ups stay. Next star at ${short(nextAt)} earned this run (${short(S.runEarned)} so far).</p></div><button class="btn gold big" data-a="rebirth" ${gain < 1 ? 'disabled' : ''}>Rebirth +${gain}</button></div></div>`;
  h += `<h3 class="sec">Stats</h3><div class="statgrid">${[
    ['Total earned', money(st.earned)], ['Crates opened', count(st.opened)], ['Clicks', count(st.clicks)], ['From clicks', money(st.clickEarned)],
    ['Spent on crates', money(st.spent)], ['Items sold', money(st.sold)], ['Trade-ups', count(st.tradeups)], ['Upgrades won / lost', `${count(st.upWins)} / ${count(st.upLosses)}`],
    ['Offline earnings', money(st.offline)], ['Tracked items found', count(st.tracked)], ['Rebirths', count(S.rebirths)], ['Playing since', new Date(S.started).toLocaleDateString()],
  ].map(([k, v]) => `<div class="stat"><small>${k}</small><b>${v}</b></div>`).join('')}</div>`;
  const maxR = Math.max(1, ...st.byRarity);
  h += `<div class="row" style="align-items:stretch;margin-top:10px"><div class="card panel grow" style="min-width:240px"><h3 class="sec" style="margin-top:0">Drops by rarity</h3><div class="bars">${RARITIES.map((r, i) => `<div class="br"><span>${r.name}</span><span class="track"><i style="--rc:${r.color};width:${(st.byRarity[i] / maxR) * 100}%"></i></span><span>${count(st.byRarity[i])}</span></div>`).join('')}</div></div>${best ? `<div class="card panel" style="width:220px"><h3 class="sec" style="margin-top:0">Best drop</h3>${card(best, 'tabindex="-1"', '', '', true, 'cursor:default')}</div>` : ''}</div>`;
  h += `<h3 class="sec">Achievements</h3><div class="achs">${ACHIEVEMENTS.map((a) => { const on = S.ach.includes(a.id); return `<div class="ach ${on ? 'on' : ''}"><span class="ai">${svgi(on ? ICON.trophy : ICON.lock)}</span><div><b>${esc(a.name)}</b><small>${esc(a.desc)}</small></div></div>`; }).join('')}</div>`;
  h += `<h3 class="sec">Settings</h3><div class="row"><button class="btn sm" data-a="sound">${S.sound ? 'Sound: on' : 'Sound: off'}</button><button class="btn sm" data-a="fast">${S.fast ? 'Quick open: on' : 'Quick open: off'}</button><span class="grow"></span><button class="btn sm danger" data-a="reset">Reset everything…</button></div>`;
  if (!framed) h += '<p class="muted" style="font-size:12px">Opened on its own, so progress isn\'t saved. Play it from the app\'s arcade to keep your crates.</p>';
  return h;
}

// ---------- after any change ----------
function afterChange(keepView) {
  const fresh = checkAchievements(S);
  fresh.forEach((id, k) => {
    const a = ACHIEVEMENTS.find((x) => x.id === id);
    setTimeout(() => { toast(`Achievement: ${a.name}`, `${a.desc} · +${Math.round(ACH_BONUS * 100)}% income`, 'trophy'); sfx.ach(); }, 300 + k * 450);
  });
  if (fresh.length) saveSoon();
  renderTabs();
  renderHero();
  renderShowcase();
  renderClickUps();
  renderGens();
  renderPowers();
  if (!keepView && $('layer').hidden) renderView();
  refresh();
}

// =====================================================================================================
// input
// =====================================================================================================
const clicker = $('clicker');
function doClick(x, y) {
  if (!loaded) return;
  const v = click(S, Date.now());
  audio();
  sfx.click();
  clicker.classList.add('press');
  setTimeout(() => clicker.classList.remove('press'), 70);
  if (!reduced) {
    const ring = document.createElement('span');
    ring.className = 'ring';
    clicker.appendChild(ring);
    setTimeout(() => ring.remove(), 520);
  }
  burst(x, y, { n: 5, kind: 'coin', speed: 300, up: 260, g: 900, life: 0.9, size: 5.5 });
  burst(x, y, { n: 4, colors: ['#ffd35a', '#fff', '#c084fc'], speed: 320, up: 40, g: 200, life: 0.35, size: 3 });
  floatText(x + (Math.random() - 0.5) * 40, y, `+${short(v)}`);
  const lcd = $('lcd');
  const sc = showcaseItem(S);
  if (lcd && sc) lcd.textContent = `TRACKED ${String(sc.t).padStart(6, '0')}`;
  if (S.stats.clicks === 1 || S.stats.clicks % 50 === 0) afterChange(true);
  else refresh();
  dirty = true;
}
clicker.addEventListener('pointerdown', (e) => {
  if (e.button !== 0) return;
  e.preventDefault();
  doClick(e.clientX, e.clientY);
});
clicker.addEventListener('keydown', (e) => {
  if (e.key !== ' ' && e.key !== 'Enter') return;
  e.preventDefault();
  if (e.repeat) return;
  const r = clicker.getBoundingClientRect();
  doClick(r.left + r.width / 2 + (Math.random() - 0.5) * 60, r.top + r.height / 2 + (Math.random() - 0.5) * 60);
});
clicker.addEventListener('click', (e) => e.preventDefault());

document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-a]');
  if (!b || b.disabled) return;
  if (b.closest('#layer') && busy && b.dataset.a !== 'skip') return;
  audio();
  act(b.dataset.a, b.dataset.v, b);
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { if (skipReel) skipReel(); else closeModal(); }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role="button"][data-a]')) { e.preventDefault(); e.target.click(); }
});
document.addEventListener('input', (e) => {
  if (e.target.id === 'inv-q') {
    invQ = e.target.value;
    invShow = 120;
    const pos = e.target.selectionStart;
    renderView();
    const el = $('inv-q');
    el.focus();
    try { el.setSelectionRange(pos, pos); } catch { /* search inputs */ }
  }
});
document.addEventListener('change', (e) => {
  if (e.target.id === 'inv-sort') { invSort = e.target.value; renderView(); }
  if (e.target.id === 'inv-crate') { invCrate = Number(e.target.value); invShow = 120; renderView(); }
});
$('layer').addEventListener('pointerdown', (e) => { if (e.target === $('layer') && !busy && $('layer').querySelector('.modal')) closeModal(); });

function act(a, v, el) {
  const u = Number(v);
  switch (a) {
    case 'tab': setTab(v); break;
    case 'sound': S.sound = !S.sound; renderAll(); if (S.sound) sfx.buy(); saveSoon(); break;
    case 'fast': S.fast = !S.fast; renderView(); saveSoon(); break;
    case 'genmode': genMode = Number(v); renderGens(); refresh(); break;
    case 'gen': {
      const i = Number(el.dataset.i);
      if (buyGen(S, i, genCount(i))) { sfx.buy(); popAt(el); afterChange(true); saveSoon(); }
      break;
    }
    case 'grip': if (buyGrip(S)) { sfx.buy(); popAt(el); afterChange(true); saveSoon(); } break;
    case 'syn': if (buySynergy(S)) { sfx.buy(); popAt(el); afterChange(true); saveSoon(); } break;
    case 'power': buyPower(v); break;
    case 'openn': openN = u; renderView(); break;
    case 'open': tryOpen(u, Number(el.dataset.n) || openN); break;
    case 'again': if (lastOpen) { closeLayer(); tryOpen(lastOpen.ci, lastOpen.n); } break;
    case 'contents': crateModal(u); break;
    case 'skip': if (skipReel) skipReel(); break;
    case 'close': closeLayer(); break;
    case 'collect': closeLayer(); { const r = $('cash').getBoundingClientRect(); burst(r.left + r.width / 2, r.bottom, { n: 30, kind: 'coin', speed: 380, up: 100, size: 6, life: 1.2 }); sfx.sell(); } break;
    case 'rsell': doSell([u]); closeLayer(); break;
    case 'rsellall': doSell(v.split(',').map(Number)); closeLayer(); break;
    case 'item':
      if (selMode && tab === 'inv' && $('layer').hidden) { if (selected.has(u)) selected.delete(u); else selected.add(u); renderView(); }
      else itemModal(u);
      break;
    case 'sell': doSell([u]); closeLayer(); break;
    case 'lock': { const it = findItem(u); if (it) { it.l = it.l ? 0 : 1; saveSoon(); itemModal(u); } break; }
    case 'showcase': S.showcase = S.showcase === u ? 0 : u; saveSoon(); afterChange(true); itemModal(u); sfx.buy(); break;
    case 'toup': upStake = u; upFor = 0; wsMode = 'up'; closeLayer(); setTab('workshop'); break;
    case 'totrade': {
      const it = findItem(u);
      if (!it) break;
      const r = ITEMS[it.d].rarity;
      if (tradeSlots.length && ITEMS[findItem(tradeSlots[0]).d].rarity !== r) tradeSlots = [];
      if (!tradeSlots.includes(u) && tradeSlots.length < TRADE_UP_COUNT) tradeSlots.push(u);
      tradeRar = r;
      wsMode = 'trade';
      closeLayer();
      setTab('workshop');
      break;
    }
    case 'invrar': invRar = u; invShow = 120; renderView(); break;
    case 'more': invShow += 120; renderView(); break;
    case 'dupes': { const d = duplicates(S); if (d.length) doSell(d); break; }
    case 'sellall': {
      const list = S.inv.filter((x) => !x.l && x.u !== S.showcase);
      confirmModal('Sell all unlocked items?', `This sells <b>${list.length}</b> items for <b>${money(list.reduce((a, x) => a + itemValue(x), 0))}</b>. Locked and showcased items are kept.`, 'Sell all', 'sellallok', 'green');
      break;
    }
    case 'sellallok': doSell(S.inv.filter((x) => !x.l && x.u !== S.showcase).map((x) => x.u)); closeLayer(); break;
    case 'selmode': selMode = !selMode; selected.clear(); renderView(); break;
    case 'selvis': invList().slice(0, invShow).forEach((x) => selected.add(x.u)); renderView(); break;
    case 'selnone': selected.clear(); renderView(); break;
    case 'selsell': doSell([...selected]); selected.clear(); break;
    case 'ws': wsMode = v; renderView(); break;
    case 'trrar': tradeRar = u; renderView(); break;
    case 'tradd': if (tradeSlots.length < TRADE_UP_COUNT) { tradeSlots.push(u); sfx.pop(tradeSlots.length); renderView(); } break;
    case 'trrm': tradeSlots = tradeSlots.filter((x) => x !== u); renderView(); break;
    case 'trauto': case 'trauto1': {
      const el2 = eligible(tradeRar);
      while (tradeSlots.length < TRADE_UP_COUNT && el2.length) tradeSlots.push(el2.shift().u);
      renderView();
      break;
    }
    case 'trclear': tradeSlots = []; renderView(); break;
    case 'trgo': runTrade(); break;
    case 'upstake': upStake = u; upFor = 0; renderView(); break;
    case 'upclear': upStake = 0; renderView(); break;
    case 'uppick': upPick = u; renderView(); break;
    case 'upgo': runUpgrade(); break;
    case 'claim': {
      const cash = claimCollection(S, u);
      if (cash) { confetti(CRATES[u].colors[2]); flash(CRATES[u].colors[2]); sfx.reveal(4); toast(`${CRATES[u].name} Collection complete!`, `+${money(cash)} and +${Math.round(COLLECTION_BONUS * 100)}% income forever`, 'book'); afterChange(); saveSoon(); }
      break;
    }
    case 'rebirth': confirmModal('Rebirth?', `You'll get <b>+${starsFor(S.runEarned)} stars</b> (+${Math.round(STAR_BONUS * 100)}% income each). Your cash, upgrades, income sources and <b>all ${S.inv.length} items</b> reset. The collection book, achievements, stats and power-ups stay.`, 'Rebirth', 'rebirthok', 'gold'); break;
    case 'rebirthok': {
      const gain = rebirth(S);
      closeLayer();
      if (gain) { newItems.clear(); tradeSlots = []; upStake = 0; selected.clear(); flash('#ffd35a'); confetti('#ffd35a'); sfx.reveal(5); toast(`Reborn with +${gain} stars!`, `Income ×${(1 + S.stars * STAR_BONUS).toFixed(1)} from stars`, 'star'); heroShown = -1; afterChange(); save(); }
      break;
    }
    case 'reset': confirmModal('Reset everything?', 'Your cash, items, book, trophies and stats will be wiped. This can\'t be undone.', 'Reset', 'resetok'); break;
    case 'resetok': { const keep = { sound: S.sound }; S = newState(Date.now()); S.sound = keep.sound; newItems.clear(); tradeSlots = []; upStake = 0; heroShown = -1; closeLayer(); renderAll(); save(); break; }
  }
}
function popAt(el) {
  const r = el.getBoundingClientRect();
  burst(r.right - 40, r.top + r.height / 2, { n: 8, colors: ['#6dffb0', '#fff', '#22d3ee'], speed: 200, up: 60, g: 200, life: 0.5, size: 3.5 });
}

// ---------- supply drops: a glowing crate drifts by now and then ----------
function scheduleDrop() {
  setTimeout(spawnDrop, (90 + Math.random() * 150) * 1000);
}
function spawnDrop() {
  if (!loaded || busy || document.hidden || !$('layer').hidden) return scheduleDrop();
  const b = document.createElement('button');
  b.className = 'drop';
  b.setAttribute('aria-label', 'Supply drop! Click it for a bonus');
  const fromLeft = Math.random() < 0.5;
  b.style.left = `${fromLeft ? 10 : innerWidth - 90}px`;
  b.style.top = `${120 + Math.random() * Math.max(80, innerHeight - 320)}px`;
  b.style.setProperty('--dx', `${(fromLeft ? 1 : -1) * Math.min(260, innerWidth * 0.35)}px`);
  b.innerHTML = crateArt(CRATES.length - 1);
  b.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    const now = Date.now();
    const amt = round2(Math.max(clickValue(S, now) * 40, incomePerSec(S, now) * 90, 25));
    earn(S, amt);
    burst(e.clientX, e.clientY, { n: 30, kind: 'coin', speed: 420, up: 220, size: 6.5, life: 1.3 });
    floatText(e.clientX, e.clientY, `+${short(amt)}`, true);
    sfx.win();
    toast('Supply drop!', `+${money(amt)}`, 'gift');
    b.remove();
    afterChange(true);
    saveSoon();
  });
  document.body.appendChild(b);
  setTimeout(() => b.remove(), 13500);
  scheduleDrop();
}

// =====================================================================================================
// main loop
// =====================================================================================================
let lastT = Date.now();
let slow = 0;
setInterval(() => {
  const now = Date.now();
  const dt = (now - lastT) / 1000;
  lastT = now;
  if (!loaded) return;
  if (dt > OFFLINE_MIN) {
    const r = applyOffline(S, now);
    if (r.cash > 0 && $('layer').hidden) offlineModal(r);
  } else tick(S, dt, now);
  refresh();
  if (++slow % 10 === 0) {
    // achievements wait until a spin has landed, so a toast never gives the drop away
    if (!busy && $('layer').hidden && ACHIEVEMENTS.some((a) => !S.ach.includes(a.id) && a.test(S))) afterChange(true);
    renderHero();
  }
  if (slow % 20 === 0 && tab === 'earn') renderClickUps();
}, 100);
addEventListener('resize', () => { sizeFx(); if (isWide() && tab === 'earn') setTab('crates'); });

// for tests and curious players
window.crateRush = {
  state: () => JSON.parse(JSON.stringify(S)),
  busy: () => busy,
  wallet: () => wallet,
  pending: () => pending && pending.id,
};

sizeFx();
scheduleDrop();
if (framed) {
  $('boot').hidden = false;
  // ask the app for the save and the coin balance; if it doesn't answer, play without saving
  setTimeout(() => { if (!loaded) { loaded = true; $('boot').hidden = true; renderAll(); } }, 2500);
  post({ type: 'hwtodo:hello' });
} else renderAll();
</script>
</body>
</html>
