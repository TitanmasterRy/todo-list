<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Lunar lander</title>
<style>
  :root { --bg: #05060f; --fg: #dfe6ff; --accent: #7c9cff; --accent-2: #c77dff; --panel: rgba(255,255,255,.1); --bad: #ff6b6b; --good: #1dd1a1; --glow: color-mix(in srgb, var(--accent) 55%, transparent); --line: rgba(255,255,255,.14); --shadow: rgba(0,0,0,.5); --btn-ink: #05060f; }
  html.light { --line: rgba(0,0,0,.1); --shadow: rgba(30,40,80,.22); --btn-ink: #fff; }
  html, body { margin: 0; height: 100%; color: var(--fg); font: 500 15px/1.35 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; overflow: hidden; touch-action: none; }
  body { display: grid; place-items: center; background: radial-gradient(120% 80% at 50% -10%, color-mix(in srgb, var(--accent) 26%, var(--bg)), var(--bg) 60%), var(--bg); }
  canvas { display: block; border-radius: 12px; box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 45%, transparent), 0 0 34px var(--glow), 0 22px 50px var(--shadow); }
  .hud { position: fixed; top: 8px; left: 12px; right: 60px; display: flex; flex-wrap: wrap; gap: 6px; font-weight: 800; font-variant-numeric: tabular-nums; pointer-events: none; z-index: 2; }
  .hud > span { padding: 5px 12px; border-radius: 999px; background: linear-gradient(180deg, color-mix(in srgb, var(--panel) 100%, #fff 6%), var(--panel)); border: 1px solid var(--line); box-shadow: inset 0 1px 0 rgba(255,255,255,.14), 0 4px 14px var(--shadow); font-size: 12px; letter-spacing: .04em; text-transform: uppercase; backdrop-filter: blur(6px); }
  .hud b, .hud > span > span:not(.fuel) { display: inline-block; font-size: 15px; font-variant-numeric: tabular-nums; color: var(--accent); margin-left: 4px; text-shadow: 0 0 10px var(--glow); text-transform: none; }
  .hud .bad { color: var(--bad); text-shadow: 0 0 10px var(--bad); } .hud .good { color: var(--good); text-shadow: 0 0 10px var(--good); }
  .fuel { display: inline-block; width: 70px; height: 8px; border-radius: 4px; background: rgba(0,0,0,.3); vertical-align: middle; overflow: hidden; margin-left: 6px; box-shadow: inset 0 1px 2px rgba(0,0,0,.4); }
  .fuel i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, var(--accent-2), var(--accent)); box-shadow: 0 0 8px var(--glow); transition: width .2s; }
  #pause { position: fixed; top: 8px; right: 10px; width: 40px; height: 34px; border: 1px solid var(--line); border-radius: 999px; background: linear-gradient(180deg, color-mix(in srgb, var(--panel) 100%, #fff 6%), var(--panel)); color: var(--fg); font-size: 16px; cursor: pointer; z-index: 2; box-shadow: 0 4px 14px var(--shadow); }
  .center { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; text-align: center; z-index: 3; }
  .center > div { padding: 18px 26px; border-radius: 22px; background: linear-gradient(180deg, color-mix(in srgb, var(--panel) 100%, #fff 6%), var(--panel)); border: 1px solid var(--line); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 35%, transparent), 0 0 34px var(--glow), 0 22px 50px var(--shadow); backdrop-filter: blur(10px); max-width: 86vw; }
  .center h2 { margin: 0 0 6px; font-size: clamp(24px, 6vw, 34px); font-weight: 900; letter-spacing: -0.02em; background: linear-gradient(90deg, var(--accent), var(--accent-2)); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 0 14px var(--glow)); }
  .center p { margin: 0 0 14px; font-weight: 600; opacity: .85; }
  .center button { pointer-events: auto; font: inherit; padding: 10px 22px; border: 0; border-radius: 999px; background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: var(--btn-ink); font-weight: 900; letter-spacing: .02em; cursor: pointer; box-shadow: 0 8px 22px var(--glow), inset 0 1px 0 rgba(255,255,255,.4); transition: filter .12s, box-shadow .12s, transform .12s; }
  .center button:hover { filter: brightness(1.08); box-shadow: 0 12px 28px var(--glow), inset 0 1px 0 rgba(255,255,255,.4); }
  .center button:active { transform: scale(.96); animation: none; }
  .pad { position: fixed; bottom: 14px; left: 0; right: 0; display: flex; justify-content: space-between; padding: 0 14px; z-index: 2; }
  .pad div { display: flex; gap: 10px; }
  .pad button { width: 64px; height: 64px; border-radius: 50%; border: 1px solid var(--line); background: linear-gradient(180deg, color-mix(in srgb, var(--panel) 100%, #fff 10%), var(--panel)); color: var(--fg); font-size: 22px; touch-action: none; box-shadow: inset 0 1px 0 rgba(255,255,255,.2), 0 6px 16px var(--shadow); }
  .pad button:active { background: var(--accent); color: var(--btn-ink); box-shadow: 0 0 18px var(--glow); }
  @media (hover: hover) { .pad { display: none; } }
  /* juice */
  .pop { animation: pop .38s cubic-bezier(.3,1.6,.5,1); }
  @keyframes pop { 35% { transform: scale(1.35); } }
  .nb { animation: nb 1.1s ease-in-out 3; }
  @keyframes nb { 50% { color: #ffd54a; text-shadow: 0 0 14px #ffc93a, 0 0 28px #ff9f1a; } }
  .fx { position: fixed; z-index: 9; pointer-events: none; font: 900 20px system-ui, sans-serif; color: var(--accent); text-shadow: 0 0 12px var(--glow), 0 2px 0 rgba(0,0,0,.3); transform: translate(-50%, -50%); animation: rise .8s ease-out forwards; white-space: nowrap; }
  @keyframes rise { to { transform: translate(-50%, -160%); opacity: 0; } }
  .spark { position: fixed; z-index: 9; pointer-events: none; width: 7px; height: 7px; border-radius: 50%; margin: -3px 0 0 -3px; box-shadow: 0 0 8px currentColor; animation: spark .6s ease-out forwards; }
  @keyframes spark { to { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; } }
  body.flash::after { content: ''; position: fixed; inset: 0; z-index: 8; pointer-events: none; background: var(--flash, rgba(255,70,90,.4)); animation: flash .45s ease-out forwards; }
  @keyframes flash { to { opacity: 0; } }
  body.shake canvas { animation: shake .4s; }
  @keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
  @media (prefers-reduced-motion: no-preference) { #go { animation: float 2.4s ease-in-out infinite; } }
  @keyframes float { 50% { transform: translateY(-4px); } }
  @media (prefers-reduced-motion: reduce) { .pop, .nb, .fx, .spark, body.flash::after, body.shake canvas { animation-duration: .01s; } }
</style>
</head>
<body>
<canvas id="c" width="800" height="600" role="img" aria-label="Lunar lander: land gently on a glowing pad"></canvas>
<div class="hud" aria-live="off">
  <span>Score <b id="score">0</b></span><span>Landers <b id="lives">3</b></span><span>Level <b id="lvl">1</b></span>
  <span>Fuel <span class="fuel"><i id="fuel"></i></span></span><span id="vx">→ 0.0</span><span id="vy">↓ 0.0</span><span id="ang">0°</span><span id="alt">Alt 0</span>
</div>
<button id="pause" aria-label="Pause">⏸</button>
<div class="center" id="menu"><div><h2>🌙 Lunar lander</h2><p id="tip">← → rotate · ↑ or Space thrust · P pause<br />Touch down on a pad slower than 12 ↓ and 8 →, nearly upright.<br />Small pads pay more.</p><button id="go">Launch</button></div></div>
<div class="center" id="say" aria-live="polite" style="display:none"><div><h2 id="sayt"></h2></div></div>
<div class="pad"><div><button data-k="left" aria-label="Rotate left">⟲</button><button data-k="right" aria-label="Rotate right">⟳</button></div><div><button data-k="up" aria-label="Thrust">▲</button></div></div>
<script>
  // Homework To-Do arcade game. Report scores with parent.postMessage({ type: 'hwtodo:score', score }, '*').
  const q = new URLSearchParams(location.search), root = document.documentElement.style;
  if (q.get('accent')) root.setProperty('--accent', q.get('accent'));
  const light = q.get('dark') === '0';
  if (light) { root.setProperty('--bg', '#e8edf7'); root.setProperty('--fg', '#141a2e'); root.setProperty('--panel', 'rgba(20,26,46,.12)'); root.setProperty('--bad', '#c0392b'); root.setProperty('--good', '#0b7a5a'); document.documentElement.classList.add('light'); }
  const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const report = (score) => parent.postMessage({ type: 'hwtodo:score', score }, '*');
  // --- visual juice (no game logic here) ---
  const FX = (() => {
    const calm = matchMedia('(prefers-reduced-motion: reduce)').matches; let live = 0;
    const re = (el, cls) => { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); };
    const at = (el) => { const r = el.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; };
    const text = (t, x, y, color) => { if (live > 40) return; live++; const d = document.createElement('div'); d.className = 'fx'; d.textContent = t; d.style.left = x + 'px'; d.style.top = y + 'px'; if (color) d.style.color = color; document.body.appendChild(d); setTimeout(() => { d.remove(); live--; }, 800); };
    const burst = (x, y, color, k = 8) => { if (calm) return; for (let i = 0; i < k && live < 40; i++) { live++; const d = document.createElement('i'); d.className = 'spark'; const a = Math.random() * 6.283, r = 26 + Math.random() * 44; d.style.cssText = `left:${x}px;top:${y}px;color:${color};background:${color};--dx:${Math.cos(a) * r}px;--dy:${Math.sin(a) * r}px`; document.body.appendChild(d); setTimeout(() => { d.remove(); live--; }, 600); } };
    const flash = (color) => { document.body.style.setProperty('--flash', color || ''); re(document.body, 'flash'); setTimeout(() => document.body.classList.remove('flash'), 500); };
    const shake = () => { if (calm) return; re(document.body, 'shake'); setTimeout(() => document.body.classList.remove('shake'), 450); };
    const watch = (id, opts = {}) => { const el = document.getElementById(id); if (!el) return; let prev = parseFloat(el.textContent) || 0; new MutationObserver(() => { const v = parseFloat(el.textContent); if (isNaN(v) || v === prev) return; const d = v - prev; prev = v; re(el, 'pop'); if (opts.best) { re(el, 'nb'); const [x, y] = at(el); text('New best!', x, y - 10, '#ffd54a'); } else if (opts.delta && d > 0) { const [x, y] = at(el); text('+' + Math.round(d), x, y - 8); } }).observe(el, { childList: true, characterData: true, subtree: true }); };
    const cpt = (cv, cx, cy, cw, ch) => { const r = cv.getBoundingClientRect(); return [r.left + (cx / cw) * r.width, r.top + (cy / ch) * r.height]; };
    return { calm, text, burst, flash, shake, watch, at, cpt, re };
  })();
  FX.watch('score', { delta: true }); FX.watch('lives'); FX.watch('lvl');
  const c = document.getElementById('c'), x = c.getContext('2d'), $ = (id) => document.getElementById(id);
  const W = 800, H = 600, STEP = 20, SAFE_VY = 1.2, SAFE_VX = 0.8, SAFE_A = 0.2; // speeds in px/tick, angle in radians (~11°)
  const COL = light ? { sky: '#e8edf7', star: '20,26,46', rock: '#b9c0d4', edge: '#4a5270' } : { sky: '#05060f', star: '255,255,255', rock: '#1d2136', edge: '#8e97bd' };
  let ground, pads, stars, ship, score, lives, level, fuelMax, state = 'menu', paused = false, keys = {}, bits = [], wait = 0, last = 0, acc = 0;
  function fit() { const s = Math.min(innerWidth / W, innerHeight / H); c.style.width = W * s + 'px'; c.style.height = H * s + 'px'; }
  addEventListener('resize', fit); fit();
  // Terrain: a random walk every STEP px, then flattened spans for the pads. Narrower pads pay more; they shrink with the level.
  function terrain() {
    ground = []; let y = H * (0.62 + Math.random() * 0.12);
    for (let i = 0; i <= W / STEP; i++) { y += (Math.random() - 0.5) * (40 + level * 6); y = Math.max(H * 0.42, Math.min(H - 24, y)); ground.push(y); }
    pads = []; const shrink = Math.min(2, Math.floor((level - 1) / 2));
    for (const [m, w] of [[2, 6 - shrink], [3, 4 - shrink], [5, 3 - Math.min(1, shrink)]]) {
      for (let tries = 0; tries < 60; tries++) {
        const i = 1 + Math.floor(Math.random() * (ground.length - w - 2));
        if (pads.some((p) => i <= p.i1 + 2 && i + w >= p.i0 - 2)) continue;
        const py = Math.min(H - 24, Math.max(H * 0.45, ground.slice(i, i + w + 1).reduce((a, b) => a + b, 0) / (w + 1)));
        for (let k = i; k <= i + w; k++) ground[k] = py;
        pads.push({ i0: i, i1: i + w, x0: i * STEP, x1: (i + w) * STEP, y: py, m }); break;
      }
    }
    stars = Array.from({ length: 90 }, () => [Math.random() * W, Math.random() * H * 0.7, Math.random()]);
  }
  const groundAt = (px) => { const i = Math.max(0, Math.min(ground.length - 2, Math.floor(px / STEP))), t = px / STEP - i; return ground[i] + (ground[i + 1] - ground[i]) * Math.max(0, Math.min(1, t)); };
  function spawn() { fuelMax = Math.max(500, 1000 - (level - 1) * 70); ship = { x: 120 + Math.random() * (W - 240), y: 50, vx: (Math.random() - 0.5) * 2, vy: 0, a: 0, fuel: fuelMax, burn: false }; bits = []; state = 'flying'; }
  function start() { score = 0; lives = 3; level = 1; terrain(); spawn(); paused = false; $('menu').style.display = 'none'; hud(); }
  const pt = (lx, ly) => ({ x: ship.x + lx * Math.cos(ship.a) - ly * Math.sin(ship.a), y: ship.y + lx * Math.sin(ship.a) + ly * Math.cos(ship.a) });
  function say(t, ms = 1800) { $('sayt').textContent = t; $('say').style.display = 'grid'; wait = ms / (1000 / 60); }
  function hud() {
    $('score').textContent = score; $('lives').textContent = lives; $('lvl').textContent = level;
    if (!ship) return;
    $('fuel').style.width = (100 * ship.fuel) / fuelMax + '%';
    const vx = $('vx'), vy = $('vy'), ang = $('ang'), deg = Math.round((ship.a * 180) / Math.PI);
    vx.textContent = `${ship.vx < 0 ? '←' : '→'} ${Math.abs(ship.vx * 10).toFixed(1)}`; vx.className = Math.abs(ship.vx) > SAFE_VX ? 'bad' : 'good';
    vy.textContent = `${ship.vy < 0 ? '↑' : '↓'} ${Math.abs(ship.vy * 10).toFixed(1)}`; vy.className = ship.vy > SAFE_VY ? 'bad' : 'good';
    ang.textContent = `${deg}°`; ang.className = Math.abs(ship.a) > SAFE_A ? 'bad' : 'good';
    $('alt').textContent = `Alt ${Math.max(0, Math.round(groundAt(ship.x) - ship.y - 12))}`;
  }
  function crash(why) {
    state = 'crashed'; lives--; ship.burn = false;
    if (!calm) bits = Array.from({ length: 40 }, () => ({ x: ship.x, y: ship.y, vx: (Math.random() - 0.5) * 5, vy: -Math.random() * 4, life: 60 + Math.random() * 40 }));
    say(lives > 0 ? `💥 ${why}` : `💥 ${why} · Game over`); hud(); FX.flash(); FX.shake();
  }
  function tick() {
    if (state === 'flying') {
      const g = 0.016 + level * 0.002;
      if (keys.left) ship.a = Math.max(-1.57, ship.a - 0.045); if (keys.right) ship.a = Math.min(1.57, ship.a + 0.045);
      ship.burn = keys.up && ship.fuel > 0;
      if (ship.burn) { ship.vx += Math.sin(ship.a) * 0.045; ship.vy -= Math.cos(ship.a) * 0.045; ship.fuel = Math.max(0, ship.fuel - 1.2); }
      ship.vy += g; ship.x += ship.vx; ship.y += ship.vy;
      if (ship.x < 12 || ship.x > W - 12) { ship.x = Math.max(12, Math.min(W - 12, ship.x)); ship.vx = 0; }
      if (ship.y < -150) { ship.y = -150; ship.vy = Math.max(0, ship.vy); }
      const feet = [pt(-11, 12), pt(11, 12)], body = [pt(-9, -6), pt(9, -6), pt(0, -13), pt(-10, 4), pt(10, 4)];
      if (body.some((p) => p.y >= groundAt(p.x))) crash('Hit the rocks');
      else if (feet.some((p) => p.y >= groundAt(p.x))) {
        const pad = pads.find((p) => feet.every((f) => f.x >= p.x0 && f.x <= p.x1));
        if (!pad) crash('Not a landing pad');
        else if (ship.vy > SAFE_VY) crash('Too fast');
        else if (Math.abs(ship.vx) > SAFE_VX) crash('Sliding sideways');
        else if (Math.abs(ship.a) > SAFE_A) crash('Too tilted');
        else {
          const soft = Math.round((SAFE_VY - ship.vy) * 40), pts = Math.round((50 + soft + ship.fuel / 10) * pad.m);
          score += pts; ship.y = pad.y - 12; ship.vy = ship.vx = 0; ship.a = 0; ship.burn = false; state = 'landed'; say(`✅ Landed on ×${pad.m} · +${pts}`); FX.flash('rgba(29,209,161,.3)'); FX.burst(...FX.cpt(c, ship.x, ship.y, W, H), '#1dd1a1', 12);
        }
      }
      hud();
    } else if (state === 'landed' || state === 'crashed') {
      if (--wait <= 0) {
        $('say').style.display = 'none';
        if (state === 'landed') { level++; terrain(); spawn(); }
        else if (lives > 0) spawn();
        else { state = 'over'; report(score); $('menu').style.display = 'grid'; $('menu').querySelector('h2').textContent = `Score ${score}`; $('tip').textContent = `You reached level ${level}.`; $('go').textContent = 'Again'; }
        hud();
      }
    }
    bits.forEach((b) => { b.x += b.vx; b.y += b.vy; b.vy += 0.08; b.life--; if (b.y > groundAt(b.x)) { b.y = groundAt(b.x); b.vy *= -0.3; b.vx *= 0.7; } });
    bits = bits.filter((b) => b.life > 0);
  }
  function draw(now) {
    x.fillStyle = COL.sky; x.fillRect(0, 0, W, H);
    for (const [sx, sy, b] of stars || []) { x.fillStyle = `rgba(${COL.star},${(light ? 0.12 : 0.3) + b * 0.5 * (calm ? 1 : 0.7 + 0.3 * Math.sin(now / 500 + sx))})`; x.fillRect(sx, sy, 1.6, 1.6); }
    if (!ground) return;
    x.beginPath(); x.moveTo(0, H); ground.forEach((gy, i) => x.lineTo(i * STEP, gy)); x.lineTo(W, H); x.closePath(); x.fillStyle = COL.rock; x.fill();
    x.strokeStyle = COL.edge; x.lineWidth = 2; x.beginPath(); ground.forEach((gy, i) => x[i ? 'lineTo' : 'moveTo'](i * STEP, gy)); x.stroke();
    const accent = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim(), fg = getComputedStyle(document.documentElement).getPropertyValue('--fg').trim();
    x.font = '700 14px system-ui, sans-serif'; x.textAlign = 'center';
    x.shadowColor = accent; x.shadowBlur = 14;
    for (const p of pads) { x.strokeStyle = accent; x.lineWidth = 5; x.beginPath(); x.moveTo(p.x0, p.y); x.lineTo(p.x1, p.y); x.stroke(); }
    x.shadowBlur = 0; x.fillStyle = fg; for (const p of pads) x.fillText(`×${p.m}`, (p.x0 + p.x1) / 2, p.y + 22);
    if (ship && state !== 'crashed' && state !== 'over') {
      x.save(); x.translate(ship.x, ship.y); x.rotate(ship.a); x.strokeStyle = fg; x.lineWidth = 2;
      x.beginPath(); x.arc(0, -5, 8, Math.PI * 0.95, Math.PI * 2.05); x.closePath(); x.stroke(); // cabin
      x.strokeRect(-10, 3, 20, 4); x.beginPath(); x.moveTo(-7, 7); x.lineTo(-11, 12); x.moveTo(7, 7); x.lineTo(11, 12); x.moveTo(-14, 12); x.lineTo(-8, 12); x.moveTo(8, 12); x.lineTo(14, 12); x.stroke();
      if (ship.burn) { x.shadowColor = '#ffb347'; x.shadowBlur = 16; x.strokeStyle = '#ffb347'; x.beginPath(); x.moveTo(-4, 8); x.lineTo(0, 16 + (calm ? 6 : Math.random() * 10)); x.lineTo(4, 8); x.stroke(); x.shadowBlur = 0; }
      x.restore();
    }
    x.fillStyle = fg; bits.forEach((b) => x.fillRect(b.x - 1.5, b.y - 1.5, 3, 3));
    if (paused) { x.fillStyle = fg; x.font = '800 32px system-ui, sans-serif'; x.fillText('Paused · press P', W / 2, H / 2 - 40); }
  }
  // fixed 60 Hz physics so the game plays the same on any screen refresh rate
  function loop(now) { const dt = Math.min(100, now - (last || now)); last = now; if (!paused) { acc += dt; while (acc >= 1000 / 60) { tick(); acc -= 1000 / 60; } } draw(now); requestAnimationFrame(loop); }
  function pause(on = !paused) { if (state === 'menu' || state === 'over') return; paused = on; acc = 0; $('pause').textContent = paused ? '▶' : '⏸'; $('pause').setAttribute('aria-label', paused ? 'Resume' : 'Pause'); }
  const KEY = { ArrowLeft: 'left', a: 'left', ArrowRight: 'right', d: 'right', ArrowUp: 'up', w: 'up', ' ': 'up' };
  addEventListener('keydown', (e) => { if (KEY[e.key]) { keys[KEY[e.key]] = true; e.preventDefault(); } if (e.key === 'p' || e.key === 'P') pause(); });
  addEventListener('keyup', (e) => { if (KEY[e.key]) keys[KEY[e.key]] = false; });
  addEventListener('blur', () => { keys = {}; pause(true); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) pause(true); });
  document.querySelectorAll('.pad button').forEach((b) => {
    const k = b.dataset.k, off = () => (keys[k] = false);
    b.addEventListener('pointerdown', (e) => { e.preventDefault(); keys[k] = true; }); b.addEventListener('pointerup', off); b.addEventListener('pointercancel', off); b.addEventListener('pointerleave', off);
  });
  $('pause').onclick = () => pause();
  $('go').onclick = start;
  level = 1; terrain(); requestAnimationFrame(loop);
</script>
</body>
</html>
