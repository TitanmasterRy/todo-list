<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Lunar lander</title>
<style>
  :root { --bg: #05060f; --fg: #dfe6ff; --accent: #7c9cff; --panel: rgba(255,255,255,.12); --bad: #ff6b6b; --good: #1dd1a1; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 15px system-ui, sans-serif; overflow: hidden; touch-action: none; }
  body { display: grid; place-items: center; }
  canvas { display: block; }
  .hud { position: fixed; top: 8px; left: 12px; right: 60px; display: flex; flex-wrap: wrap; gap: 2px 14px; font-weight: 700; font-variant-numeric: tabular-nums; pointer-events: none; text-shadow: 0 1px 2px var(--bg); }
  .hud .bad { color: var(--bad); } .hud .good { color: var(--good); }
  .fuel { display: inline-block; width: 70px; height: 8px; border-radius: 4px; background: var(--panel); vertical-align: middle; overflow: hidden; }
  .fuel i { display: block; height: 100%; width: 100%; background: var(--accent); }
  #pause { position: fixed; top: 6px; right: 10px; width: 38px; height: 34px; border: 0; border-radius: 8px; background: var(--panel); color: var(--fg); font-size: 16px; cursor: pointer; }
  .center { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; text-align: center; }
  .center > div { background: color-mix(in srgb, var(--bg) 78%, transparent); padding: 6px 22px 18px; border-radius: 14px; }
  .center button { pointer-events: auto; font: inherit; padding: 10px 22px; border: 0; border-radius: 10px; background: var(--accent); color: #05060f; font-weight: 800; cursor: pointer; }
  .pad { position: fixed; bottom: 14px; left: 0; right: 0; display: flex; justify-content: space-between; padding: 0 14px; }
  .pad div { display: flex; gap: 10px; }
  .pad button { width: 64px; height: 64px; border-radius: 50%; border: 0; background: var(--panel); color: var(--fg); font-size: 22px; touch-action: none; }
  @media (hover: hover) { .pad { display: none; } }
</style>
</head>
<body>
<canvas id="c" width="800" height="600" role="img" aria-label="Lunar lander: land gently on a glowing pad"></canvas>
<div class="hud" aria-live="off">
  <span>Score <span id="score">0</span></span><span>Landers <span id="lives">3</span></span><span>Level <span id="lvl">1</span></span>
  <span>Fuel <span class="fuel"><i id="fuel"></i></span></span><span id="vx">→ 0.0</span><span id="vy">↓ 0.0</span><span id="ang">0°</span><span id="alt">Alt 0</span>
</div>
<button id="pause" aria-label="Pause">⏸</button>
<div class="center" id="menu"><div><h2>🌙 Lunar lander</h2><p id="tip">← → rotate · ↑ or Space thrust · P pause<br />Touch down on a pad slower than 12 ↓ and 8 →, nearly upright.<br />Small pads pay more.</p><button id="go">Launch</button></div></div>
<div class="center" id="say" aria-live="polite" style="display:none"><div><h2 id="sayt"></h2></div></div>
<div class="pad"><div><button data-k="left" aria-label="Rotate left">⟲</button><button data-k="right" aria-label="Rotate right">⟳</button></div><div><button data-k="up" aria-label="Thrust">▲</button></div></div>
<script>
  // Homework To-Do arcade game. Report scores with parent.postMessage({ type: 'hwtodo:score', score }, '*').
  const q = new URLSearchParams(location.search), root = document.documentElement.style;
  if (q.get('accent')) root.setProperty('--accent', q.get('accent'));
  const light = q.get('dark') === '0';
  if (light) { root.setProperty('--bg', '#e8edf7'); root.setProperty('--fg', '#141a2e'); root.setProperty('--panel', 'rgba(20,26,46,.12)'); root.setProperty('--bad', '#c0392b'); root.setProperty('--good', '#0b7a5a'); }
  const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const report = (score) => parent.postMessage({ type: 'hwtodo:score', score }, '*');
  const c = document.getElementById('c'), x = c.getContext('2d'), $ = (id) => document.getElementById(id);
  const W = 800, H = 600, STEP = 20, SAFE_VY = 1.2, SAFE_VX = 0.8, SAFE_A = 0.2; // speeds in px/tick, angle in radians (~11°)
  const COL = light ? { sky: '#e8edf7', star: '20,26,46', rock: '#b9c0d4', edge: '#4a5270' } : { sky: '#05060f', star: '255,255,255', rock: '#1d2136', edge: '#8e97bd' };
  let ground, pads, stars, ship, score, lives, level, fuelMax, state = 'menu', paused = false, keys = {}, bits = [], wait = 0, last = 0, acc = 0;
  function fit() { const s = Math.min(innerWidth / W, innerHeight / H); c.style.width = W * s + 'px'; c.style.height = H * s + 'px'; }
  addEventListener('resize', fit); fit();
  // Terrain: a random walk every STEP px, then flattened spans for the pads. Narrower pads pay more; they shrink with the level.
  function terrain() {
    ground = []; let y = H * (0.62 + Math.random() * 0.12);
    for (let i = 0; i <= W / STEP; i++) { y += (Math.random() - 0.5) * (40 + level * 6); y = Math.max(H * 0.42, Math.min(H - 24, y)); ground.push(y); }
    pads = []; const shrink = Math.min(2, Math.floor((level - 1) / 2));
    for (const [m, w] of [[2, 6 - shrink], [3, 4 - shrink], [5, 3 - Math.min(1, shrink)]]) {
      for (let tries = 0; tries < 60; tries++) {
        const i = 1 + Math.floor(Math.random() * (ground.length - w - 2));
        if (pads.some((p) => i <= p.i1 + 2 && i + w >= p.i0 - 2)) continue;
        const py = Math.min(H - 24, Math.max(H * 0.45, ground.slice(i, i + w + 1).reduce((a, b) => a + b, 0) / (w + 1)));
        for (let k = i; k <= i + w; k++) ground[k] = py;
        pads.push({ i0: i, i1: i + w, x0: i * STEP, x1: (i + w) * STEP, y: py, m }); break;
      }
    }
    stars = Array.from({ length: 90 }, () => [Math.random() * W, Math.random() * H * 0.7, Math.random()]);
  }
  const groundAt = (px) => { const i = Math.max(0, Math.min(ground.length - 2, Math.floor(px / STEP))), t = px / STEP - i; return ground[i] + (ground[i + 1] - ground[i]) * Math.max(0, Math.min(1, t)); };
  function spawn() { fuelMax = Math.max(500, 1000 - (level - 1) * 70); ship = { x: 120 + Math.random() * (W - 240), y: 50, vx: (Math.random() - 0.5) * 2, vy: 0, a: 0, fuel: fuelMax, burn: false }; bits = []; state = 'flying'; }
  function start() { score = 0; lives = 3; level = 1; terrain(); spawn(); paused = false; $('menu').style.display = 'none'; hud(); }
  const pt = (lx, ly) => ({ x: ship.x + lx * Math.cos(ship.a) - ly * Math.sin(ship.a), y: ship.y + lx * Math.sin(ship.a) + ly * Math.cos(ship.a) });
  function say(t, ms = 1800) { $('sayt').textContent = t; $('say').style.display = 'grid'; wait = ms / (1000 / 60); }
  function hud() {
    $('score').textContent = score; $('lives').textContent = lives; $('lvl').textContent = level;
    if (!ship) return;
    $('fuel').style.width = (100 * ship.fuel) / fuelMax + '%';
    const vx = $('vx'), vy = $('vy'), ang = $('ang'), deg = Math.round((ship.a * 180) / Math.PI);
    vx.textContent = `${ship.vx < 0 ? '←' : '→'} ${Math.abs(ship.vx * 10).toFixed(1)}`; vx.className = Math.abs(ship.vx) > SAFE_VX ? 'bad' : 'good';
    vy.textContent = `${ship.vy < 0 ? '↑' : '↓'} ${Math.abs(ship.vy * 10).toFixed(1)}`; vy.className = ship.vy > SAFE_VY ? 'bad' : 'good';
    ang.textContent = `${deg}°`; ang.className = Math.abs(ship.a) > SAFE_A ? 'bad' : 'good';
    $('alt').textContent = `Alt ${Math.max(0, Math.round(groundAt(ship.x) - ship.y - 12))}`;
  }
  function crash(why) {
    state = 'crashed'; lives--; ship.burn = false;
    if (!calm) bits = Array.from({ length: 40 }, () => ({ x: ship.x, y: ship.y, vx: (Math.random() - 0.5) * 5, vy: -Math.random() * 4, life: 60 + Math.random() * 40 }));
    say(lives > 0 ? `💥 ${why}` : `💥 ${why} · Game over`); hud();
  }
  function tick() {
    if (state === 'flying') {
      const g = 0.016 + level * 0.002;
      if (keys.left) ship.a = Math.max(-1.57, ship.a - 0.045); if (keys.right) ship.a = Math.min(1.57, ship.a + 0.045);
      ship.burn = keys.up && ship.fuel > 0;
      if (ship.burn) { ship.vx += Math.sin(ship.a) * 0.045; ship.vy -= Math.cos(ship.a) * 0.045; ship.fuel = Math.max(0, ship.fuel - 1.2); }
      ship.vy += g; ship.x += ship.vx; ship.y += ship.vy;
      if (ship.x < 12 || ship.x > W - 12) { ship.x = Math.max(12, Math.min(W - 12, ship.x)); ship.vx = 0; }
      if (ship.y < -150) { ship.y = -150; ship.vy = Math.max(0, ship.vy); }
      const feet = [pt(-11, 12), pt(11, 12)], body = [pt(-9, -6), pt(9, -6), pt(0, -13), pt(-10, 4), pt(10, 4)];
      if (body.some((p) => p.y >= groundAt(p.x))) crash('Hit the rocks');
      else if (feet.some((p) => p.y >= groundAt(p.x))) {
        const pad = pads.find((p) => feet.every((f) => f.x >= p.x0 && f.x <= p.x1));
        if (!pad) crash('Not a landing pad');
        else if (ship.vy > SAFE_VY) crash('Too fast');
        else if (Math.abs(ship.vx) > SAFE_VX) crash('Sliding sideways');
        else if (Math.abs(ship.a) > SAFE_A) crash('Too tilted');
        else {
          const soft = Math.round((SAFE_VY - ship.vy) * 40), pts = Math.round((50 + soft + ship.fuel / 10) * pad.m);
          score += pts; ship.y = pad.y - 12; ship.vy = ship.vx = 0; ship.a = 0; ship.burn = false; state = 'landed'; say(`✅ Landed on ×${pad.m} · +${pts}`);
        }
      }
      hud();
    } else if (state === 'landed' || state === 'crashed') {
      if (--wait <= 0) {
        $('say').style.display = 'none';
        if (state === 'landed') { level++; terrain(); spawn(); }
        else if (lives > 0) spawn();
        else { state = 'over'; report(score); $('menu').style.display = 'grid'; $('menu').querySelector('h2').textContent = `Score ${score}`; $('tip').textContent = `You reached level ${level}.`; $('go').textContent = 'Again'; }
        hud();
      }
    }
    bits.forEach((b) => { b.x += b.vx; b.y += b.vy; b.vy += 0.08; b.life--; if (b.y > groundAt(b.x)) { b.y = groundAt(b.x); b.vy *= -0.3; b.vx *= 0.7; } });
    bits = bits.filter((b) => b.life > 0);
  }
  function draw(now) {
    x.fillStyle = COL.sky; x.fillRect(0, 0, W, H);
    for (const [sx, sy, b] of stars || []) { x.fillStyle = `rgba(${COL.star},${(light ? 0.12 : 0.3) + b * 0.5 * (calm ? 1 : 0.7 + 0.3 * Math.sin(now / 500 + sx))})`; x.fillRect(sx, sy, 1.6, 1.6); }
    if (!ground) return;
    x.beginPath(); x.moveTo(0, H); ground.forEach((gy, i) => x.lineTo(i * STEP, gy)); x.lineTo(W, H); x.closePath(); x.fillStyle = COL.rock; x.fill();
    x.strokeStyle = COL.edge; x.lineWidth = 2; x.beginPath(); ground.forEach((gy, i) => x[i ? 'lineTo' : 'moveTo'](i * STEP, gy)); x.stroke();
    const accent = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim(), fg = getComputedStyle(document.documentElement).getPropertyValue('--fg').trim();
    x.font = '700 14px system-ui, sans-serif'; x.textAlign = 'center';
    for (const p of pads) { x.strokeStyle = accent; x.lineWidth = 5; x.beginPath(); x.moveTo(p.x0, p.y); x.lineTo(p.x1, p.y); x.stroke(); x.fillStyle = fg; x.fillText(`×${p.m}`, (p.x0 + p.x1) / 2, p.y + 22); }
    if (ship && state !== 'crashed' && state !== 'over') {
      x.save(); x.translate(ship.x, ship.y); x.rotate(ship.a); x.strokeStyle = fg; x.lineWidth = 2;
      x.beginPath(); x.arc(0, -5, 8, Math.PI * 0.95, Math.PI * 2.05); x.closePath(); x.stroke(); // cabin
      x.strokeRect(-10, 3, 20, 4); x.beginPath(); x.moveTo(-7, 7); x.lineTo(-11, 12); x.moveTo(7, 7); x.lineTo(11, 12); x.moveTo(-14, 12); x.lineTo(-8, 12); x.moveTo(8, 12); x.lineTo(14, 12); x.stroke();
      if (ship.burn) { x.strokeStyle = '#ffb347'; x.beginPath(); x.moveTo(-4, 8); x.lineTo(0, 16 + (calm ? 6 : Math.random() * 10)); x.lineTo(4, 8); x.stroke(); }
      x.restore();
    }
    x.fillStyle = fg; bits.forEach((b) => x.fillRect(b.x - 1.5, b.y - 1.5, 3, 3));
    if (paused) { x.fillStyle = fg; x.font = '800 32px system-ui, sans-serif'; x.fillText('Paused · press P', W / 2, H / 2 - 40); }
  }
  // fixed 60 Hz physics so the game plays the same on any screen refresh rate
  function loop(now) { const dt = Math.min(100, now - (last || now)); last = now; if (!paused) { acc += dt; while (acc >= 1000 / 60) { tick(); acc -= 1000 / 60; } } draw(now); requestAnimationFrame(loop); }
  function pause(on = !paused) { if (state === 'menu' || state === 'over') return; paused = on; acc = 0; $('pause').textContent = paused ? '▶' : '⏸'; $('pause').setAttribute('aria-label', paused ? 'Resume' : 'Pause'); }
  const KEY = { ArrowLeft: 'left', a: 'left', ArrowRight: 'right', d: 'right', ArrowUp: 'up', w: 'up', ' ': 'up' };
  addEventListener('keydown', (e) => { if (KEY[e.key]) { keys[KEY[e.key]] = true; e.preventDefault(); } if (e.key === 'p' || e.key === 'P') pause(); });
  addEventListener('keyup', (e) => { if (KEY[e.key]) keys[KEY[e.key]] = false; });
  addEventListener('blur', () => { keys = {}; pause(true); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) pause(true); });
  document.querySelectorAll('.pad button').forEach((b) => {
    const k = b.dataset.k, off = () => (keys[k] = false);
    b.addEventListener('pointerdown', (e) => { e.preventDefault(); keys[k] = true; }); b.addEventListener('pointerup', off); b.addEventListener('pointercancel', off); b.addEventListener('pointerleave', off);
  });
  $('pause').onclick = () => pause();
  $('go').onclick = start;
  level = 1; terrain(); requestAnimationFrame(loop);
</script>
</body>
</html>
