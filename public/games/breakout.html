<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Breakout</title>
<style>
  :root { --bg: #0b0820; --fg: #fff; --accent: #ff4fd8; --accent-2: #7c4dff; --glow: color-mix(in srgb, var(--accent) 55%, transparent); --panel: rgba(255,255,255,.08); --line: rgba(255,255,255,.14); --shadow: rgba(0,0,0,.5); --btn-ink: #120d33; }
  html.light { --bg: #f1eefb; --fg: #1a1433; --panel: rgba(0,0,0,.06); --line: rgba(0,0,0,.1); --shadow: rgba(30,20,80,.22); }
  html, body { margin: 0; height: 100%; color: var(--fg); font: 500 15px/1.35 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; overflow: hidden; touch-action: none; }
  body { background: radial-gradient(120% 80% at 50% -10%, color-mix(in srgb, var(--accent) 26%, var(--bg)), var(--bg) 60%), var(--bg); }
  canvas { display: block; margin: 0 auto; background: #120d33; max-width: 100vw; max-height: 100vh; border-radius: 12px; box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 45%, transparent), 0 0 34px var(--glow), 0 22px 50px var(--shadow); }
  .hud { position: fixed; top: 8px; left: 12px; display: flex; gap: 8px; font-weight: 800; z-index: 2; }
  .hud span { padding: 6px 14px; border-radius: 999px; background: linear-gradient(180deg, color-mix(in srgb, var(--panel) 100%, #fff 6%), var(--panel)); border: 1px solid var(--line); box-shadow: inset 0 1px 0 rgba(255,255,255,.14), 0 4px 14px var(--shadow); font-size: 13px; letter-spacing: .04em; text-transform: uppercase; backdrop-filter: blur(6px); }
  .hud b { display: inline-block; font-size: 16px; font-variant-numeric: tabular-nums; color: var(--accent); margin-left: 4px; text-shadow: 0 0 10px var(--glow); }
  .center { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; text-align: center; z-index: 3; }
  .center > div { padding: 22px 26px; border-radius: 22px; background: linear-gradient(180deg, color-mix(in srgb, var(--panel) 100%, #fff 6%), var(--panel)); border: 1px solid var(--line); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 35%, transparent), 0 0 34px var(--glow), 0 22px 50px var(--shadow); backdrop-filter: blur(10px); max-width: 86vw; }
  .center h2 { margin: 0 0 6px; font-size: clamp(24px, 6vw, 34px); font-weight: 900; letter-spacing: -0.02em; background: linear-gradient(90deg, var(--accent), var(--accent-2)); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 0 14px var(--glow)); }
  .center p { margin: 0 0 14px; font-weight: 600; opacity: .85; }
  .center button { pointer-events: auto; font: inherit; padding: 10px 22px; border: 0; border-radius: 999px; background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: var(--btn-ink); font-weight: 900; letter-spacing: .02em; cursor: pointer; box-shadow: 0 8px 22px var(--glow), inset 0 1px 0 rgba(255,255,255,.4); transition: filter .12s, box-shadow .12s, transform .12s; }
  .center button:hover { filter: brightness(1.08); box-shadow: 0 12px 28px var(--glow), inset 0 1px 0 rgba(255,255,255,.4); }
  .center button:active { transform: scale(.96); animation: none; }
  /* juice */
  .pop { animation: pop .38s cubic-bezier(.3,1.6,.5,1); }
  @keyframes pop { 35% { transform: scale(1.35); } }
  .fx { position: fixed; z-index: 9; pointer-events: none; font: 900 20px system-ui, sans-serif; color: var(--accent); text-shadow: 0 0 12px var(--glow), 0 2px 0 rgba(0,0,0,.3); transform: translate(-50%, -50%); animation: rise .8s ease-out forwards; white-space: nowrap; }
  @keyframes rise { to { transform: translate(-50%, -160%); opacity: 0; } }
  .spark { position: fixed; z-index: 9; pointer-events: none; width: 7px; height: 7px; border-radius: 50%; margin: -3px 0 0 -3px; box-shadow: 0 0 8px currentColor; animation: spark .6s ease-out forwards; }
  @keyframes spark { to { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; } }
  body.flash::after { content: ''; position: fixed; inset: 0; z-index: 8; pointer-events: none; background: var(--flash, rgba(255,70,90,.4)); animation: flash .45s ease-out forwards; }
  @keyframes flash { to { opacity: 0; } }
  body.shake canvas { animation: shake .4s; }
  @keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
  @media (prefers-reduced-motion: no-preference) { #go { animation: float 2.4s ease-in-out infinite; } }
  @keyframes float { 50% { filter: brightness(1.18) drop-shadow(0 0 10px var(--accent)); } }
  @media (prefers-reduced-motion: reduce) { .pop, .fx, .spark, body.flash::after, body.shake canvas { animation-duration: .01s; } }
</style>
</head>
<body>
<canvas id="c" width="480" height="640"></canvas>
<div class="hud"><span>Score <b id="score">0</b></span><span>Lives <b id="lives">3</b></span><span>Level <b id="lvl">1</b></span></div>
<div class="center" id="menu"><div><h2>🧱 Breakout</h2><p>Mouse, finger or ← → to move.</p><button id="go">Start</button></div></div>
<script>
  const q = new URLSearchParams(location.search);
  if (q.get('accent')) document.documentElement.style.setProperty('--accent', q.get('accent'));
  if (q.get('dark') === '0') document.documentElement.classList.add('light');
  const report = (score) => parent.postMessage({ type: 'hwtodo:score', score }, '*');
  // --- visual juice (no game logic here) ---
  const FX = (() => {
    const calm = matchMedia('(prefers-reduced-motion: reduce)').matches; let live = 0;
    const re = (el, cls) => { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); };
    const at = (el) => { const r = el.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; };
    const text = (t, x, y, color) => { if (live > 40) return; live++; const d = document.createElement('div'); d.className = 'fx'; d.textContent = t; d.style.left = x + 'px'; d.style.top = y + 'px'; if (color) d.style.color = color; document.body.appendChild(d); setTimeout(() => { d.remove(); live--; }, 800); };
    const burst = (x, y, color, k = 8) => { if (calm) return; for (let i = 0; i < k && live < 40; i++) { live++; const d = document.createElement('i'); d.className = 'spark'; const a = Math.random() * 6.283, r = 26 + Math.random() * 44; d.style.cssText = `left:${x}px;top:${y}px;color:${color};background:${color};--dx:${Math.cos(a) * r}px;--dy:${Math.sin(a) * r}px`; document.body.appendChild(d); setTimeout(() => { d.remove(); live--; }, 600); } };
    const flash = (color) => { document.body.style.setProperty('--flash', color || ''); re(document.body, 'flash'); setTimeout(() => document.body.classList.remove('flash'), 500); };
    const shake = () => { if (calm) return; re(document.body, 'shake'); setTimeout(() => document.body.classList.remove('shake'), 450); };
    const watch = (id) => { const el = document.getElementById(id); if (!el) return; let prev = el.textContent; new MutationObserver(() => { if (el.textContent === prev) return; prev = el.textContent; re(el, 'pop'); }).observe(el, { childList: true, characterData: true, subtree: true }); };
    const cpt = (cv, cx, cy, cw, ch) => { const r = cv.getBoundingClientRect(); return [r.left + (cx / cw) * r.width, r.top + (cy / ch) * r.height]; };
    return { calm, text, burst, flash, shake, watch, at, cpt };
  })();
  FX.watch('score'); FX.watch('lives'); FX.watch('lvl');
  const c = document.getElementById('c'), x = c.getContext('2d'), $ = (id) => document.getElementById(id);
  const W = 480, H = 640, COLORS = ['#ff4fd8', '#ff9f43', '#feca57', '#1dd1a1', '#54a0ff', '#a29bfe'];
  let pad, ball, bricks, score, lives, level, running = false, keys = {};
  const stars = Array.from({ length: 50 }, () => [Math.random() * W, Math.random() * H, 0.3 + Math.random() * 0.7]);
  const trail = new Float32Array(16); let ti = 0;
  function fit() { const s = Math.min(innerWidth / W, innerHeight / H); c.style.width = W * s + 'px'; c.style.height = H * s + 'px'; }
  addEventListener('resize', fit); fit();
  function build() { bricks = []; for (let r = 0; r < 6; r++) for (let i = 0; i < 8; i++) bricks.push({ x: 8 + i * 58, y: 70 + r * 24, w: 54, h: 18, c: COLORS[r], hp: r < Math.min(3, level - 1) ? 2 : 1 }); }
  function reset() { pad = { x: W / 2 - 45, w: 90 }; ball = { x: W / 2, y: H - 80, vx: 3 * (Math.random() < 0.5 ? -1 : 1), vy: -(4 + level * 0.5), stuck: true }; }
  function start() { score = 0; lives = 3; level = 1; build(); reset(); running = true; $('menu').style.display = 'none'; hud(); }
  function hud() { $('score').textContent = score; $('lives').textContent = lives; $('lvl').textContent = level; }
  function step() {
    if (running) {
      if (keys.l) pad.x -= 8; if (keys.r) pad.x += 8; pad.x = Math.max(0, Math.min(W - pad.w, pad.x));
      if (ball.stuck) { ball.x = pad.x + pad.w / 2; ball.y = H - 50; }
      else {
        ball.x += ball.vx; ball.y += ball.vy;
        if (ball.x < 6 || ball.x > W - 6) ball.vx *= -1;
        if (ball.y < 6) ball.vy = Math.abs(ball.vy);
        if (ball.y > H - 44 && ball.y < H - 30 && ball.x > pad.x - 6 && ball.x < pad.x + pad.w + 6 && ball.vy > 0) {
          const hit = (ball.x - (pad.x + pad.w / 2)) / (pad.w / 2);
          const sp = Math.hypot(ball.vx, ball.vy); ball.vx = sp * hit * 0.9; ball.vy = -Math.sqrt(Math.max(4, sp * sp - ball.vx * ball.vx));
        }
        for (const b of bricks) if (b.hp > 0 && ball.x > b.x - 5 && ball.x < b.x + b.w + 5 && ball.y > b.y - 5 && ball.y < b.y + b.h + 5) {
          b.hp--; score += b.hp ? 5 : 10; hud();
          FX.burst(...FX.cpt(c, b.x + b.w / 2, b.y + b.h / 2, W, H), b.c, b.hp ? 4 : 7); if (!b.hp) FX.text('+10', ...FX.cpt(c, b.x + b.w / 2, b.y, W, H), b.c);
          const fromSide = ball.x < b.x || ball.x > b.x + b.w; if (fromSide) ball.vx *= -1; else ball.vy *= -1; break;
        }
        if (bricks.every((b) => b.hp <= 0)) { level++; score += 100; FX.flash('rgba(255,213,74,.35)'); FX.text('Level ' + level + '! +100', ...FX.cpt(c, W / 2, H / 2, W, H), '#ffd54a'); build(); reset(); hud(); }
        if (ball.y > H + 10) { lives--; hud(); FX.flash(); FX.shake(); if (lives <= 0) { running = false; report(score); $('menu').style.display = 'grid'; $('menu').querySelector('h2').textContent = `Score ${score}`; $('go').textContent = 'Again'; } else reset(); }
      }
    }
    x.fillStyle = '#120d33'; x.fillRect(0, 0, W, H);
    x.fillStyle = 'rgba(255,255,255,.35)'; for (let i = 0; i < stars.length; i++) { const s = stars[i]; x.globalAlpha = s[2]; x.fillRect(s[0], s[1], 1.5, 1.5); } x.globalAlpha = 1;
    for (const b of bricks || []) if (b.hp > 0) { x.fillStyle = b.c; x.globalAlpha = b.hp > 1 ? 1 : 0.85; x.fillRect(b.x, b.y, b.w, b.h); x.fillStyle = 'rgba(255,255,255,.28)'; x.fillRect(b.x, b.y, b.w, 5); x.fillStyle = 'rgba(0,0,0,.22)'; x.fillRect(b.x, b.y + b.h - 3, b.w, 3); x.globalAlpha = 1; if (b.hp > 1) { x.strokeStyle = '#fff'; x.strokeRect(b.x + 2, b.y + 2, b.w - 4, b.h - 4); } }
    if (pad) {
      const accent = getComputedStyle(document.documentElement).getPropertyValue('--accent');
      x.shadowColor = accent; x.shadowBlur = 16; x.fillStyle = accent; x.fillRect(pad.x, H - 40, pad.w, 10); x.shadowBlur = 0; x.fillStyle = 'rgba(255,255,255,.4)'; x.fillRect(pad.x, H - 40, pad.w, 3);
      if (!ball.stuck) { trail[ti] = ball.x; trail[ti + 1] = ball.y; ti = (ti + 2) % 16; }
      x.fillStyle = '#fff'; for (let i = 0; i < 16; i += 2) { const k = ((i - ti + 16) % 16) / 16; x.globalAlpha = k * 0.35; x.beginPath(); x.arc(trail[i], trail[i + 1], 2 + k * 3, 0, 7); x.fill(); } x.globalAlpha = 1;
      x.shadowColor = '#fff'; x.shadowBlur = 14; x.beginPath(); x.arc(ball.x, ball.y, 6, 0, 7); x.fill(); x.shadowBlur = 0;
    }
    requestAnimationFrame(step);
  }
  const launch = () => { if (ball && ball.stuck) ball.stuck = false; };
  addEventListener('pointermove', (e) => { if (!pad) return; const r = c.getBoundingClientRect(); pad.x = ((e.clientX - r.left) / r.width) * W - pad.w / 2; });
  addEventListener('pointerdown', launch);
  addEventListener('keydown', (e) => { if (e.key === 'ArrowLeft' || e.key === 'a') keys.l = true; if (e.key === 'ArrowRight' || e.key === 'd') keys.r = true; if (e.key === ' ') { e.preventDefault(); launch(); } });
  addEventListener('keyup', (e) => { if (e.key === 'ArrowLeft' || e.key === 'a') keys.l = false; if (e.key === 'ArrowRight' || e.key === 'd') keys.r = false; });
  $('go').onclick = (e) => { e.stopPropagation(); start(); };
  level = 1; build(); step();
</script>
</body>
</html>
