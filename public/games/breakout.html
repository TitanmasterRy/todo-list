<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Breakout</title>
<style>
  :root { --accent: #ff4fd8; }
  html, body { margin: 0; height: 100%; background: #0b0820; color: #fff; font: 15px system-ui, sans-serif; overflow: hidden; touch-action: none; }
  canvas { display: block; margin: 0 auto; background: #120d33; max-width: 100vw; max-height: 100vh; }
  .hud { position: fixed; top: 8px; left: 12px; font-weight: 800; }
  .center { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; text-align: center; }
  .center button { pointer-events: auto; font: inherit; padding: 10px 22px; border: 0; border-radius: 10px; background: var(--accent); color: #120d33; font-weight: 800; cursor: pointer; }
</style>
</head>
<body>
<canvas id="c" width="480" height="640"></canvas>
<div class="hud">Score <span id="score">0</span> · Lives <span id="lives">3</span> · Level <span id="lvl">1</span></div>
<div class="center" id="menu"><div><h2>🧱 Breakout</h2><p>Mouse, finger or ← → to move.</p><button id="go">Start</button></div></div>
<script>
  const q = new URLSearchParams(location.search);
  if (q.get('accent')) document.documentElement.style.setProperty('--accent', q.get('accent'));
  const report = (score) => parent.postMessage({ type: 'hwtodo:score', score }, '*');
  const c = document.getElementById('c'), x = c.getContext('2d'), $ = (id) => document.getElementById(id);
  const W = 480, H = 640, COLORS = ['#ff4fd8', '#ff9f43', '#feca57', '#1dd1a1', '#54a0ff', '#a29bfe'];
  let pad, ball, bricks, score, lives, level, running = false, keys = {};
  function fit() { const s = Math.min(innerWidth / W, innerHeight / H); c.style.width = W * s + 'px'; c.style.height = H * s + 'px'; }
  addEventListener('resize', fit); fit();
  function build() { bricks = []; for (let r = 0; r < 6; r++) for (let i = 0; i < 8; i++) bricks.push({ x: 8 + i * 58, y: 70 + r * 24, w: 54, h: 18, c: COLORS[r], hp: r < Math.min(3, level - 1) ? 2 : 1 }); }
  function reset() { pad = { x: W / 2 - 45, w: 90 }; ball = { x: W / 2, y: H - 80, vx: 3 * (Math.random() < 0.5 ? -1 : 1), vy: -(4 + level * 0.5), stuck: true }; }
  function start() { score = 0; lives = 3; level = 1; build(); reset(); running = true; $('menu').style.display = 'none'; hud(); }
  function hud() { $('score').textContent = score; $('lives').textContent = lives; $('lvl').textContent = level; }
  function step() {
    if (running) {
      if (keys.l) pad.x -= 8; if (keys.r) pad.x += 8; pad.x = Math.max(0, Math.min(W - pad.w, pad.x));
      if (ball.stuck) { ball.x = pad.x + pad.w / 2; ball.y = H - 50; }
      else {
        ball.x += ball.vx; ball.y += ball.vy;
        if (ball.x < 6 || ball.x > W - 6) ball.vx *= -1;
        if (ball.y < 6) ball.vy = Math.abs(ball.vy);
        if (ball.y > H - 44 && ball.y < H - 30 && ball.x > pad.x - 6 && ball.x < pad.x + pad.w + 6 && ball.vy > 0) {
          const hit = (ball.x - (pad.x + pad.w / 2)) / (pad.w / 2);
          const sp = Math.hypot(ball.vx, ball.vy); ball.vx = sp * hit * 0.9; ball.vy = -Math.sqrt(Math.max(4, sp * sp - ball.vx * ball.vx));
        }
        for (const b of bricks) if (b.hp > 0 && ball.x > b.x - 5 && ball.x < b.x + b.w + 5 && ball.y > b.y - 5 && ball.y < b.y + b.h + 5) {
          b.hp--; score += b.hp ? 5 : 10; hud();
          const fromSide = ball.x < b.x || ball.x > b.x + b.w; if (fromSide) ball.vx *= -1; else ball.vy *= -1; break;
        }
        if (bricks.every((b) => b.hp <= 0)) { level++; score += 100; build(); reset(); hud(); }
        if (ball.y > H + 10) { lives--; hud(); if (lives <= 0) { running = false; report(score); $('menu').style.display = 'grid'; $('menu').querySelector('h2').textContent = `Score ${score}`; $('go').textContent = 'Again'; } else reset(); }
      }
    }
    x.fillStyle = '#120d33'; x.fillRect(0, 0, W, H);
    for (const b of bricks || []) if (b.hp > 0) { x.fillStyle = b.c; x.globalAlpha = b.hp > 1 ? 1 : 0.8; x.fillRect(b.x, b.y, b.w, b.h); x.globalAlpha = 1; if (b.hp > 1) { x.strokeStyle = '#fff'; x.strokeRect(b.x + 2, b.y + 2, b.w - 4, b.h - 4); } }
    if (pad) { x.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--accent'); x.fillRect(pad.x, H - 40, pad.w, 10); x.fillStyle = '#fff'; x.beginPath(); x.arc(ball.x, ball.y, 6, 0, 7); x.fill(); }
    requestAnimationFrame(step);
  }
  const launch = () => { if (ball && ball.stuck) ball.stuck = false; };
  addEventListener('pointermove', (e) => { if (!pad) return; const r = c.getBoundingClientRect(); pad.x = ((e.clientX - r.left) / r.width) * W - pad.w / 2; });
  addEventListener('pointerdown', launch);
  addEventListener('keydown', (e) => { if (e.key === 'ArrowLeft' || e.key === 'a') keys.l = true; if (e.key === 'ArrowRight' || e.key === 'd') keys.r = true; if (e.key === ' ') { e.preventDefault(); launch(); } });
  addEventListener('keyup', (e) => { if (e.key === 'ArrowLeft' || e.key === 'a') keys.l = false; if (e.key === 'ArrowRight' || e.key === 'd') keys.r = false; });
  $('go').onclick = (e) => { e.stopPropagation(); start(); };
  level = 1; build(); step();
</script>
</body>
</html>
