<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Paper-plane glider</title>
<style>
  :root { --bg: #fdfbf3; --fg: #2b2f3a; --accent: #3b5bdb; --accent-2: #f59f00; --glow: color-mix(in srgb, var(--accent) 45%, transparent); --panel: rgba(255,255,255,.7); --line: rgba(40,50,90,.14); --shadow: rgba(40,50,90,.22); --btn-ink: #fff; }
  html.dark { --panel: rgba(255,255,255,.08); --line: rgba(255,255,255,.14); --shadow: rgba(0,0,0,.5); }
  html, body { margin: 0; height: 100%; color: var(--fg); font: 500 15px/1.35 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; overflow: hidden; touch-action: none; user-select: none; }
  body { display: grid; place-items: center; background: radial-gradient(120% 80% at 50% -10%, color-mix(in srgb, var(--accent) 22%, var(--bg)), var(--bg) 60%), var(--bg); }
  canvas { display: block; border-radius: 12px; box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 40%, transparent), 0 0 34px var(--glow), 0 22px 50px var(--shadow); }
  .hud { position: fixed; top: 8px; left: 12px; display: flex; gap: 8px; flex-wrap: wrap; font-weight: 800; pointer-events: none; z-index: 2; }
  .hud > span { padding: 6px 14px; border-radius: 999px; background: linear-gradient(180deg, color-mix(in srgb, var(--panel) 100%, #fff 6%), var(--panel)); border: 1px solid var(--line); box-shadow: inset 0 1px 0 rgba(255,255,255,.2), 0 4px 14px var(--shadow); font-size: 13px; letter-spacing: .04em; text-transform: uppercase; backdrop-filter: blur(6px); }
  .hud b { display: inline-block; font-size: 16px; font-variant-numeric: tabular-nums; color: var(--accent); margin-left: 4px; text-shadow: 0 0 10px var(--glow); }
  #pause { position: fixed; top: 8px; right: 10px; width: 40px; height: 34px; border: 1px solid var(--line); border-radius: 999px; background: linear-gradient(180deg, color-mix(in srgb, var(--panel) 100%, #fff 6%), var(--panel)); color: var(--fg); font-size: 16px; cursor: pointer; z-index: 2; box-shadow: 0 4px 14px var(--shadow); }
  .center { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; text-align: center; z-index: 3; }
  .center > div { padding: 18px 26px; border-radius: 22px; background: linear-gradient(180deg, color-mix(in srgb, var(--panel) 100%, #fff 8%), var(--panel)); border: 1px solid var(--line); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 35%, transparent), 0 0 34px var(--glow), 0 22px 50px var(--shadow); backdrop-filter: blur(10px); max-width: 86vw; box-sizing: border-box; }
  .center h2 { margin: 0 0 6px; font-size: clamp(24px, 6vw, 34px); font-weight: 900; letter-spacing: -0.02em; background: linear-gradient(90deg, var(--accent), var(--accent-2)); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 0 14px var(--glow)); }
  .center p { margin: 0 0 14px; font-weight: 600; opacity: .85; }
  .center button { pointer-events: auto; font: inherit; padding: 10px 22px; border: 0; border-radius: 999px; background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: var(--btn-ink); font-weight: 900; letter-spacing: .02em; cursor: pointer; box-shadow: 0 8px 22px var(--glow), inset 0 1px 0 rgba(255,255,255,.4); transition: filter .12s, box-shadow .12s, transform .12s; }
  .center button:hover { filter: brightness(1.08); box-shadow: 0 12px 28px var(--glow), inset 0 1px 0 rgba(255,255,255,.4); }
  .center button:active { transform: scale(.96); animation: none; }
  /* juice */
  .pop { animation: pop .38s cubic-bezier(.3,1.6,.5,1); }
  @keyframes pop { 35% { transform: scale(1.35); } }
  .nb { animation: nb 1.1s ease-in-out 3; }
  @keyframes nb { 50% { color: #ffd54a; text-shadow: 0 0 14px #ffc93a, 0 0 28px #ff9f1a; } }
  .fx { position: fixed; z-index: 9; pointer-events: none; font: 900 20px system-ui, sans-serif; color: var(--accent); text-shadow: 0 0 12px var(--glow), 0 2px 0 rgba(0,0,0,.3); transform: translate(-50%, -50%); animation: rise .8s ease-out forwards; white-space: nowrap; }
  @keyframes rise { to { transform: translate(-50%, -160%); opacity: 0; } }
  .spark { position: fixed; z-index: 9; pointer-events: none; width: 7px; height: 7px; border-radius: 50%; margin: -3px 0 0 -3px; box-shadow: 0 0 8px currentColor; animation: spark .6s ease-out forwards; }
  @keyframes spark { to { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; } }
  body.flash::after { content: ''; position: fixed; inset: 0; z-index: 8; pointer-events: none; background: var(--flash, rgba(255,70,90,.4)); animation: flash .45s ease-out forwards; }
  @keyframes flash { to { opacity: 0; } }
  body.shake canvas { animation: shake .4s; }
  @keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
  @media (prefers-reduced-motion: no-preference) { #go { animation: float 2.4s ease-in-out infinite; } }
  @keyframes float { 50% { filter: brightness(1.18) drop-shadow(0 0 10px var(--accent)); } }
  @media (prefers-reduced-motion: reduce) { .pop, .nb, .fx, .spark, body.flash::after, body.shake canvas { animation-duration: .01s; } }
</style>
</head>
<body>
<canvas id="c" width="480" height="640" role="img" aria-label="Paper plane gliding between pencils"></canvas>
<div class="hud" aria-live="polite"><span>Score <b id="score">0</b></span><span>Best <b id="best">0</b></span></div>
<button id="pause" aria-label="Pause">⏸</button>
<div class="center" id="menu"><div><h2>✈️ Paper-plane glider</h2><p id="tip">Tap, click or press Space to lift.<br />Glide through the gaps between the pencils. P pauses.</p><button id="go">Fly</button></div></div>
<script>
  // Homework To-Do arcade game. Report scores with parent.postMessage({ type: 'hwtodo:score', score }, '*').
  const q = new URLSearchParams(location.search), root = document.documentElement.style;
  if (q.get('accent')) root.setProperty('--accent', q.get('accent'));
  const dark = q.get('dark') === '1';
  if (dark) { root.setProperty('--bg', '#141925'); root.setProperty('--fg', '#e6e9f2'); document.documentElement.classList.add('dark'); }
  const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const report = (score) => parent.postMessage({ type: 'hwtodo:score', score }, '*');
  // --- visual juice (no game logic here) ---
  const FX = (() => {
    const calm = matchMedia('(prefers-reduced-motion: reduce)').matches; let live = 0;
    const re = (el, cls) => { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); };
    const at = (el) => { const r = el.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; };
    const text = (t, x, y, color) => { if (live > 40) return; live++; const d = document.createElement('div'); d.className = 'fx'; d.textContent = t; d.style.left = x + 'px'; d.style.top = y + 'px'; if (color) d.style.color = color; document.body.appendChild(d); setTimeout(() => { d.remove(); live--; }, 800); };
    const burst = (x, y, color, k = 8) => { if (calm) return; for (let i = 0; i < k && live < 40; i++) { live++; const d = document.createElement('i'); d.className = 'spark'; const a = Math.random() * 6.283, r = 26 + Math.random() * 44; d.style.cssText = `left:${x}px;top:${y}px;color:${color};background:${color};--dx:${Math.cos(a) * r}px;--dy:${Math.sin(a) * r}px`; document.body.appendChild(d); setTimeout(() => { d.remove(); live--; }, 600); } };
    const flash = (color) => { document.body.style.setProperty('--flash', color || ''); re(document.body, 'flash'); setTimeout(() => document.body.classList.remove('flash'), 500); };
    const shake = () => { if (calm) return; re(document.body, 'shake'); setTimeout(() => document.body.classList.remove('shake'), 450); };
    const watch = (id, opts = {}) => { const el = document.getElementById(id); if (!el) return; let prev = parseFloat(el.textContent) || 0; new MutationObserver(() => { const v = parseFloat(el.textContent); if (isNaN(v) || v === prev) return; const d = v - prev; prev = v; re(el, 'pop'); if (opts.best) { re(el, 'nb'); const [x, y] = at(el); text('New best!', x, y - 10, '#ffd54a'); } else if (opts.delta && d > 0) { const [x, y] = at(el); text('+' + Math.round(d), x, y - 8); } }).observe(el, { childList: true, characterData: true, subtree: true }); };
    const cpt = (cv, cx, cy, cw, ch) => { const r = cv.getBoundingClientRect(); return [r.left + (cx / cw) * r.width, r.top + (cy / ch) * r.height]; };
    return { calm, text, burst, flash, shake, watch, at, cpt, re };
  })();
  FX.watch('score', { delta: true }); FX.watch('best', { best: true });
  const c = document.getElementById('c'), x = c.getContext('2d'), $ = (id) => document.getElementById(id);
  const W = 480, H = 640, PX = 120, PW = 56, FLOOR = H - 26;
  // lined notebook paper: light by default, a dark "night notebook" when the app is dark
  const P = dark ? { paper: '#1b2233', line: '#2e3b58', margin: '#7a3346', plane: '#eef1f8', ink: '#c9d2e8', desk: '#3a2f28' } : { paper: '#fffef8', line: '#c9d8f0', margin: '#f0a3a3', plane: '#ffffff', ink: '#2b2f3a', desk: '#c8a27a' };
  const PENCILS = ['#f7c948', '#ff8a65', '#81c784', '#64b5f6', '#ba68c8'];
  let plane, cols, doodles, score = 0, best = 0, speed, state = 'menu', paused = false, last = 0, acc = 0, scroll = 0, trail = [], overAt = 0;
  function fit() { const s = Math.min(innerWidth / W, innerHeight / H); c.style.width = W * s + 'px'; c.style.height = H * s + 'px'; }
  addEventListener('resize', fit); fit();
  function gapSize() { return Math.max(150, 200 - score * 2); }
  function addCol(px) { const prev = cols.length ? cols[cols.length - 1].gy : H / 2, g = gapSize(); const gy = Math.max(90 + g / 2, Math.min(FLOOR - 50 - g / 2, prev + (Math.random() - 0.5) * 260)); cols.push({ x: px, gy, g, c: PENCILS[Math.floor(Math.random() * PENCILS.length)], passed: false }); }
  function start() { plane = { y: H / 2, vy: 0 }; cols = []; for (let i = 0; i < 3; i++) addCol(W + 80 + i * 220); score = 0; speed = 2.3; trail = []; state = 'flying'; paused = false; $('menu').style.display = 'none'; hud(); }
  function hud() { $('score').textContent = score; $('best').textContent = best; }
  function lift() { if (state === 'flying' && !paused) plane.vy = -5.4; else if (state === 'menu' || (state === 'over' && performance.now() - overAt > 700)) start(); }
  function over() { state = 'over'; overAt = performance.now(); FX.flash(); FX.shake(); FX.burst(...FX.cpt(c, PX, plane.y, W, H), '#ff8a65', 12); best = Math.max(best, score); hud(); report(score); $('menu').style.display = 'grid'; $('menu').querySelector('h2').textContent = `Score ${score}`; $('tip').textContent = score >= best && score > 0 ? 'New best this session!' : 'Crumpled. Try again?'; $('go').textContent = 'Again'; }
  function tick() {
    scroll += state === 'flying' ? speed : 0.6;
    if (state !== 'flying') return;
    plane.vy = Math.min(6, plane.vy + 0.24); plane.y += plane.vy;
    if (plane.y < 14) { plane.y = 14; plane.vy = 0; }
    if (!calm) { trail.push({ x: PX, y: plane.y }); trail.forEach((t) => (t.x -= speed)); trail = trail.filter((t) => t.x > -10); }
    for (const col of cols) {
      col.x -= speed;
      if (!col.passed && col.x + PW < PX - 14) { col.passed = true; score++; speed = Math.min(3.8, speed + 0.05); hud(); FX.burst(...FX.cpt(c, col.x + PW / 2, col.gy, W, H), col.c, 5); }
      // hit box: the pencil body, with the sharpened tip counting as a narrower block
      const inX = PX + 14 > col.x && PX - 14 < col.x + PW, inTipX = PX + 10 > col.x + PW * 0.25 && PX - 10 < col.x + PW * 0.75;
      const top = col.gy - col.g / 2, bot = col.gy + col.g / 2;
      if ((inX && (plane.y - 8 < top - 30 || plane.y + 8 > bot + 30)) || (inTipX && (plane.y - 8 < top || plane.y + 8 > bot))) return over();
    }
    if (cols[0].x < -PW - 10) cols.shift();
    if (cols[cols.length - 1].x < W - 160) addCol(cols[cols.length - 1].x + 220);
    if (plane.y + 10 >= FLOOR) { plane.y = FLOOR - 10; return over(); }
  }
  function pencil(px, y0, y1, color, down) {
    // body from y0 to y1, the tip (30px) at the gap end
    const tipY = down ? y1 : y0, bodyA = down ? y0 : y0 + 30, bodyB = down ? y1 - 30 : y1;
    x.fillStyle = color; x.fillRect(px, bodyA, PW, bodyB - bodyA);
    x.fillStyle = 'rgba(0,0,0,.12)'; x.fillRect(px + PW / 3, bodyA, PW / 3, bodyB - bodyA);
    x.fillStyle = '#e8c9a0'; x.beginPath(); x.moveTo(px, down ? bodyB : bodyA); x.lineTo(px + PW, down ? bodyB : bodyA); x.lineTo(px + PW / 2, tipY); x.closePath(); x.fill();
    x.fillStyle = '#333'; x.beginPath(); x.moveTo(px + PW * 0.38, down ? tipY - 11 : tipY + 11); x.lineTo(px + PW * 0.62, down ? tipY - 11 : tipY + 11); x.lineTo(px + PW / 2, tipY); x.closePath(); x.fill();
    x.strokeStyle = P.ink; x.lineWidth = 1.5; x.strokeRect(px, bodyA, PW, bodyB - bodyA);
  }
  function draw() {
    x.fillStyle = P.paper; x.fillRect(0, 0, W, H);
    x.strokeStyle = P.line; x.lineWidth = 1; for (let y = 70; y < H; y += 32) { x.beginPath(); x.moveTo(0, y); x.lineTo(W, y); x.stroke(); }
    const mx = (((44 - scroll * 0.2) % (W + 60)) + W + 60) % (W + 60); x.strokeStyle = P.margin; x.lineWidth = 2; x.beginPath(); x.moveTo(mx, 0); x.lineTo(mx, H); x.stroke();
    // pencil-sketch doodles drifting behind
    x.strokeStyle = P.line; x.lineWidth = 2;
    for (const d of doodles) { const dx = ((d.x - scroll * 0.35) % (W + 120) + W + 120) % (W + 120) - 60; x.beginPath(); if (d.k) { for (let a = 0; a <= 10; a++) { const r = a % 2 ? 7 : 16, t = (a / 10) * Math.PI * 2 - 1.57; x.lineTo(dx + Math.cos(t) * r, d.y + Math.sin(t) * r); } } else { x.arc(dx, d.y, 12, Math.PI, 0); x.arc(dx + 18, d.y, 9, Math.PI, 0); } x.stroke(); }
    for (const col of cols || []) { const top = col.gy - col.g / 2, bot = col.gy + col.g / 2; pencil(col.x, -10, top, col.c, true); pencil(col.x, bot, FLOOR, col.c, false); }
    x.fillStyle = P.desk; x.fillRect(0, FLOOR, W, H - FLOOR);
    if (plane) {
      x.strokeStyle = P.ink; x.setLineDash([4, 6]); x.lineWidth = 1.5; x.beginPath(); trail.forEach((t, i) => x[i ? 'lineTo' : 'moveTo'](t.x - 16, t.y + 2)); x.stroke(); x.setLineDash([]);
      x.save(); x.translate(PX, plane.y); x.rotate(Math.max(-0.45, Math.min(0.8, plane.vy * 0.08)));
      x.fillStyle = P.plane; x.strokeStyle = P.ink; x.lineWidth = 1.6; x.lineJoin = 'round'; x.shadowColor = 'rgba(0,0,0,.35)'; x.shadowBlur = 10; x.shadowOffsetY = 6;
      x.beginPath(); x.moveTo(18, 0); x.lineTo(-16, -11); x.lineTo(-8, 1); x.closePath(); x.fill(); x.shadowBlur = 0; x.shadowOffsetY = 0; x.stroke();
      x.beginPath(); x.moveTo(18, 0); x.lineTo(-8, 1); x.lineTo(-12, 9); x.closePath(); x.fillStyle = dark ? '#c7cfe3' : '#e7ebf3'; x.fill(); x.stroke();
      x.restore();
    }
    if (paused) { x.fillStyle = P.ink; x.font = '800 30px system-ui, sans-serif'; x.textAlign = 'center'; x.fillText('Paused · press P', W / 2, H / 2); x.textAlign = 'start'; }
  }
  // fixed 60 Hz physics so the plane glides the same on any refresh rate
  function loop(now) { const dt = Math.min(100, now - (last || now)); last = now; if (!paused) { acc += dt; while (acc >= 1000 / 60) { tick(); acc -= 1000 / 60; } } draw(); requestAnimationFrame(loop); }
  function pause(on = !paused) { if (state !== 'flying') return; paused = on; acc = 0; $('pause').textContent = paused ? '▶' : '⏸'; $('pause').setAttribute('aria-label', paused ? 'Resume' : 'Pause'); }
  addEventListener('keydown', (e) => {
    if (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'w') { e.preventDefault(); if (!e.repeat) lift(); }
    if (e.key === 'p' || e.key === 'P') pause();
  });
  c.addEventListener('pointerdown', (e) => { e.preventDefault(); lift(); });
  addEventListener('blur', () => pause(true));
  document.addEventListener('visibilitychange', () => { if (document.hidden) pause(true); });
  $('pause').onclick = () => pause();
  $('go').onclick = start;
  doodles = Array.from({ length: 6 }, (_, i) => ({ x: i * 110 + Math.random() * 40, y: 100 + Math.random() * (H - 260), k: i % 2 }));
  requestAnimationFrame(loop);
</script>
</body>
</html>
