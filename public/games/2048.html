<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>2048</title>
<style>
  :root { --bg: #0f1115; --fg: #e8eaf0; --accent: #6c5ce7; --accent-2: #00cec9; --glow: color-mix(in srgb, var(--accent) 55%, transparent); --panel: rgba(255,255,255,.08); --line: rgba(255,255,255,.14); --shadow: rgba(0,0,0,.5); --field: #181c26; --cell: #262b38; --btn-ink: #fff; }
  html.light { --panel: rgba(0,0,0,.06); --line: rgba(0,0,0,.1); --shadow: rgba(30,40,80,.22); --field: #1c2130; --cell: #2a3040; }
  html, body { margin: 0; height: 100%; color: var(--fg); font: 500 15px/1.35 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; display: grid; place-items: center; touch-action: none; }
  body { background: radial-gradient(120% 80% at 50% -10%, color-mix(in srgb, var(--accent) 26%, var(--bg)), var(--bg) 60%), var(--bg); }
  .wrap { display: grid; gap: 12px; justify-items: center; padding: 10px; }
  .title { margin: 0; font-size: clamp(24px, 6vw, 34px); font-weight: 900; letter-spacing: -0.02em; background: linear-gradient(90deg, var(--accent), var(--accent-2)); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 0 14px var(--glow)); }
  .hud { display: flex; gap: 10px; font-weight: 800; align-items: center; flex-wrap: wrap; justify-content: center; }
  .hud span { padding: 6px 14px; border-radius: 999px; background: linear-gradient(180deg, color-mix(in srgb, var(--panel) 100%, #fff 6%), var(--panel)); border: 1px solid var(--line); box-shadow: inset 0 1px 0 rgba(255,255,255,.14), 0 4px 14px var(--shadow); font-size: 13px; letter-spacing: .04em; text-transform: uppercase; opacity: .95; }
  .hud b { display: inline-block; font-size: 16px; font-variant-numeric: tabular-nums; color: var(--accent); margin-left: 4px; text-shadow: 0 0 10px var(--glow); }
  .board { box-sizing: border-box; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; background: linear-gradient(160deg, color-mix(in srgb, var(--field) 100%, #fff 5%), var(--field)); padding: 8px; border-radius: 16px; width: min(360px, 92vw); aspect-ratio: 1; box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 45%, transparent), 0 0 34px var(--glow), 0 22px 50px var(--shadow); }
  .cell { border-radius: 10px; background-color: var(--cell); background-image: linear-gradient(180deg, rgba(255,255,255,.16), rgba(255,255,255,0) 45%, rgba(0,0,0,.14)); display: grid; place-items: center; font-weight: 900; font-size: clamp(16px, 6vw, 30px); font-variant-numeric: tabular-nums; box-shadow: inset 0 1px 0 rgba(255,255,255,.12), 0 3px 8px rgba(0,0,0,.25); text-shadow: 0 1px 0 rgba(0,0,0,.2); }
  .cell.hot { box-shadow: inset 0 1px 0 rgba(255,255,255,.3), 0 0 18px rgba(255,200,60,.55), 0 3px 8px rgba(0,0,0,.25); }
  html.light .cell { color: #fff; }
  button { font: inherit; padding: 8px 18px; border-radius: 999px; border: 0; background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: var(--btn-ink); font-weight: 900; letter-spacing: .02em; cursor: pointer; box-shadow: 0 8px 22px var(--glow), inset 0 1px 0 rgba(255,255,255,.4); transition: filter .12s, box-shadow .12s, transform .12s; }
  button:hover { filter: brightness(1.08); transform: translateY(-1px); box-shadow: 0 12px 28px var(--glow), inset 0 1px 0 rgba(255,255,255,.4); }
  button:active { transform: scale(.96); animation: none; }
  .msg { min-height: 20px; font-weight: 700; opacity: .85; text-align: center; }
  /* juice */
  .pop { animation: pop .38s cubic-bezier(.3,1.6,.5,1); }
  @keyframes pop { 35% { transform: scale(1.35); } }
  .nb { animation: nb 1.1s ease-in-out 3; }
  @keyframes nb { 50% { color: #ffd54a; text-shadow: 0 0 14px #ffc93a, 0 0 28px #ff9f1a; } }
  .cell.new { animation: tileIn .22s cubic-bezier(.3,1.5,.5,1) backwards; }
  @keyframes tileIn { from { transform: scale(.3); opacity: 0; } }
  .cell.merge { animation: merge .3s cubic-bezier(.3,1.6,.5,1); }
  @keyframes merge { 40% { transform: scale(1.18); } }
  .fx { position: fixed; z-index: 9; pointer-events: none; font: 900 20px system-ui, sans-serif; color: var(--accent); text-shadow: 0 0 12px var(--glow), 0 2px 0 rgba(0,0,0,.3); transform: translate(-50%, -50%); animation: rise .8s ease-out forwards; white-space: nowrap; }
  @keyframes rise { to { transform: translate(-50%, -160%); opacity: 0; } }
  .spark { position: fixed; z-index: 9; pointer-events: none; width: 7px; height: 7px; border-radius: 50%; margin: -3px 0 0 -3px; box-shadow: 0 0 8px currentColor; animation: spark .6s ease-out forwards; }
  @keyframes spark { to { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; } }
  body.flash::after { content: ''; position: fixed; inset: 0; z-index: 8; pointer-events: none; background: var(--flash, rgba(255,70,90,.4)); animation: flash .45s ease-out forwards; }
  @keyframes flash { to { opacity: 0; } }
  body.shake .wrap { animation: shake .4s; }
  @keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
  @media (prefers-reduced-motion: no-preference) { #new { animation: float 2.4s ease-in-out infinite; } }
  @keyframes float { 50% { filter: brightness(1.18) drop-shadow(0 0 10px var(--accent)); } }
  @media (prefers-reduced-motion: reduce) { .pop, .nb, .fx, .spark, .cell.new, .cell.merge, body.flash::after, body.shake .wrap { animation-duration: .01s; } }
</style>
</head>
<body>
<div class="wrap">
  <h1 class="title">🔢 2048</h1>
  <div class="hud"><span>Score <b id="score">0</b></span><span>Best <b id="best">0</b></span><button id="new">New game</button></div>
  <div class="board" id="b"></div>
  <div class="msg" id="msg">Arrow keys or swipe.</div>
</div>
<script>
  const q = new URLSearchParams(location.search);
  if (q.get('accent')) document.documentElement.style.setProperty('--accent', q.get('accent'));
  if (q.get('dark') === '0') { document.documentElement.style.setProperty('--bg', '#f4f6fb'); document.documentElement.style.setProperty('--fg', '#111'); document.documentElement.classList.add('light'); }
  const report = (score) => parent.postMessage({ type: 'hwtodo:score', score }, '*');
  // --- visual juice (no game logic here) ---
  const FX = (() => {
    const calm = matchMedia('(prefers-reduced-motion: reduce)').matches; let live = 0;
    const re = (el, cls) => { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); };
    const at = (el) => { const r = el.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; };
    const text = (t, x, y, color) => { if (live > 40) return; live++; const d = document.createElement('div'); d.className = 'fx'; d.textContent = t; d.style.left = x + 'px'; d.style.top = y + 'px'; if (color) d.style.color = color; document.body.appendChild(d); setTimeout(() => { d.remove(); live--; }, 800); };
    const burst = (x, y, color, k = 8) => { if (calm) return; for (let i = 0; i < k && live < 40; i++) { live++; const d = document.createElement('i'); d.className = 'spark'; const a = Math.random() * 6.283, r = 26 + Math.random() * 44; d.style.cssText = `left:${x}px;top:${y}px;color:${color};background:${color};--dx:${Math.cos(a) * r}px;--dy:${Math.sin(a) * r}px`; document.body.appendChild(d); setTimeout(() => { d.remove(); live--; }, 600); } };
    const flash = (color) => { document.body.style.setProperty('--flash', color || ''); re(document.body, 'flash'); setTimeout(() => document.body.classList.remove('flash'), 500); };
    const shake = () => { if (calm) return; re(document.body, 'shake'); setTimeout(() => document.body.classList.remove('shake'), 450); };
    const watch = (id, opts = {}) => { const el = document.getElementById(id); if (!el) return; let prev = parseFloat(el.textContent) || 0; new MutationObserver(() => { const v = parseFloat(el.textContent); if (isNaN(v) || v === prev) return; const d = v - prev; prev = v; re(el, 'pop'); if (opts.best) { re(el, 'nb'); const [x, y] = at(el); text('New best!', x, y - 10, '#ffd54a'); } else if (opts.delta && d > 0) { const [x, y] = at(el); text('+' + Math.round(d), x, y - 8); } }).observe(el, { childList: true, characterData: true, subtree: true }); };
    return { calm, text, burst, flash, shake, watch, at };
  })();
  FX.watch('score', { delta: true }); FX.watch('best', { best: true });
  const $ = (id) => document.getElementById(id);
  const COLORS = { 2: '#3b4252', 4: '#434c5e', 8: '#f2b179', 16: '#f59563', 32: '#f67c5f', 64: '#f65e3b', 128: '#edcf72', 256: '#edcc61', 512: '#edc850', 1024: '#edc53f', 2048: '#edc22e' };
  let g, score, best = 0, done, prevG = [], hit2048 = false;
  function reset() { g = Array(16).fill(0); score = 0; done = false; hit2048 = false; prevG = []; add(); add(); render(); $('msg').textContent = 'Arrow keys or swipe.'; }
  function add() { const e = g.map((v, i) => (v ? -1 : i)).filter((i) => i >= 0); if (e.length) g[e[Math.floor(Math.random() * e.length)]] = Math.random() < 0.9 ? 2 : 4; }
  function render() {
    $('b').innerHTML = g.map((v, i) => { const p = prevG[i] || 0; const cls = (v && !p ? ' new' : v && p && v === p * 2 ? ' merge' : '') + (v >= 128 ? ' hot' : ''); return `<div class="cell${cls}" style="background-color:${v ? COLORS[v] || 'var(--accent)' : ''};color:${v > 4 ? '#fff' : ''}">${v || ''}</div>`; }).join('');
    prevG = g.slice();
    if (!FX.calm) { let k = 0; $('b').querySelectorAll('.merge').forEach((el) => { if (k++ < 3) FX.burst(...FX.at(el), '#ffd54a', 6); }); }
    $('score').textContent = score;
  }
  function line(a) { const f = a.filter(Boolean); for (let i = 0; i < f.length - 1; i++) if (f[i] === f[i + 1]) { f[i] *= 2; score += f[i]; f.splice(i + 1, 1); } while (f.length < 4) f.push(0); return f; }
  function move(d) {
    if (done) return;
    const before = g.join();
    for (let k = 0; k < 4; k++) {
      const idx = [0, 1, 2, 3].map((i) => (d === 'left' ? k * 4 + i : d === 'right' ? k * 4 + 3 - i : d === 'up' ? i * 4 + k : (3 - i) * 4 + k));
      const out = line(idx.map((i) => g[i]));
      idx.forEach((i, j) => (g[i] = out[j]));
    }
    if (g.join() !== before) { add(); render(); }
    if (g.includes(2048) && !done) { $('msg').textContent = '2048! Keep going for a higher score.'; if (!hit2048) { hit2048 = true; FX.flash('rgba(255,213,74,.35)'); FX.burst(...FX.at($('b')), '#ffd54a', 14); } }
    if (!canMove()) { done = true; FX.flash(); FX.shake(); best = Math.max(best, score); $('best').textContent = best; $('msg').textContent = 'No moves left.'; report(score); }
  }
  function canMove() { if (g.includes(0)) return true; for (let i = 0; i < 16; i++) { if (i % 4 < 3 && g[i] === g[i + 1]) return true; if (i < 12 && g[i] === g[i + 4]) return true; } return false; }
  addEventListener('keydown', (e) => { const d = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down', a: 'left', d: 'right', w: 'up', s: 'down' }[e.key]; if (d) { e.preventDefault(); move(d); } });
  let t0; addEventListener('touchstart', (e) => (t0 = e.touches[0]), { passive: true });
  addEventListener('touchend', (e) => { const t = e.changedTouches[0], dx = t.clientX - t0.clientX, dy = t.clientY - t0.clientY; if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return; move(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : dy > 0 ? 'down' : 'up'); });
  $('new').onclick = () => { if (score) report(score); reset(); };
  reset();
</script>
</body>
</html>
