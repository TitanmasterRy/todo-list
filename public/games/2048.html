<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>2048</title>
<style>
  :root { --bg: #0f1115; --fg: #e8eaf0; --accent: #6c5ce7; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 15px system-ui, sans-serif; display: grid; place-items: center; touch-action: none; }
  .wrap { display: grid; gap: 10px; justify-items: center; }
  .hud { display: flex; gap: 16px; font-weight: 700; align-items: center; }
  .board { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; background: #1f232c; padding: 8px; border-radius: 12px; width: min(360px, 92vw); aspect-ratio: 1; }
  .cell { border-radius: 8px; background: #2a2f3a; display: grid; place-items: center; font-weight: 800; font-size: clamp(16px, 6vw, 30px); transition: transform 80ms; }
  button { font: inherit; padding: 6px 14px; border-radius: 8px; border: 0; background: var(--accent); color: #fff; font-weight: 700; cursor: pointer; }
  .msg { min-height: 20px; font-weight: 700; }
</style>
</head>
<body>
<div class="wrap">
  <div class="hud"><span>Score <b id="score">0</b></span><span>Best <b id="best">0</b></span><button id="new">New game</button></div>
  <div class="board" id="b"></div>
  <div class="msg" id="msg">Arrow keys or swipe.</div>
</div>
<script>
  const q = new URLSearchParams(location.search);
  if (q.get('accent')) document.documentElement.style.setProperty('--accent', q.get('accent'));
  const report = (score) => parent.postMessage({ type: 'hwtodo:score', score }, '*');
  const $ = (id) => document.getElementById(id);
  const COLORS = { 2: '#3b4252', 4: '#434c5e', 8: '#f2b179', 16: '#f59563', 32: '#f67c5f', 64: '#f65e3b', 128: '#edcf72', 256: '#edcc61', 512: '#edc850', 1024: '#edc53f', 2048: '#edc22e' };
  let g, score, best = 0, done;
  function reset() { g = Array(16).fill(0); score = 0; done = false; add(); add(); render(); $('msg').textContent = 'Arrow keys or swipe.'; }
  function add() { const e = g.map((v, i) => (v ? -1 : i)).filter((i) => i >= 0); if (e.length) g[e[Math.floor(Math.random() * e.length)]] = Math.random() < 0.9 ? 2 : 4; }
  function render() {
    $('b').innerHTML = g.map((v) => `<div class="cell" style="background:${v ? COLORS[v] || 'var(--accent)' : ''};color:${v > 4 ? '#fff' : ''}">${v || ''}</div>`).join('');
    $('score').textContent = score;
  }
  function line(a) { const f = a.filter(Boolean); for (let i = 0; i < f.length - 1; i++) if (f[i] === f[i + 1]) { f[i] *= 2; score += f[i]; f.splice(i + 1, 1); } while (f.length < 4) f.push(0); return f; }
  function move(d) {
    if (done) return;
    const before = g.join();
    for (let k = 0; k < 4; k++) {
      const idx = [0, 1, 2, 3].map((i) => (d === 'left' ? k * 4 + i : d === 'right' ? k * 4 + 3 - i : d === 'up' ? i * 4 + k : (3 - i) * 4 + k));
      const out = line(idx.map((i) => g[i]));
      idx.forEach((i, j) => (g[i] = out[j]));
    }
    if (g.join() !== before) { add(); render(); }
    if (g.includes(2048) && !done) $('msg').textContent = '2048! Keep going for a higher score.';
    if (!canMove()) { done = true; best = Math.max(best, score); $('best').textContent = best; $('msg').textContent = 'No moves left.'; report(score); }
  }
  function canMove() { if (g.includes(0)) return true; for (let i = 0; i < 16; i++) { if (i % 4 < 3 && g[i] === g[i + 1]) return true; if (i < 12 && g[i] === g[i + 4]) return true; } return false; }
  addEventListener('keydown', (e) => { const d = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down', a: 'left', d: 'right', w: 'up', s: 'down' }[e.key]; if (d) { e.preventDefault(); move(d); } });
  let t0; addEventListener('touchstart', (e) => (t0 = e.touches[0]), { passive: true });
  addEventListener('touchend', (e) => { const t = e.changedTouches[0], dx = t.clientX - t0.clientX, dy = t.clientY - t0.clientY; if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return; move(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : dy > 0 ? 'down' : 'up'); });
  $('new').onclick = () => { if (score) report(score); reset(); };
  reset();
</script>
</body>
</html>
