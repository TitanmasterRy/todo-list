<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Asteroids</title>
<style>
  :root { --bg: #05060f; --fg: #dfe6ff; --accent: #7c9cff; --accent-2: #c77dff; --glow: color-mix(in srgb, var(--accent) 55%, transparent); --panel: rgba(255,255,255,.08); --line: rgba(255,255,255,.14); --shadow: rgba(0,0,0,.5); --btn-ink: #05060f; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 500 15px/1.35 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; overflow: hidden; touch-action: none; }
  canvas { display: block; width: 100vw; height: 100vh; }
  .hud { position: fixed; top: 10px; left: 12px; display: flex; gap: 8px; font-weight: 800; z-index: 2; }
  .hud span { padding: 6px 14px; border-radius: 999px; background: linear-gradient(180deg, color-mix(in srgb, var(--panel) 100%, #fff 6%), var(--panel)); border: 1px solid var(--line); box-shadow: inset 0 1px 0 rgba(255,255,255,.14), 0 4px 14px var(--shadow); font-size: 13px; letter-spacing: .04em; text-transform: uppercase; backdrop-filter: blur(6px); }
  .hud b { display: inline-block; font-size: 16px; font-variant-numeric: tabular-nums; color: var(--accent); margin-left: 4px; text-shadow: 0 0 10px var(--glow); }
  .center { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; text-align: center; z-index: 3; }
  .center > div { padding: 22px 26px; border-radius: 22px; background: linear-gradient(180deg, color-mix(in srgb, var(--panel) 100%, #fff 6%), var(--panel)); border: 1px solid var(--line); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 35%, transparent), 0 0 34px var(--glow), 0 22px 50px var(--shadow); backdrop-filter: blur(10px); max-width: 86vw; }
  .center h2 { margin: 0 0 6px; font-size: clamp(24px, 6vw, 34px); font-weight: 900; letter-spacing: -0.02em; background: linear-gradient(90deg, var(--accent), var(--accent-2)); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 0 14px var(--glow)); }
  .center p { margin: 0 0 14px; font-weight: 600; opacity: .85; }
  .center button { pointer-events: auto; font: inherit; padding: 10px 22px; border-radius: 999px; border: 0; background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: var(--btn-ink); font-weight: 900; letter-spacing: .02em; cursor: pointer; box-shadow: 0 8px 22px var(--glow), inset 0 1px 0 rgba(255,255,255,.4); transition: filter .12s, box-shadow .12s, transform .12s; }
  .center button:hover { filter: brightness(1.08); box-shadow: 0 12px 28px var(--glow), inset 0 1px 0 rgba(255,255,255,.4); }
  .center button:active { transform: scale(.96); animation: none; }
  .pad { position: fixed; bottom: 14px; left: 0; right: 0; display: flex; justify-content: space-between; padding: 0 14px; z-index: 2; }
  .pad div { display: flex; gap: 10px; }
  .pad button { width: 62px; height: 62px; border-radius: 50%; border: 1px solid var(--line); background: linear-gradient(180deg, rgba(255,255,255,.2), rgba(255,255,255,.08)); color: #fff; font-size: 22px; box-shadow: inset 0 1px 0 rgba(255,255,255,.2), 0 6px 16px var(--shadow); }
  .pad button:active { background: var(--accent); color: var(--btn-ink); box-shadow: 0 0 18px var(--glow); }
  @media (hover: hover) { .pad { display: none; } }
  /* juice */
  .pop { animation: pop .38s cubic-bezier(.3,1.6,.5,1); }
  @keyframes pop { 35% { transform: scale(1.35); } }
  .fx { position: fixed; z-index: 9; pointer-events: none; font: 900 20px system-ui, sans-serif; color: var(--accent); text-shadow: 0 0 12px var(--glow), 0 2px 0 rgba(0,0,0,.3); transform: translate(-50%, -50%); animation: rise .8s ease-out forwards; white-space: nowrap; }
  @keyframes rise { to { transform: translate(-50%, -160%); opacity: 0; } }
  .spark { position: fixed; z-index: 9; pointer-events: none; width: 7px; height: 7px; border-radius: 50%; margin: -3px 0 0 -3px; box-shadow: 0 0 8px currentColor; animation: spark .6s ease-out forwards; }
  @keyframes spark { to { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; } }
  body.flash::after { content: ''; position: fixed; inset: 0; z-index: 8; pointer-events: none; background: var(--flash, rgba(255,70,90,.4)); animation: flash .45s ease-out forwards; }
  @keyframes flash { to { opacity: 0; } }
  body.shake canvas { animation: shake .4s; }
  @keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
  @media (prefers-reduced-motion: no-preference) { #go { animation: float 2.4s ease-in-out infinite; } }
  @keyframes float { 50% { transform: translateY(-4px); } }
  @media (prefers-reduced-motion: reduce) { .pop, .fx, .spark, body.flash::after, body.shake canvas { animation-duration: .01s; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud"><span>Score <b id="score">0</b></span><span>Lives <b id="lives">3</b></span></div>
<div class="center" id="menu"><div><h2>🚀 Asteroids</h2><p>← → rotate · ↑ thrust · Space shoot</p><button id="go">Launch</button></div></div>
<div class="pad"><div><button data-k="left">⟲</button><button data-k="right">⟳</button></div><div><button data-k="up">▲</button><button data-k="fire">●</button></div></div>
<script>
  const q = new URLSearchParams(location.search);
  if (q.get('accent')) document.documentElement.style.setProperty('--accent', q.get('accent'));
  const report = (score) => parent.postMessage({ type: 'hwtodo:score', score }, '*');
  // --- visual juice (no game logic here) ---
  const FX = (() => {
    const calm = matchMedia('(prefers-reduced-motion: reduce)').matches; let live = 0;
    const re = (el, cls) => { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); };
    const at = (el) => { const r = el.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; };
    const text = (t, x, y, color) => { if (live > 40) return; live++; const d = document.createElement('div'); d.className = 'fx'; d.textContent = t; d.style.left = x + 'px'; d.style.top = y + 'px'; if (color) d.style.color = color; document.body.appendChild(d); setTimeout(() => { d.remove(); live--; }, 800); };
    const burst = (x, y, color, k = 8) => { if (calm) return; for (let i = 0; i < k && live < 40; i++) { live++; const d = document.createElement('i'); d.className = 'spark'; const a = Math.random() * 6.283, r = 26 + Math.random() * 44; d.style.cssText = `left:${x}px;top:${y}px;color:${color};background:${color};--dx:${Math.cos(a) * r}px;--dy:${Math.sin(a) * r}px`; document.body.appendChild(d); setTimeout(() => { d.remove(); live--; }, 600); } };
    const flash = (color) => { document.body.style.setProperty('--flash', color || ''); re(document.body, 'flash'); setTimeout(() => document.body.classList.remove('flash'), 500); };
    const shake = () => { if (calm) return; re(document.body, 'shake'); setTimeout(() => document.body.classList.remove('shake'), 450); };
    const watch = (id) => { const el = document.getElementById(id); if (!el) return; let prev = el.textContent; new MutationObserver(() => { if (el.textContent === prev) return; prev = el.textContent; re(el, 'pop'); }).observe(el, { childList: true, characterData: true, subtree: true }); };
    return { calm, text, burst, flash, shake, watch, at };
  })();
  FX.watch('score'); FX.watch('lives');
  const c = document.getElementById('c'), x = c.getContext('2d'), $ = (id) => document.getElementById(id);
  let W, H, ship, rocks, shots, score, lives, keys = {}, running = false, cool = 0, inv = 0, stars, frame = 0;
  function size() { W = c.width = innerWidth; H = c.height = innerHeight; stars = Array.from({ length: 80 }, () => [Math.random() * W, Math.random() * H, Math.random()]); }
  addEventListener('resize', size); size();
  function rock(r, px, py) { const a = Math.random() * 6.28, s = (1.4 - r / 60) * (1 + Math.random()); return { x: px ?? Math.random() * W, y: py ?? (Math.random() < 0.5 ? 0 : H), vx: Math.cos(a) * s, vy: Math.sin(a) * s, r, pts: Array.from({ length: 10 }, () => 0.75 + Math.random() * 0.35) }; }
  function start() { ship = { x: W / 2, y: H / 2, a: -1.57, vx: 0, vy: 0 }; rocks = Array.from({ length: 4 }, () => rock(44)); shots = []; score = 0; lives = 3; inv = 120; running = true; $('menu').style.display = 'none'; hud(); }
  function hud() { $('score').textContent = score; $('lives').textContent = lives; }
  const wrap = (o) => { o.x = (o.x + W) % W; o.y = (o.y + H) % H; };
  function step() {
    frame++;
    x.fillStyle = '#05060f'; x.fillRect(0, 0, W, H);
    const gx = W * 0.5, gy = H * 0.3;
    x.fillStyle = 'rgba(80,90,200,.05)'; x.beginPath(); x.arc(gx, gy, Math.max(W, H) * 0.45, 0, 6.283); x.fill();
    stars.forEach(([sx, sy, b], i) => { x.fillStyle = `rgba(255,255,255,${0.3 + b * 0.6 * (0.6 + 0.4 * Math.sin(frame / 30 + i))})`; x.fillRect(sx, sy, b > 0.8 ? 2 : 1.5, b > 0.8 ? 2 : 1.5); });
    if (running) {
      if (keys.left) ship.a -= 0.07; if (keys.right) ship.a += 0.07;
      if (keys.up) { ship.vx += Math.cos(ship.a) * 0.12; ship.vy += Math.sin(ship.a) * 0.12; }
      ship.vx *= 0.99; ship.vy *= 0.99; ship.x += ship.vx; ship.y += ship.vy; wrap(ship);
      if (keys.fire && cool <= 0 && shots.length < 6) { shots.push({ x: ship.x, y: ship.y, vx: Math.cos(ship.a) * 7 + ship.vx, vy: Math.sin(ship.a) * 7 + ship.vy, life: 60 }); cool = 12; }
      cool--; inv--;
      shots.forEach((s) => { s.x += s.vx; s.y += s.vy; s.life--; wrap(s); });
      shots = shots.filter((s) => s.life > 0);
      rocks.forEach((r) => { r.x += r.vx; r.y += r.vy; wrap(r); });
      for (const s of shots) for (const r of rocks) if (!r.dead && Math.hypot(s.x - r.x, s.y - r.y) < r.r) { r.dead = true; s.life = 0; const pts = r.r > 30 ? 20 : r.r > 15 ? 50 : 100; score += pts; FX.burst(r.x, r.y, r.r > 30 ? '#b8c1ec' : '#ffd54a', r.r > 30 ? 10 : 6); FX.text('+' + pts, r.x, r.y - 14); if (r.r > 15) rocks.push(rock(r.r / 2, r.x, r.y), rock(r.r / 2, r.x, r.y)); hud(); }
      rocks = rocks.filter((r) => !r.dead);
      if (!rocks.length) rocks = Array.from({ length: 5 }, () => rock(44));
      if (inv <= 0) for (const r of rocks) if (Math.hypot(ship.x - r.x, ship.y - r.y) < r.r + 8) { lives--; hud(); FX.flash(); FX.shake(); FX.burst(ship.x, ship.y, '#ff5c8a', 14); inv = 120; ship = { x: W / 2, y: H / 2, a: -1.57, vx: 0, vy: 0 }; if (lives <= 0) { running = false; report(score); $('menu').style.display = 'grid'; $('menu').querySelector('h2').textContent = `Game over · ${score}`; $('go').textContent = 'Again'; } break; }
      const accent = getComputedStyle(document.documentElement).getPropertyValue('--accent');
      if (inv < 0 || Math.floor(inv / 6) % 2) { x.save(); x.translate(ship.x, ship.y); x.rotate(ship.a); x.shadowColor = accent; x.shadowBlur = 14; x.strokeStyle = accent; x.lineWidth = 2; x.beginPath(); x.moveTo(14, 0); x.lineTo(-10, -9); x.lineTo(-6, 0); x.lineTo(-10, 9); x.closePath(); x.stroke(); if (keys.up) { x.shadowColor = '#ffb347'; x.strokeStyle = '#ffb347'; x.beginPath(); x.moveTo(-8, -4); x.lineTo(-16 - Math.random() * 6, 0); x.lineTo(-8, 4); x.stroke(); } x.restore(); }
      x.shadowColor = '#fff'; x.shadowBlur = 8; x.fillStyle = '#fff'; shots.forEach((s) => { x.fillRect(s.x - 1.5, s.y - 1.5, 3, 3); x.globalAlpha = .35; x.fillRect(s.x - s.vx - 1, s.y - s.vy - 1, 2, 2); x.globalAlpha = 1; }); x.shadowBlur = 0;
    }
    x.strokeStyle = '#b8c1ec'; x.lineWidth = 1.6; x.fillStyle = 'rgba(120,130,200,.08)';
    (rocks || []).forEach((r) => { x.beginPath(); r.pts.forEach((p, i) => { const a = (i / r.pts.length) * 6.283; x[i ? 'lineTo' : 'moveTo'](r.x + Math.cos(a) * r.r * p, r.y + Math.sin(a) * r.r * p); }); x.closePath(); x.fill(); x.stroke(); });
    requestAnimationFrame(step);
  }
  const map = { ArrowLeft: 'left', a: 'left', ArrowRight: 'right', d: 'right', ArrowUp: 'up', w: 'up', ' ': 'fire' };
  addEventListener('keydown', (e) => { if (map[e.key]) { keys[map[e.key]] = true; e.preventDefault(); } });
  addEventListener('keyup', (e) => { if (map[e.key]) keys[map[e.key]] = false; });
  document.querySelectorAll('.pad button').forEach((b) => { const k = b.dataset.k; b.addEventListener('touchstart', (e) => { e.preventDefault(); keys[k] = true; }); b.addEventListener('touchend', () => (keys[k] = false)); });
  $('go').onclick = start; rocks = Array.from({ length: 4 }, () => rock(44)); step();
</script>
</body>
</html>
