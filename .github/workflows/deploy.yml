name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # Vite base path is derived from the repository name so a rename keeps working.
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_PAGES: 'true'
          # optional: email/password accounts (repository Settings → Secrets and variables → Actions → Variables)
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_ARCADE_MANIFEST: ${{ vars.VITE_ARCADE_MANIFEST }}
          # optional: extra origins the page may connect to (a relay, a custom AI endpoint), space separated
          VITE_CSP_CONNECT: ${{ vars.VITE_CSP_CONNECT }}
          # optional: your own Jellyfin / Emby / video servers for Play → Watch, e.g. https://jellyfin.example.com (see WATCH.md)
          VITE_MEDIA_SERVERS: ${{ vars.VITE_MEDIA_SERVERS }}
          # optional: the hidden admin panel's passphrase hash (make one in the admin panel → Security)
          VITE_ADMIN_HASH: ${{ vars.VITE_ADMIN_HASH }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
