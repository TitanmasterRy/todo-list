# Render blueprint: New → Blueprint → pick this repo (or the Deploy button in DEPLOY.md).
services:
  - type: web
    name: homework-todo
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: '22'
    headers:
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
