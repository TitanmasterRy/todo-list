# Fly.io: `fly launch --copy-config --no-deploy` once, then `fly deploy`.
app = "homework-todo"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
